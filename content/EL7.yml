# EL7 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# Items cover the four CheckIt EL7 scenarios: compound interest, a growing population a*b^t,
# depreciation A(1-r)^t, and half-life A(1/2)^(t/h). Each CheckIt problem asks for an amount at a time and for a time.
code: EL7
h1: "EL7 Support: Applications of Exponential and Logarithmic Functions"
pageTitle: "EL7 Support: Applications of Exponential and Logarithmic Functions — Math 172, Santa Ana College"
hubSummary: "Applications: compound interest, population growth, depreciation, and half-life"
videoIntro: "A narrated walkthrough of exponential word problems: setting up the model, finding an amount after a given time, and using logarithms to find how long it takes."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'decimal|1 ?[-+] ?r|half-?lives|divide (both sides )?first|n ?= ?\d'
worked:   # used for the worked-examples recording document
  title: "EL7 Worked Examples: Applications of Exponential and Logarithmic Functions"
  coreQuestion: "Am I looking for the amount or for the time? If it is the time, the variable is in the exponent, so I need a logarithm."
  coreFollowup: "Write the model with the numbers in it first: the rate as a decimal, the right number of compounding periods, and 1 minus the rate when value is lost. To find an amount, plug in the time. To find the time, divide so the power is alone, switch to logarithmic form, and use natural logs on the calculator."
summary:   # the Quick Summary tab
  intro: 'Every EL7 problem asks two things about one situation: <strong>how much after a given time</strong>, and <strong>how long until a given amount</strong>. For the amount, plug the time into the model. For the time, the variable is in the exponent, so get the power alone and use a logarithm, just like EL6. On a calculator, <span>\( \log_b x=\dfrac{\ln x}{\ln b} \)</span>.'
  caption: "The four EL7 situations, the model for each, and what to watch for"
  columns: ["Situation", "Model", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - 'Compound interest'
      - '<span>\( A(t)=P\left(1+\dfrac{r}{n}\right)^{nt} \)</span>'
      - 'Write the rate as a decimal: 4% is <span>\( 0.04 \)</span>. Use <span>\( n=1 \)</span> annually, <span>\( 2 \)</span> semiannually, <span>\( 4 \)</span> quarterly, <span>\( 12 \)</span> monthly. The <span>\( n \)</span> goes in two places.'
    -
      - 'A growing population'
      - '<span>\( P(t)=a\cdot b^{t} \)</span>'
      - '<span>\( a \)</span> is the starting count. Find <span>\( b \)</span> from the second data point first: divide by <span>\( a \)</span>, then take a root. For 3 days, take the cube root.'
    -
      - 'Depreciation (losing value)'
      - '<span>\( A(t)=A\left(1-r\right)^{t} \)</span>'
      - 'Losing value means <span>\( 1-r \)</span>, not <span>\( 1+r \)</span>. Losing 5% a year keeps 95%, so the factor is <span>\( 0.95 \)</span>.'
    -
      - 'Half-life'
      - '<span>\( A(t)=A\left(\dfrac{1}{2}\right)^{t/h} \)</span>'
      - 'The exponent is time divided by the half-life. Each half-life cuts the amount in half.'
    -
      - 'Finding the time (any model)'
      - 'Divide by the starting amount, switch to logarithmic form, then solve for <span>\( t \)</span>.'
      - 'Dividing before you multiply: never multiply the starting amount into the base. With compounding, divide by <span>\( n \)</span> at the end.'
  note: 'Your CheckIt problem will have different numbers and a different story than these examples. The reasoning is what transfers. CheckIt rounds amounts to the nearest whole number, and its times come out to whole numbers, so round your final answer the same way. Keep full calculator precision until the last step.'
tabs:
  - id: setup
    label: "Try It: Set Up the Model"
    heading: "Try It: Set Up the Model"
    intro: |-
      Before you calculate anything, write the model with the numbers in it. Make your best guess, then check it. Ask yourself: what is the starting amount, and what happens to it each period?
    items:
      - id: su1
        title: "Set Up 1"
        math:
          display: 'A(t)=P\left(1+\dfrac{r}{n}\right)^{nt}'
          speak: "A of t equals P times the quantity 1 plus the fraction r over n, end fraction, end quantity, to the power n t, end power"
        prompt: 'A certificate of deposit starts with $15,000 and earns 4% interest, compounded quarterly. Which function gives the amount after \( t \) years?'
        choices:
          - {value: a, label: '\( A(t)=15000\left(1+\dfrac{4}{4}\right)^{4t} \)', speak: "A of t equals 15000 times the quantity 1 plus the fraction 4 over 4, end fraction, end quantity, to the power 4 t, end power"}
          - {value: b, label: '\( A(t)=15000\left(1+\dfrac{0.04}{4}\right)^{4t} \)', speak: "A of t equals 15000 times the quantity 1 plus the fraction 0.04 over 4, end fraction, end quantity, to the power 4 t, end power"}
          - {value: c, label: '\( A(t)=15000\left(1+\dfrac{0.04}{4}\right)^{t} \)', speak: "A of t equals 15000 times the quantity 1 plus the fraction 0.04 over 4, end fraction, end quantity, to the power t"}
          - {value: d, label: '\( A(t)=15000\left(1+0.04\right)^{4t} \)', speak: "A of t equals 15000 times the quantity 1 plus 0.04, end quantity, to the power 4 t, end power"}
        correct: b
        explanation: |-
          The starting amount is \( P=15000 \). The rate 4% is \( r=0.04 \) as a decimal. Quarterly means 4 times a year, so \( n=4 \), and \( n \) appears twice: once dividing the rate and once multiplying \( t \). Using 4 instead of 0.04 would double the money every quarter. <strong>The model is \( A(t)=15000\left(1+\tfrac{0.04}{4}\right)^{4t} \).</strong>
      - id: su2
        title: "Set Up 2"
        math:
          display: 'A(t)=A\left(1-r\right)^{t}'
          speak: "A of t equals A times the quantity 1 minus r, end quantity, to the power t"
        prompt: 'A car is worth $40,000 and loses 5% of its value each year. Which function gives its value after \( t \) years?'
        choices:
          - {value: a, label: '\( A(t)=40000\left(1+0.05\right)^{t} \)', speak: "A of t equals 40000 times the quantity 1 plus 0.05, end quantity, to the power t"}
          - {value: b, label: '\( A(t)=40000\left(0.05\right)^{t} \)', speak: "A of t equals 40000 times 0.05 to the power t"}
          - {value: c, label: '\( A(t)=40000\left(0.95\right)^{t} \)', speak: "A of t equals 40000 times 0.95 to the power t"}
          - {value: d, label: '\( A(t)=40000\left(1-5\right)^{t} \)', speak: "A of t equals 40000 times the quantity 1 minus 5, end quantity, to the power t"}
        correct: c
        explanation: |-
          Losing 5% each year means the car keeps 95% of its value each year: \( 1-0.05=0.95 \). Using \( 1+0.05 \) would make the value grow. Using \( 0.05 \) alone would keep only 5% each year. <strong>The model is \( A(t)=40000(0.95)^{t} \), which is \( 40000(1-0.05)^{t} \).</strong>
      - id: su3
        title: "Set Up 3"
        math:
          display: 'A(t)=A\left(\dfrac{1}{2}\right)^{t/h}'
          speak: "A of t equals A times one half to the power t over h, end power"
        prompt: 'Cesium-137 has a half-life of 30 years. A sample starts with 400 micrograms. Which function gives the amount left after \( t \) years?'
        choices:
          - {value: a, label: '\( A(t)=400\left(\dfrac{1}{2}\right)^{t/30} \)', speak: "A of t equals 400 times one half to the power t over 30, end power"}
          - {value: b, label: '\( A(t)=400\left(\dfrac{1}{2}\right)^{30t} \)', speak: "A of t equals 400 times one half to the power 30 t, end power"}
          - {value: c, label: '\( A(t)=400\left(\dfrac{1}{2}\right)^{30/t} \)', speak: "A of t equals 400 times one half to the power 30 over t, end power"}
          - {value: d, label: '\( A(t)=400\left(2\right)^{t/30} \)', speak: "A of t equals 400 times 2 to the power t over 30, end power"}
        correct: a
        explanation: |-
          The exponent counts how many half-lives have passed: time divided by the half-life, \( \tfrac{t}{30} \). After 30 years the exponent is 1, so half is left. Check with numbers: at \( t=30 \), \( 400\left(\tfrac12\right)^{1}=200 \). A base of 2 would double the sample instead. <strong>The model is \( A(t)=400\left(\tfrac{1}{2}\right)^{t/30} \).</strong>
      - id: su4
        title: "Set Up 4"
        math:
          display: 'P(t)=a\cdot b^{t}'
          speak: "P of t equals a times b to the power t"
        prompt: 'A colony starts with 2000 bacteria. After 3 days there are 6750. What is \( b \) in \( P(t)=2000\cdot b^{t} \)?'
        choices:
          - {value: a, label: '\( b=3.375 \)', speak: "b equals 3.375"}
          - {value: b, label: '\( b=1.125 \)', speak: "b equals 1.125"}
          - {value: c, label: "about 1583"}
          - {value: d, label: '\( b=1.5 \)', speak: "b equals 1.5"}
        correct: d
        explanation: |-
          Plug in the second data point: \( 6750=2000\cdot b^{3} \). Divide by 2000: \( b^{3}=3.375 \). Take the cube root: \( b=1.5 \). Check: \( 2000\cdot 1.5^{3}=2000\cdot 3.375=6750 \). The value 3.375 is \( b^{3} \), not \( b \), and dividing 3.375 by 3 is not a cube root. About 1583 is the average number added per day, which describes a line, not an exponential. <strong>The growth factor is \( b=1.5 \).</strong>
  - id: amount
    label: "Try It: Find the Amount"
    heading: "Try It: Find the Amount"
    intro: |-
      Here the time is given, so plug it in. Make your best guess, then check it. Round to the nearest whole number at the end, as CheckIt does.
    items:
      - id: am1
        title: "Amount 1"
        math:
          display: 'A(t)=15000\left(1+\dfrac{0.04}{4}\right)^{4t}'
          speak: "A of t equals 15000 times the quantity 1 plus the fraction 0.04 over 4, end fraction, end quantity, to the power 4 t, end power"
        prompt: 'How much will be in the certificate of deposit after 10 years? Round to the nearest dollar.'
        choices:
          - {value: a, label: "$22,204"}
          - {value: b, label: "$16,569"}
          - {value: c, label: "$22,333"}
          - {value: d, label: "$72,015"}
        correct: c
        explanation: |-
          Plug in \( t=10 \): the exponent is \( 4\cdot 10=40 \), and the base is \( 1+0.01=1.01 \). So \( A(10)=15000(1.01)^{40}\approx 22332.96 \). The answer $22,204 ignores the compounding, $16,569 uses an exponent of 10 instead of 40, and $72,015 forgets to divide the rate by 4. <strong>The account will have about $22,333.</strong>
      - id: am2
        title: "Amount 2"
        math:
          display: 'A(t)=40000\left(0.95\right)^{t}'
          speak: "A of t equals 40000 times 0.95 to the power t"
        prompt: 'What will the car be worth after 6 years? Round to the nearest dollar.'
        choices:
          - {value: a, label: "$29,404"}
          - {value: b, label: "$28,000"}
          - {value: c, label: "$53,604"}
          - {value: d, label: "$39,999.70"}
        correct: a
        explanation: |-
          Plug in \( t=6 \): \( A(6)=40000(0.95)^{6}\approx 29403.68 \). The answer $28,000 takes off $2,000 every year, which is a line, but each year the car loses 5% of a smaller value. The answer $53,604 uses \( 1.05 \), so the car gains value. <strong>The car will be worth about $29,404.</strong>
      - id: am3
        title: "Amount 3"
        math:
          display: 'A(t)=400\left(\dfrac{1}{2}\right)^{t/30}'
          speak: "A of t equals 400 times one half to the power t over 30, end power"
        prompt: 'How much cesium-137 will be left after 90 years?'
        choices:
          - {value: a, label: "about 133 micrograms"}
          - {value: b, label: "50 micrograms"}
          - {value: c, label: "about 0 micrograms"}
          - {value: d, label: "3200 micrograms"}
        correct: b
        explanation: |-
          The exponent is \( \tfrac{90}{30}=3 \), so three half-lives have passed: \( 400\cdot\left(\tfrac12\right)^{3}=\tfrac{400}{8}=50 \). In words: 400, then 200, then 100, then 50. Dividing by 3 gives about 133, which is not how halving works. <strong>There will be 50 micrograms left.</strong>
      - id: am4
        title: "Amount 4"
        math:
          display: 'P(t)=2000\cdot 1.5^{t}'
          speak: "P of t equals 2000 times 1.5 to the power t"
        prompt: 'How many bacteria will there be after 5 days? Round to the nearest whole number.'
        choices:
          - {value: a, label: "15,000"}
          - {value: b, label: "9,917"}
          - {value: c, label: "875,788"}
          - {value: d, label: "15,188"}
        correct: d
        explanation: |-
          Plug in \( t=5 \): \( 2000\cdot 1.5^{5}=2000\cdot 7.59375=15187.5 \), which rounds to 15,188. The answer 15,000 multiplies \( 1.5 \) by 5 instead of raising it to the 5th power. The answer 875,788 uses 3.375 as the growth factor. <strong>There will be about 15,188 bacteria.</strong>
  - id: time
    label: "Try It: Find the Time"
    heading: "Try It: Find the Time"
    intro: |-
      Here the amount is given and the time is unknown, so the variable is in the exponent. Make your best guess, then check it. Get the power alone, then use a logarithm.
    items:
      - id: ti1
        title: "Time 1"
        math:
          display: '28590=20000\left(1+\dfrac{0.03}{2}\right)^{2t}'
          speak: "28590 equals 20000 times the quantity 1 plus the fraction 0.03 over 2, end fraction, end quantity, to the power 2 t, end power"
        prompt: 'A savings account starts with $20,000 and earns 3% compounded semiannually. How many years until it has $28,590?'
        choices:
          - {value: a, label: "12 years"}
          - {value: b, label: "24 years"}
          - {value: c, label: "about 6 years"}
          - {value: d, label: "about 0.7 years"}
        correct: a
        explanation: |-
          Divide by 20000: \( 1.015^{2t}=1.4295 \). Switch forms: \( 2t=\log_{1.015}(1.4295)=\tfrac{\ln 1.4295}{\ln 1.015}\approx 24.0 \). Then divide by 2: \( t\approx 12 \). The answer 24 is the number of half-year periods, not years. <strong>It takes 12 years.</strong>
      - id: ti2
        title: "Time 2"
        math:
          display: '36069=50000\left(0.96\right)^{t}'
          speak: "36069 equals 50000 times 0.96 to the power t"
        prompt: 'A boat worth $50,000 loses 4% of its value each year. After how many years is it worth $36,069?'
        choices:
          - {value: a, label: "about 7 years"}
          - {value: b, label: "about 0.75 years"}
          - {value: c, label: "8 years"}
          - {value: d, label: "about negative 8.3 years"}
        correct: c
        explanation: |-
          Divide by 50000: \( 0.96^{t}=0.72138 \). Switch forms: \( t=\tfrac{\ln 0.72138}{\ln 0.96}\approx 8.0 \). Both logarithms are negative, so the answer is positive. A negative time means the model used \( 1.04 \), which is growth. About 7 years comes from taking off $2,000 every year, which is a line. <strong>It takes 8 years.</strong>
      - id: ti3
        title: "Time 3"
        math:
          display: '25=200\left(\dfrac{1}{2}\right)^{t/5730}'
          speak: "25 equals 200 times one half to the power t over 5730, end power"
        prompt: 'Carbon-14 has a half-life of 5730 years. A sample starts with 200 grams. After how long will 25 grams be left?'
        choices:
          - {value: a, label: "3 years"}
          - {value: b, label: "22,920 years"}
          - {value: c, label: "45,840 years"}
          - {value: d, label: "17,190 years"}
        correct: d
        explanation: |-
          Divide by 200: \( \left(\tfrac12\right)^{t/5730}=\tfrac{1}{8} \). Since \( \tfrac18=\left(\tfrac12\right)^{3} \), the exponent is 3: \( \tfrac{t}{5730}=3 \), so \( t=17190 \). The answer 3 is the number of half-lives, not years. 45,840 years comes from 8 half-lives, mixing up "one eighth left" with "8 halvings". <strong>It takes 17,190 years.</strong>
      - id: ti4
        title: "Time 4"
        math:
          display: '34172=2000\cdot 1.5^{t}'
          speak: "34172 equals 2000 times 1.5 to the power t"
        prompt: 'For the bacteria colony, after how many days will there be 34,172 bacteria?'
        choices:
          - {value: a, label: "about 11.4 days"}
          - {value: b, label: "7 days"}
          - {value: c, label: "about 25.7 days"}
          - {value: d, label: "about 20.3 days"}
        correct: b
        explanation: |-
          Divide by 2000: \( 1.5^{t}=17.086 \). Switch forms: \( t=\tfrac{\ln 17.086}{\ln 1.5}\approx 7.0 \). About 11.4 divides 17.086 by 1.5 instead of using a logarithm. About 25.7 skips dividing by 2000. <strong>It takes 7 days.</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of lines below was written by a student. Decide whether the work is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: 'A(t)=8000\left(1+4.5\right)^{t}'
          speak: "A of t equals 8000 times the quantity 1 plus 4.5, end quantity, to the power t"
        prompt: 'A student wrote this model for $8,000 earning 4.5% interest, compounded annually. What is the mistake, if any?'
        choices:
          - {value: a, label: "The exponent should be 4.5 t."}
          - {value: b, label: "The rate should be written as the decimal 0.045, not 4.5."}
          - {value: c, label: "The plus sign should be a minus sign."}
          - {value: d, label: "There is no mistake."}
        correct: b
        explanation: |-
          A percent has to become a decimal before it goes in the model: 4.5% is \( 0.045 \). With 4.5, the base is 5.5, so the money would multiply by 5.5 every year. <strong>The correct model is \( A(t)=8000(1.045)^{t} \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: 'A(t)=P\left(1+\dfrac{0.03}{6}\right)^{6t}'
          speak: "A of t equals P times the quantity 1 plus the fraction 0.03 over 6, end fraction, end quantity, to the power 6 t, end power"
        prompt: 'A student wrote this model for an account earning 3% interest, compounded semiannually. What is the mistake, if any?'
        choices:
          - {value: a, label: "The rate should be 3, not 0.03."}
          - {value: b, label: "The 6 should appear only in the exponent."}
          - {value: c, label: "Semiannually means twice a year, so both 6s should be 2."}
          - {value: d, label: "There is no mistake."}
        correct: c
        explanation: |-
          Semiannually means every six months, which is 2 times a year. The 6 counts months, not compounding periods. Both places need \( n=2 \). <strong>The correct model is \( A(t)=P\left(1+\tfrac{0.03}{2}\right)^{2t} \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: 'A(t)=30000\left(1.06\right)^{t}'
          speak: "A of t equals 30000 times 1.06 to the power t"
        prompt: 'A student wrote this model for a $30,000 RV that loses 6% of its value each year. What is the mistake, if any?'
        choices:
          - {value: a, label: "Losing value means the factor is 1 minus 0.06, which is 0.94."}
          - {value: b, label: "The factor should be 0.06."}
          - {value: c, label: "The exponent should be 6 t."}
          - {value: d, label: "There is no mistake."}
        correct: a
        explanation: |-
          Losing 6% each year means keeping 94%: \( 1-0.06=0.94 \). The student's 1.06 makes the RV gain 6% a year. <strong>The correct model is \( A(t)=30000(0.94)^{t} \).</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: '\begin{aligned} 5000\left(1.2\right)^{t}&=20000\\ 6000^{t}&=20000 \end{aligned}'
          speak: "5000 times 1.2 to the power t equals 20000. Next line: 6000 to the power t equals 20000"
        prompt: 'A student wrote these lines. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The 20000 should have been divided by 1.2."}
          - {value: c, label: "The student should have subtracted 5000 from both sides."}
          - {value: d, label: "Only the 1.2 is raised to the power t, so 5000 cannot be multiplied into it. Divide by 5000 instead."}
        correct: d
        explanation: |-
          The exponent belongs to 1.2 only. Divide by 5000 first: \( 1.2^{t}=4 \). Then \( t=\tfrac{\ln 4}{\ln 1.2}\approx 7.6 \). The student's line gives about 1.14, which is wrong. <strong>The correct next line is \( 1.2^{t}=4 \).</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: '\begin{aligned} A(t)&=80\left(\tfrac{1}{2}\right)^{t/30}\\ A(60)&=80\left(\tfrac{1}{2}\right)^{2}=20 \end{aligned}'
          speak: "A of t equals 80 times one half to the power t over 30, end power. Next line: A of 60 equals 80 times one half squared, which equals 20"
        prompt: 'A student wrote these lines for a sample of 80 micrograms with a half-life of 30 years. What is the mistake, if any?'
        choices:
          - {value: a, label: "The exponent should be 30 t."}
          - {value: b, label: "After 60 years, only one half-life has passed."}
          - {value: c, label: "There is no mistake."}
          - {value: d, label: "The base should be 2."}
        correct: c
        explanation: |-
          The exponent is time over half-life: \( \tfrac{60}{30}=2 \), so two half-lives have passed. Halving twice: 80, then 40, then 20. The student's work is correct. <strong>There is no mistake: 20 micrograms are left.</strong>
