# FN2 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt FN2 has two parts. (1) A two-piece function on -5 < x < 5 split at a cut from -2 to 2, with two of these pieces:
# a polynomial like 2x^3 - 3x, a radical sqrt(3x^2 + 5), or a rational (4x - 3)/(2x^2 + 1). Exactly one piece includes the cut.
# It asks for f at a point left of the cut, a point right of it, and the cut itself. (2) A graph of g made of straight
# segments with slopes +/-1 or +/-2; it asks for g(c), and for every x in the interval with g(x) = b (answers can be
# non-integers like -3.5, endpoints, or corners).
# Figures drawn by tools/figures/make_fn2.py.
code: FN2
h1: "FN2 Support: Function Notation"
pageTitle: "FN2 Support: Function Notation — Math 172, Santa Ana College"
hubSummary: "Function notation: evaluating piecewise functions, and reading inputs and outputs from a graph"
videoIntro: "A narrated walkthrough of function notation: evaluating a piecewise function, including at the boundary, and using a graph to find an output from an input and every input that gives an output."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'no mistake|first piece|second piece|the answer'
worked:   # used for the worked-examples recording document
  title: "FN2 Worked Examples: Function Notation"
  coreQuestion: "Am I given the input and finding the output, or given the output and finding the inputs?"
  coreFollowup: "f(a) means the output when the input is a: replace x with a, using the piece whose condition a satisfies. g(x) = b gives the output and asks for every input that produces it: on a graph, draw the horizontal line y = b and read the x-value at each crossing."
summary:   # the Quick Summary tab
  intro: 'Function notation is a sentence: <span>\( f(2)=7 \)</span> says "when the input is 2, the output is 7." <strong>Two key tasks are finding an output from an input and finding inputs that produce a given output.</strong> Every CheckIt FN2 question is one of these.'
  caption: "How to work with function notation, and what to watch for"
  columns: ["When you see", "Do this", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - '<span>\( f(a) \)</span> with a formula'
      - 'Replace every <span>\( x \)</span> with <span>\( a \)</span>, in parentheses, and simplify.'
      - 'Keep negative inputs in parentheses when substituting: <span>\( (-3)^{2}=9 \)</span>, while <span>\( (-3)^{3}=-27 \)</span>.'
    -
      - 'A piecewise function'
      - 'Find the piece whose condition <span>\( a \)</span> makes true, and use only that formula.'
      - 'Check which condition includes the boundary value: read ≤ and &lt; carefully.'
    -
      - 'A radical or fraction result'
      - 'Leave it exact and simplify: <span>\( \sqrt{50}=5\sqrt{2} \)</span>, and reduce fractions.'
      - 'Keep answers exact unless an approximation is requested; CheckIt''s formula answers are exact. A root can come out whole: <span>\( \sqrt{49}=7 \)</span>.'
    -
      - '<span>\( f(x)=b \)</span> with a formula (class, textbook, homework)'
      - 'Set the formula equal to <span>\( b \)</span> and solve for <span>\( x \)</span>.'
      - 'Find all solutions in the function''s domain. The answers are inputs.'
    -
      - '<span>\( g(a) \)</span> on a graph'
      - 'Go to <span>\( x=a \)</span>, move straight up or down to the graph, and read the height.'
      - 'The answer is a <span>\( y \)</span>-value.'
    -
      - '<span>\( g(x)=b \)</span> on a graph'
      - 'Draw the horizontal line <span>\( y=b \)</span>. Find every intersection and read its <span>\( x \)</span>-coordinate.'
      - 'There may be no solutions, one, or several. Include only points on the graph; open circles are excluded. Answers can be the ends of the graph or halves like <span>\( x=1.5 \)</span>.'
  note: 'A point <span>\( (a,b) \)</span> on the graph of <span>\( g \)</span> means <span>\( g(a)=b \)</span>. Your CheckIt graph will not mark its ends or corners with dots: the ends are where the line stops, and they count when they are inside the interval in the question. On CheckIt, <span>\( g(x)=b \)</span> always has at least one answer, and it may have several. In class, the textbook, and homework, watch for undefined values: over the real numbers, a square root requires a nonnegative radicand, and a denominator cannot be zero. Your CheckIt function and graph will have different numbers. Telling inputs from outputs is what transfers.'
tabs:
  - id: pieces
    label: "Try It: Evaluate a Piecewise Function"
    heading: "Try It: Evaluate a Piecewise Function"
    intro: |-
      First pick the piece, then plug in. Make your best guess on each one, then check it.
    items:
      - id: pw1
        title: "At the Cut"
        math:
          display: '\begin{aligned} &f(x)=\\ &\begin{cases} 2x^{3}-3x & -5\lt x\le 1\\ \sqrt{3x^{2}+5} & 1\lt x\lt 5 \end{cases} \end{aligned}'
          speak: "f of x equals 2 x cubed minus 3 x when negative 5 is less than x and x is less than or equal to 1; and the square root of 3 x squared plus 5, end root, when 1 is less than x and x is less than 5"
        prompt: 'Find f(1).'
        choices:
          - {value: a, label: '\( 2\sqrt{2} \)', speak: "2 times the square root of 2"}
          - {value: b, label: "5"}
          - {value: c, label: "−1"}
          - {value: d, label: "Undefined, since 1 is where the pieces meet"}
        correct: c
        explanation: |-
          The condition \( -5\lt x\le 1 \) includes 1, because of the "or equal," so use \( 2x^{3}-3x \): \( 2(1)^{3}-3(1)=2-3=-1 \). The other piece, \( 1\lt x<5 \), leaves 1 out. \( 2\sqrt{2}=\sqrt{8} \) uses the wrong piece; 5 adds the \( 3x \) instead of subtracting; and the function is defined at the cut, since exactly one piece includes it. <strong>\( f(1)=-1 \).</strong>
      - id: pw2
        title: "Left of the Cut"
        math:
          display: '\begin{aligned} &f(x)=\\ &\begin{cases} 2x^{3}-3x & -5\lt x\le 1\\ \sqrt{3x^{2}+5} & 1\lt x\lt 5 \end{cases} \end{aligned}'
          speak: "f of x equals 2 x cubed minus 3 x when negative 5 is less than x and x is less than or equal to 1; and the square root of 3 x squared plus 5, end root, when 1 is less than x and x is less than 5"
        prompt: 'Find f(−2).'
        choices:
          - {value: a, label: "−10"}
          - {value: b, label: "22"}
          - {value: c, label: "−22"}
          - {value: d, label: '\( \sqrt{17} \)', speak: "the square root of 17"}
        correct: a
        explanation: |-
          −2 is between −5 and 1, so use \( 2x^{3}-3x \): \( 2(-2)^{3}-3(-2)=2(-8)+6=-16+6=-10 \). 22 uses \( (-2)^{3}=8 \), but a negative cubed stays negative; −22 subtracts the 6 instead of adding it, since \( -3(-2)=+6 \); and \( \sqrt{17} \) uses the radical piece, which only covers \( 1\lt x<5 \). <strong>\( f(-2)=-10 \).</strong>
      - id: pw3
        title: "Right of the Cut"
        math:
          display: '\begin{aligned} &f(x)=\\ &\begin{cases} 2x^{3}-3x & -5\lt x\le 1\\ \sqrt{3x^{2}+5} & 1\lt x\lt 5 \end{cases} \end{aligned}'
          speak: "f of x equals 2 x cubed minus 3 x when negative 5 is less than x and x is less than or equal to 1; and the square root of 3 x squared plus 5, end root, when 1 is less than x and x is less than 5"
        prompt: 'Find f(3). Give an exact, simplified answer.'
        choices:
          - {value: a, label: '\( \sqrt{14} \)', speak: "the square root of 14"}
          - {value: b, label: "45"}
          - {value: c, label: '\( \sqrt{86} \)', speak: "the square root of 86"}
          - {value: d, label: '\( 4\sqrt{2} \)', speak: "4 times the square root of 2"}
        correct: d
        explanation: |-
          3 is between 1 and 5, so use the radical: \( \sqrt{3(3)^{2}+5}=\sqrt{27+5}=\sqrt{32}=\sqrt{16\cdot 2}=4\sqrt{2} \). \( \sqrt{14} \) multiplies 3 by 3 instead of by \( 3^{2} \); \( \sqrt{86} \) squares \( 3\cdot 3 \) instead of only the \( x \); and 45 uses the polynomial piece. <strong>\( f(3)=4\sqrt{2} \).</strong>
      - id: pw4
        title: "A Different Cut"
        math:
          display: '\begin{aligned} &k(x)=\\ &\begin{cases} \dfrac{4x-3}{2x^{2}+1} & -5\lt x\lt -1\\ x^{2}+2x & -1\le x\lt 5 \end{cases} \end{aligned}'
          speak: "k of x equals the fraction 4 x minus 3, over 2 x squared plus 1, end fraction, when negative 5 is less than x and x is less than negative 1; and x squared plus 2 x when negative 1 is less than or equal to x and x is less than 5"
        prompt: 'Find k(−1).'
        choices:
          - {value: a, label: '\( -\tfrac{7}{3} \)', speak: "the fraction negative 7, over 3, end fraction"}
          - {value: b, label: "−1"}
          - {value: c, label: "3"}
          - {value: d, label: "Undefined, since −1 is where the pieces meet"}
        correct: b
        explanation: |-
          This time the "or equal" is on the right-hand piece: \( -1\le x<5 \) includes −1. So \( k(-1)=(-1)^{2}+2(-1)=1-2=-1 \). \( -\tfrac{7}{3} \) uses the fraction piece, whose condition \( x<-1 \) leaves −1 out; 3 treats \( 2(-1) \) as \( +2 \); and the function is defined at the cut. <strong>\( k(-1)=-1 \).</strong>
  - id: graph
    label: "Try It: Read the Graph"
    heading: "Try It: Read the Graph"
    intro: |-
      Going from an input to an output means reading up or down from the x-axis. Going from an output back to inputs means reading across from the y-axis, and there may be more than one. Make your best guess, then check it.
    items:
      - id: rg1
        title: "Input to Output 1"
        figure:
          file: figures/FN2/ga.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −5 to x = 4, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−5, −1) up to (−3, 3), then down to (1, −1), then up to (4, 5). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'Find g(−1).'
        choices:
          - {value: a, label: "−1"}
          - {value: b, label: "0"}
          - {value: c, label: "3"}
          - {value: d, label: "1"}
        correct: d
        explanation: |-
          Start at \( x=-1 \) on the \( x \)-axis and go straight up to the graph. You land on the segment from \( (-3,3) \) to \( (1,-1) \), which drops 1 for every step right, so at \( x=-1 \) it is at height \( 3-2=1 \). −1 is the height at \( x=1 \), not \( x=-1 \); 0 is the height at \( x=0 \); and 3 is the peak at \( x=-3 \). <strong>\( g(-1)=1 \).</strong>
      - id: rg2
        title: "Input to Output 2"
        figure:
          file: figures/FN2/gb.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −4 to x = 5, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−4, 4) down to (−1, −2), then up to (3, 2), then down to (5, 0). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'Find g(3).'
        choices:
          - {value: a, label: "3"}
          - {value: b, label: "2"}
          - {value: c, label: "1"}
          - {value: d, label: "−2"}
        correct: b
        explanation: |-
          At \( x=3 \) the graph has a corner at \( (3,2) \), so \( g(3)=2 \). A corner belongs to both segments, and they agree there. 3 repeats the input instead of reading the output; 1 is the height at \( x=2 \); and −2 is the lowest point, at \( x=-1 \). <strong>\( g(3)=2 \).</strong>
      - id: rg3
        title: "Output to Inputs 1"
        figure:
          file: figures/FN2/ga.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −5 to x = 4, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−5, −1) up to (−3, 3), then down to (1, −1), then up to (4, 5). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'For which x-values in [−5, 4] does g(x) = 2?'
        choices:
          - {value: a, label: "x = −3.5, x = −2, and x = 2.5"}
          - {value: b, label: "x = −2 only, the crossing at a whole number"}
          - {value: c, label: "x = −3.5 and x = 2.5"}
          - {value: d, label: "x = −4, x = −2, and x = 2"}
        correct: a
        explanation: |-
          Draw the horizontal line \( y=2 \). It crosses all three segments. First segment, rising 2 per step from \( (-5,-1) \): it reaches 2 after 1.5 steps, at \( x=-3.5 \). Second, falling 1 per step from \( (-3,3) \): 1 step, at \( x=-2 \). Third, rising 2 per step from \( (1,-1) \): 1.5 steps, at \( x=2.5 \). "−2 only" keeps just the crossing at a whole number; leaving out −2 misses the middle segment; and −4 and 2 round the halves down. <strong>\( x=-3.5 \), \( x=-2 \), and \( x=2.5 \).</strong>
      - id: rg4
        title: "Output to Inputs 2"
        figure:
          file: figures/FN2/gb.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −4 to x = 5, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−4, 4) down to (−1, −2), then up to (3, 2), then down to (5, 0). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'For which x-values in [−4, 5] does g(x) = 0?'
        choices:
          - {value: a, label: "x = −2 and x = 1, the two crossings"}
          - {value: b, label: "x = 1 only"}
          - {value: c, label: "x = −2, x = 1, and x = 5"}
          - {value: d, label: "x = −1, since g(0) = −1"}
        correct: c
        explanation: |-
          \( g(x)=0 \) asks where the graph is on the \( x \)-axis. It crosses at \( x=-2 \), falling 2 per step from \( (-4,4) \); at \( x=1 \), rising from \( (-1,-2) \); and it ends on the axis at \( (5,0) \), which counts, since 5 is in the interval. Stopping at two misses the endpoint; "1 only" misses the first segment; and \( g(0)=-1 \) answers a different question, the output at input 0. <strong>\( x=-2 \), \( x=1 \), and \( x=5 \).</strong>
  - id: notation
    label: "Try It: Inputs and Outputs"
    heading: "Try It: Inputs and Outputs"
    intro: |-
      What is the notation asking for: an input or an output, and how many? Make your best guess, then check it.
    items:
      - id: io1
        title: "Just One"
        figure:
          file: figures/FN2/gb.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −4 to x = 5, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−4, 4) down to (−1, −2), then up to (3, 2), then down to (5, 0). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'For which x-values in [−4, 5] does g(x) = −2?'
        choices:
          - {value: a, label: "x = −2"}
          - {value: b, label: "x = −1 and x = 3, the two corners"}
          - {value: c, label: "There is none, since corners do not count."}
          - {value: d, label: "x = −1 only"}
        correct: d
        explanation: |-
          Draw the horizontal line \( y=-2 \). It touches the graph only at the lowest corner, \( (-1,-2) \), so there is exactly one input: \( x=-1 \). Many CheckIt problems have just one answer like this. \( x=-2 \) copies the output as an input; the corner at 3 is at height 2, not −2; and a corner is a point on the graph like any other. <strong>\( x=-1 \) only.</strong>
      - id: io2
        title: "What It Means"
        math:
          display: 'C(10)=150'
          speak: "C of 10 equals 150"
        prompt: 'C(m) is the temperature of a cup of coffee, in degrees Fahrenheit, m minutes after it is poured. What does C(10) = 150 mean?'
        choices:
          - {value: a, label: "10 minutes after it is poured, the coffee is 150°F."}
          - {value: b, label: "150 minutes after it is poured, the coffee is 10°F."}
          - {value: c, label: "The coffee cools by 150 degrees in 10 minutes."}
          - {value: d, label: "C times 10 equals 150, so C is 15."}
        correct: a
        explanation: |-
          The input, in the parentheses, is the time: 10 minutes. The output is the temperature: 150°F. Swapping them reads the notation backwards; "cools by 150" turns an output into a change, which the notation does not say; and \( C(10) \) is not multiplication: \( C \) is the name of the function. <strong>10 minutes after it is poured, the coffee is 150°F.</strong>
      - id: io3
        title: "On the Graph"
        math:
          display: 'h(-2)=5'
          speak: "h of negative 2 equals 5"
        prompt: 'Which point must be on the graph of h?'
        choices:
          - {value: a, label: "(5, −2)"}
          - {value: b, label: "(−2, −5)"}
          - {value: c, label: "(0, 5)"}
          - {value: d, label: "(−2, 5)"}
        correct: d
        explanation: |-
          \( h(-2)=5 \) says the input −2 gives the output 5, and points are written (input, output). So \( (-2,5) \). \( (5,-2) \) swaps input and output; \( (-2,-5) \) changes the output's sign; and \( (0,5) \) would mean \( h(0)=5 \). <strong>\( (-2,5) \).</strong>
      - id: io4
        title: "Back to the Input"
        math:
          display: 'f(x)=3x-4'
          speak: "f of x equals 3 x minus 4"
        prompt: 'For which x does f(x) = 11?'
        choices:
          - {value: a, label: "x = 29"}
          - {value: b, label: "x = 5"}
          - {value: c, label: "x = 7/3"}
          - {value: d, label: "x = 15"}
        correct: b
        explanation: |-
          Set the output equal to 11 and solve for the input: \( 3x-4=11 \), \( 3x=15 \), \( x=5 \). Check: \( f(5)=15-4=11 \). 29 is \( f(11) \), the output for input 11, the opposite question; \( \tfrac{7}{3} \) subtracts the 4 instead of adding it; and 15 stops before dividing by 3. <strong>\( x=5 \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\begin{aligned} &m(x)=\\ &\begin{cases} 3x^{2}+1 & -5\lt x\lt 0\\ \sqrt{x^{2}+5} & 0\le x\lt 5 \end{cases} \end{aligned}'
          speak: "m of x equals 3 x squared plus 1 when negative 5 is less than x and x is less than 0; and the square root of x squared plus 5, end root, when 0 is less than or equal to x and x is less than 5"
        prompt: 'A student found m(0) = 3(0)² + 1 = 1. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "0 belongs to the piece with 0 ≤ x, so m(0) = √5."}
          - {value: c, label: "m(0) is undefined, since 0 is where the pieces meet."}
          - {value: d, label: "0² is 1, so 3(0)² + 1 is 4."}
        correct: b
        explanation: |-
          \( -5\lt x<0 \) leaves 0 out, and \( 0\le x<5 \) includes it, so \( m(0)=\sqrt{0^{2}+5}=\sqrt{5} \). The function is defined at 0, since one piece includes it, and \( 0^{2}=0 \), not 1, so \( 3(0)^{2}+1 \) really is 1, just from the wrong piece. <strong>0 belongs to the radical piece: \( m(0)=\sqrt{5} \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: '\begin{aligned} m(-2)&=3(-2)^{2}+1\\ &=-12+1\\ &=-11 \end{aligned}'
          speak: "m of negative 2 equals 3 times the quantity negative 2, end quantity, squared, plus 1. Next line: equals negative 12 plus 1. Next line: equals negative 11"
        prompt: 'Using the same m, a student found m(−2) this way. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "−2 belongs to the radical piece, so m(−2) = 3."}
          - {value: c, label: "It should be 3(−2) + 1 = −5, without the square."}
          - {value: d, label: "(−2)² is 4, not −4, so m(−2) = 13."}
        correct: d
        explanation: |-
          The piece is right, since −2 is between −5 and 0. But \( (-2)^{2}=(-2)(-2)=4 \), so \( m(-2)=3(4)+1=13 \). The radical piece starts at 0, and the square is part of the formula; dropping it changes the function. <strong>\( (-2)^{2}=4 \): \( m(-2)=13 \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} &p(x)=\\ &\begin{cases} \dfrac{4x+2}{2x^{2}+2} & -5\lt x\lt -1\\ x^{2}+2x & -1\le x\lt 5 \end{cases} \end{aligned}'
          speak: "p of x equals the fraction 4 x plus 2, over 2 x squared plus 2, end fraction, when negative 5 is less than x and x is less than negative 1; and x squared plus 2 x when negative 1 is less than or equal to x and x is less than 5"
        prompt: 'A student found \( p(-2)=\dfrac{4(-2)+2}{2(-2)^{2}+2}=\dfrac{-6}{10}=-\dfrac{3}{5} \). What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "−2 belongs to the other piece, so p(−2) = 0."}
          - {value: c, label: "The bottom should be 2(−4) + 2 = −6, so it is 1."}
          - {value: d, label: "It should stay −6/10, because reducing changes the value."}
        correct: a
        explanation: |-
          −2 is between −5 and −1, so the fraction piece is the right one. Top: \( 4(-2)+2=-6 \). Bottom: \( 2(-2)^{2}+2=2(4)+2=10 \). So \( p(-2)=-\tfrac{6}{10}=-\tfrac{3}{5} \), reduced, as CheckIt wants. The other piece starts at −1; \( (-2)^{2} \) is 4, not −4; and reducing a fraction never changes its value. <strong>There is no mistake.</strong>
      - id: sl4
        title: "Slip 4"
        figure:
          file: figures/FN2/gc.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −3 to x = 3, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−3, −4) up to (−1, −2), then up more steeply to (1, 2), then down to (3, 0). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'For which x in [−3, 3] does g(x) = 0? A student answered x = 0 only. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "x = 3 counts too: the right end is on the x-axis."}
          - {value: c, label: "The answer should be the output g(0) = 0, not an x-value."}
          - {value: d, label: "x = −1 counts too, since the graph turns there."}
        correct: b
        explanation: |-
          The line \( y=0 \) is the \( x \)-axis. The steep segment from \( (-1,-2) \) to \( (1,2) \) crosses it at \( x=0 \), and the graph ends on it at \( (3,0) \). The end is a point of the graph, and 3 is in the interval, so \( x=0 \) and \( x=3 \). The question asks for inputs, so the answer is \( x \)-values; and at \( x=-1 \) the graph is at height −2, where it gets steeper but does not turn around. <strong>\( x=0 \) and \( x=3 \).</strong>
      - id: sl5
        title: "Slip 5"
        figure:
          file: figures/FN2/gb.svg
          title: "The graph of g, made of three straight segments"
          caption: 'A graph of g on the interval from x = −4 to x = 5, drawn on a grid with lines every 1 unit. It is made of three straight segments: from (−4, 4) down to (−1, −2), then up to (3, 2), then down to (5, 0). The ends and corners are marked with dots.'
          collapse: true
        prompt: 'A student was asked for g(4) and answered −4, because the graph is at height 4 when x = −4. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "g(4) is 0, since the graph ends on the x-axis at the right end."}
          - {value: c, label: "Only the sign is off: the height is 4, so g(4) = 4."}
