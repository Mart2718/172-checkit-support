      - id: sl5
        title: "Slip 5"
        figure:
          file: figures/FN3/g1.svg
          title: "The graph of a function g with a dot at each end"
          caption: 'A graph of g on a grid with lines every 1 unit, with x from −12 to 12 and y from −5 to 13. From a filled dot at (−11, 12), it goes down steeply through (−9, 0) to (−7, −4), where it turns. It goes up through (−5, 0) to (−1, 9), where it turns, then down through (0, 5) to (4, 2), where it turns again. Then it goes up to an open dot at (11, 8). There are small corners where its pieces join, at x = −5, −2, 0 and 8.'
          collapse: true
        prompt: 'A student says g has no global minimum, because the graph ends at an open dot. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The open dot is not the lowest place; the global min is −4."}
          - {value: c, label: "The global minimum is 8, at the open dot on the right end."}
          - {value: d, label: "The global minimum is 2, at the last turning point, (4, 2)."}
        correct: b
        explanation: |-
          An open dot only rules out a global maximum or minimum when it is at the very top or bottom of the graph. Here the open dot at \( (11,8) \) is partway up, and the graph is lower elsewhere: its lowest point is \( (-7,-4) \), which is reached. So the global minimum is −4. The open dot's height, 8, is not reached and is not the lowest; and 2 is a local minimum, but the graph goes lower at \( x=-7 \). <strong>The global minimum is −4.</strong>
