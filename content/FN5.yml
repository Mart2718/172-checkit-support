# FN5 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt FN5 picks four different functions from five types: linear ax + b, quadratic ax^2 + cx or ax^2 + c, cubic ax^3 + cx^k,
# a root sqrt(ax + b), and a rational ax/(x + b), named with four different letters from f, g, h, p, q, r.
# Part 1 asks for the sum, difference, product and quotient of two of them; the product and quotient answers are left unexpanded.
# Part 2 asks for the formula of one composition, A(B(x)), and then the value of the OTHER order, B(A(n)), for a nonzero integer n
# from -6 to 6. The swap flag lists the two functions in either order. Values can be fractions or roots.
# Figures drawn by tools/figures/make_fn5.py.
code: FN5
h1: "FN5 Support: Combining and Composing Functions"
pageTitle: "FN5 Support: Combining and Composing Functions — Math 172, Santa Ana College"
hubSummary: "Combining functions: sums, differences, products, quotients, and compositions, as formulas and as values"
videoIntro: "A narrated walkthrough of combining functions: adding, subtracting, multiplying and dividing two functions, building a composition like f(g(x)) by putting one function inside another, and evaluating a composition from the inside out."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'no mistake|the answer|wrong order|distribute'
worked:   # used for the worked-examples recording document
  title: "FN5 Worked Examples: Combining and Composing Functions"
  coreQuestion: "Am I combining two outputs, or feeding one function's output into the other?"
  coreFollowup: "For f + g, f − g, f · g and f ÷ g, both functions take the same input, and you combine the two outputs, keeping each function in parentheses. For f(g(x)), the inside function goes first: replace every x in f with the whole expression g(x), in parentheses. For a number, work from the inside out: find g(n), then put that number into f."
summary:   # the Quick Summary tab
  intro: 'There are two ways to put functions together. <strong>Combining</strong> gives both functions the same input and joins their outputs. <strong>Composing</strong> feeds one function''s output into the other. Parentheses do most of the work in both.'
  caption: "Summary: Combining and Composing Functions"
  columns: ["Operation", "How to do it", "What to watch for"]
  rows:     # first cell of each row is the row header
    -
      - 'Sum'
      - 'For <span>\( f(x)+g(x) \)</span>, write both formulas and combine like terms.'
      - 'Only like terms combine: <span>\( 2x^{2} \)</span> and <span>\( 3x \)</span> stay separate.'
    -
      - 'Difference'
      - 'For <span>\( f(x)-g(x) \)</span>, put <span>\( g(x) \)</span> in parentheses, then subtract every one of its terms.'
      - 'The minus reaches every term of <span>\( g \)</span>: <span>\( -(2x-3) \)</span> is <span>\( -2x+3 \)</span>. Order matters: <span>\( g-f \)</span> is the opposite.'
    -
      - 'Product'
      - 'For <span>\( f(x)\cdot g(x) \)</span>, multiply every term of one by every term of the other, then combine like terms. With a root, keep it as one factor: <span>\( (4x-1)\sqrt{3x+2} \)</span>.'
      - 'Keep the middle terms. CheckIt leaves the product unexpanded, as two factors side by side; that is the same function.'
    -
      - 'Quotient'
      - 'For <span>\( \dfrac{f(x)}{g(x)} \)</span>, write <span>\( f(x) \)</span> over <span>\( g(x) \)</span>, with each whole formula in the numerator or the denominator.'
      - 'If <span>\( g \)</span> is itself a fraction, flip it and multiply. Only factors cancel, never single terms. The quotient is undefined where <span>\( g(x)=0 \)</span>.'
    -
      - 'Composition'
      - 'For <span>\( f(g(x)) \)</span>, replace every <span>\( x \)</span> in <span>\( f \)</span> with <span>\( (g(x)) \)</span>, in parentheses. Simplifying is optional; CheckIt often leaves it as is.'
      - '<span>\( f(g(x)) \)</span> and <span>\( g(f(x)) \)</span> are usually different. A composition is not a product. Read the letters, not which function is listed first.'
    -
      - 'Composition at a number'
      - 'For <span>\( f(g(2)) \)</span>, work from the inside out: find <span>\( g(2) \)</span>, then put that number into <span>\( f \)</span>.'
      - 'Check which letter is inside. On CheckIt, the value question uses the opposite order from the formula question.'
  note: 'CheckIt gives you four different functions with letters like <span>\( f \)</span>, <span>\( g \)</span>, <span>\( h \)</span>, <span>\( p \)</span>, <span>\( q \)</span>, and <span>\( r \)</span>. They can be lines, quadratics, cubics, square roots, or fractions like <span>\( \dfrac{2x}{x+3} \)</span>. The number you plug in can be negative, and answers are exact: leave roots and fractions as they are, such as <span>\( \sqrt{11} \)</span> or <span>\( \tfrac{21}{5} \)</span>. A cubic can make the answer large. Your CheckIt functions will be different. Reading which function goes where is what transfers.'
tabs:
  - id: combine
    label: "Try It: Combine Two Functions"
    heading: "Try It: Combine Two Functions"
    intro: |-
      Both functions get the same input, and you combine what comes out. The pairs change from item to item, as they do on CheckIt. Make your best guess on each one, then check it.
    items:
      - id: cb1
        title: "Sum"
        figure:
          file: figures/FN5/combine.svg
          title: "One input feeding two machines whose outputs are added"
          caption: 'A diagram. The same input, x, goes into two machines, f and g. Their outputs, f(x) and g(x), meet at a plus sign, giving f(x) + g(x).'
        math:
          display: '\begin{aligned} f(x)&=3x-4\\ g(x)&=2x^{2}+5 \end{aligned}'
          speak: "f of x equals 3 x minus 4. g of x equals 2 x squared plus 5."
        prompt: 'Find f(x) + g(x).'
        choices:
          - {value: a, label: '\( 2x^{2}+3x+1 \)', speak: "2 x squared plus 3 x plus 1"}
          - {value: b, label: '\( 5x^{2}+1 \)', speak: "5 x squared plus 1"}
          - {value: c, label: '\( 2x^{2}+3x+9 \)', speak: "2 x squared plus 3 x plus 9"}
          - {value: d, label: '\( 2x^{2}+3x-1 \)', speak: "2 x squared plus 3 x minus 1"}
        correct: a
        explanation: |-
          Add the two formulas and combine like terms: \( (3x-4)+(2x^{2}+5)=2x^{2}+3x+1 \). The \( x^{2} \) term and the \( x \) term stay separate, so \( 5x^{2}+1 \) combines terms that are not alike. \( +9 \) treats the \( -4 \) as \( +4 \), and \( -1 \) works out \( 4-5 \) instead of \( -4+5 \). <strong>\( 2x^{2}+3x+1 \).</strong>
      - id: cb2
        title: "Difference"
        math:
          display: '\begin{aligned} f(x)&=3x-4\\ g(x)&=2x^{2}+5 \end{aligned}'
          speak: "f of x equals 3 x minus 4. g of x equals 2 x squared plus 5."
        prompt: 'Find f(x) − g(x).'
        choices:
          - {value: a, label: '\( -2x^{2}+3x+1 \)', speak: "negative 2 x squared plus 3 x plus 1"}
          - {value: b, label: '\( 2x^{2}-3x+9 \)', speak: "2 x squared minus 3 x plus 9"}
          - {value: c, label: '\( -2x^{2}+3x-9 \)', speak: "negative 2 x squared plus 3 x minus 9"}
          - {value: d, label: '\( -2x^{2}-3x-9 \)', speak: "negative 2 x squared minus 3 x minus 9"}
        correct: c
        explanation: |-
          Put all of \( g(x) \) in parentheses and subtract each of its terms: \( (3x-4)-(2x^{2}+5)=3x-4-2x^{2}-5=-2x^{2}+3x-9 \). \( +1 \) subtracts the \( 2x^{2} \) but adds the 5; \( 2x^{2}-3x+9 \) is \( g(x)-f(x) \), the other order; and \( -3x \) changes the sign of a term that belongs to \( f \). <strong>\( -2x^{2}+3x-9 \).</strong>
      - id: cb3
        title: "Product"
        math:
          display: '\begin{aligned} p(x)&=4x-1\\ r(x)&=\sqrt{3x+2} \end{aligned}'
          speak: "p of x equals 4 x minus 1. r of x equals the square root of 3 x plus 2, end root."
        prompt: 'Find p(x) · r(x).'
        choices:
          - {value: a, label: '\( 4x\sqrt{3x+2}-1 \)', speak: "4 x times the square root of 3 x plus 2, end root, minus 1"}
          - {value: b, label: '\( (4x-1)\sqrt{3x+2} \)', speak: "the quantity 4 x minus 1, end quantity, times the square root of 3 x plus 2, end root"}
          - {value: c, label: '\( \sqrt{12x-1} \)', speak: "the square root of 12 x minus 1, end root"}
          - {value: d, label: '\( \sqrt{(4x-1)(3x+2)} \)', speak: "the square root of the quantity 4 x minus 1, end quantity, times the quantity 3 x plus 2, end quantity, end root"}
        correct: b
        explanation: |-
          Multiply the two outputs, keeping \( 4x-1 \) in parentheses so the whole thing multiplies the root: \( (4x-1)\sqrt{3x+2} \). That is as far as it goes, and it is how CheckIt writes a product. \( 4x\sqrt{3x+2}-1 \) leaves the parentheses off, so only \( 4x \) multiplies; \( \sqrt{12x-1} \) is \( r(p(x))=\sqrt{3(4x-1)+2} \), a composition; and \( \sqrt{(4x-1)(3x+2)} \) moves \( 4x-1 \) under the root, where it would be square-rooted too. <strong>\( (4x-1)\sqrt{3x+2} \).</strong>
      - id: cb4
        title: "Quotient"
        math:
          display: '\begin{aligned} g(x)&=3x+1\\ h(x)&=\dfrac{2x}{x-4} \end{aligned}'
          speak: "g of x equals 3 x plus 1. h of x equals the fraction 2 x, over x minus 4, end fraction."
        prompt: 'Find g(x) divided by h(x).'
        choices:
          - {value: a, label: '\( \dfrac{(3x+1)(x-4)}{2x} \)', speak: "the fraction the quantity 3 x plus 1, end quantity, times the quantity x minus 4, end quantity, over 2 x, end fraction"}
          - {value: b, label: '\( \dfrac{2x}{(3x+1)(x-4)} \)', speak: "the fraction 2 x, over the quantity 3 x plus 1, end quantity, times the quantity x minus 4, end quantity, end fraction"}
          - {value: c, label: '\( \dfrac{2x(3x+1)}{x-4} \)', speak: "the fraction 2 x times the quantity 3 x plus 1, end quantity, over x minus 4, end fraction"}
          - {value: d, label: '\( \dfrac{3x+1}{2x} \)', speak: "the fraction 3 x plus 1, over 2 x, end fraction"}
        correct: a
        explanation: |-
          Dividing by a fraction means multiplying by its flip: \( (3x+1)\div\left(\dfrac{2x}{x-4}\right)=(3x+1)\cdot\dfrac{x-4}{2x}=\dfrac{(3x+1)(x-4)}{2x} \). \( \dfrac{2x}{(3x+1)(x-4)} \) is the flip of the answer, \( h(x) \) divided by \( g(x) \); \( \dfrac{2x(3x+1)}{x-4} \) multiplies by \( h \) instead of dividing; and \( \dfrac{3x+1}{2x} \) loses the \( x-4 \) when flipping. <strong>\( \dfrac{(3x+1)(x-4)}{2x} \).</strong>
  - id: compose
    label: "Try It: Build a Composition"
    heading: "Try It: Build a Composition"
    intro: |-
      In a composition, one function's output becomes the other function's input. The function written inside goes first. Make your best guess, then check it.
    items:
      - id: cp1
        title: "Compose 1"
        math:
          display: '\begin{aligned} g(x)&=x^{2}-3\\ f(x)&=2x+1 \end{aligned}'
          speak: "g of x equals x squared minus 3. f of x equals 2 x plus 1."
        prompt: 'Find f(g(x)).'
        choices:
          - {value: a, label: '\( 4x^{2}+4x-2 \)', speak: "4 x squared plus 4 x minus 2"}
          - {value: b, label: '\( 2x^{2}-2 \)', speak: "2 x squared minus 2"}
          - {value: c, label: '\( 2x^{3}+x^{2}-6x-3 \)', speak: "2 x cubed plus x squared minus 6 x minus 3"}
          - {value: d, label: '\( 2x^{2}-5 \)', speak: "2 x squared minus 5"}
        correct: d
        explanation: |-
          \( g \) is inside, so its whole formula replaces the \( x \) in \( f \): \( f(g(x))=2(x^{2}-3)+1=2x^{2}-6+1=2x^{2}-5 \). \( 4x^{2}+4x-2 \) is \( g(f(x))=(2x+1)^{2}-3 \), the other order; \( 2x^{2}-2 \) leaves out the parentheses, so the 2 never reaches the \( -3 \); and \( 2x^{3}+x^{2}-6x-3 \) is the product \( f(x)\cdot g(x) \), not a composition. <strong>\( 2x^{2}-5 \).</strong>
      - id: cp2
        title: "Compose 2"
        math:
          display: '\begin{aligned} h(x)&=\sqrt{2x+3}\\ p(x)&=x^{2}+1 \end{aligned}'
          speak: "h of x equals the square root of 2 x plus 3, end root. p of x equals x squared plus 1."
        prompt: 'Find h(p(x)).'
        choices:
          - {value: a, label: '\( 2x+4 \)', speak: "2 x plus 4"}
          - {value: b, label: '\( \sqrt{2x^{2}+5} \)', speak: "the square root of 2 x squared plus 5, end root"}
          - {value: c, label: '\( \sqrt{2x^{2}+4} \)', speak: "the square root of 2 x squared plus 4, end root"}
          - {value: d, label: '\( \sqrt{2x^{2}+3}+1 \)', speak: "the square root of 2 x squared plus 3, end root, plus 1"}
        correct: b
        explanation: |-
          \( p \) is inside, so \( x^{2}+1 \) replaces the \( x \) under the root: \( h(p(x))=\sqrt{2(x^{2}+1)+3}=\sqrt{2x^{2}+2+3}=\sqrt{2x^{2}+5} \). \( 2x+4 \) is \( p(h(x))=\left(\sqrt{2x+3}\right)^{2}+1 \), the other order; \( \sqrt{2x^{2}+4} \) multiplies only the \( x^{2} \) by 2, not the 1; and \( \sqrt{2x^{2}+3}+1 \) puts the \( +1 \) from \( p \) outside the root instead of inside, where \( x \) was. <strong>\( \sqrt{2x^{2}+5} \).</strong>
      - id: cp3
        title: "Compose 3"
        math:
          display: '\begin{aligned} q(x)&=4x-1\\ r(x)&=\dfrac{2x}{x+3} \end{aligned}'
          speak: "q of x equals 4 x minus 1. r of x equals the fraction 2 x, over x plus 3, end fraction."
        prompt: 'Find r(q(x)).'
        choices:
          - {value: a, label: '\( \dfrac{8x}{x+3}-1 \)', speak: "the fraction 8 x, over x plus 3, end fraction, minus 1"}
          - {value: b, label: '\( \dfrac{8x-2}{x+3} \)', speak: "the fraction 8 x minus 2, over x plus 3, end fraction"}
          - {value: c, label: '\( \dfrac{8x-2}{4x+2} \)', speak: "the fraction 8 x minus 2, over 4 x plus 2, end fraction"}
          - {value: d, label: '\( \dfrac{8x-1}{4x+2} \)', speak: "the fraction 8 x minus 1, over 4 x plus 2, end fraction"}
        correct: c
        explanation: |-
          Replace <em>both</em> \( x \)'s in \( r \), top and bottom, with \( (4x-1) \): \( r(q(x))=\dfrac{2(4x-1)}{(4x-1)+3}=\dfrac{8x-2}{4x+2} \). It also simplifies to \( \dfrac{4x-1}{2x+1} \), dividing top and bottom by 2. \( \dfrac{8x}{x+3}-1 \) is \( q(r(x)) \), the other order; \( \dfrac{8x-2}{x+3} \) replaces only the \( x \) on top; and \( 8x-1 \) multiplies only the \( 4x \) by 2. <strong>\( \dfrac{8x-2}{4x+2} \).</strong>
      - id: cp4
        title: "Compose 4"
        math:
          display: '\begin{aligned} r(x)&=\dfrac{x}{x+2}\\ q(x)&=2x^{2}-1 \end{aligned}'
          speak: "r of x equals the fraction x, over x plus 2, end fraction. q of x equals 2 x squared minus 1."
        prompt: 'Find q(r(x)).'
        choices:
          - {value: a, label: '\( \dfrac{2x^{2}-1}{2x^{2}+1} \)', speak: "the fraction 2 x squared minus 1, over 2 x squared plus 1, end fraction"}
          - {value: b, label: '\( 2\left(\dfrac{x^{2}}{x+2}\right)-1 \)', speak: "2 times the quantity the fraction x squared, over x plus 2, end fraction, end quantity, minus 1"}
          - {value: c, label: '\( (2x^{2}-1)\left(\dfrac{x}{x+2}\right) \)', speak: "the quantity 2 x squared minus 1, end quantity, times the quantity the fraction x, over x plus 2, end fraction, end quantity"}
          - {value: d, label: '\( 2\left(\dfrac{x}{x+2}\right)^{2}-1 \)', speak: "2 times the quantity the fraction x, over x plus 2, end fraction, end quantity, squared, minus 1"}
        correct: d
        explanation: |-
          \( r \) is listed first, but the letters decide: in \( q(r(x)) \), \( r \) is inside. Replace the \( x \) in \( q \) with the whole fraction: \( q(r(x))=2\left(\dfrac{x}{x+2}\right)^{2}-1 \), which is how CheckIt leaves it. It also equals \( \dfrac{2x^{2}}{(x+2)^{2}}-1 \). \( \dfrac{2x^{2}-1}{2x^{2}+1} \) is \( r(q(x)) \), the other order; \( 2\left(\dfrac{x^{2}}{x+2}\right)-1 \) squares the top of the fraction but not the bottom; and \( (2x^{2}-1)\left(\dfrac{x}{x+2}\right) \) is the product \( q(x)\cdot r(x) \). <strong>\( 2\left(\dfrac{x}{x+2}\right)^{2}-1 \).</strong>
  - id: evaluate
    label: "Try It: Evaluate a Composition"
    heading: "Try It: Evaluate a Composition"
    intro: |-
      To find a composition at a number, work from the inside out: one number goes in, and its output goes into the next function. Make your best guess, then check it.
    items:
      - id: ev1
        title: "Evaluate 1"
        figure:
          file: figures/FN5/compose.svg
          title: "Two machines in a row, with the output of the first feeding the second"
          caption: 'A diagram of two machines in a row. The input 2 goes into machine g first. Its output, g(2), goes into machine f second. The final output, f(g(2)), is marked with a question mark.'
        math:
          display: '\begin{aligned} f(x)&=3x-2\\ g(x)&=x^{2}+1 \end{aligned}'
          speak: "f of x equals 3 x minus 2. g of x equals x squared plus 1."
        prompt: 'Find f(g(2)).'
        choices:
          - {value: a, label: '\( 17 \)', speak: "17"}
          - {value: b, label: '\( 13 \)', speak: "13"}
          - {value: c, label: '\( 20 \)', speak: "20"}
          - {value: d, label: '\( 5 \)', speak: "5"}
        correct: b
        explanation: |-
          Inside first: \( g(2)=2^{2}+1=5 \). Then put 5 into \( f \): \( f(5)=3(5)-2=13 \). 17 is \( g(f(2))=g(4) \), the other order; 20 is the product \( f(2)\cdot g(2)=4\cdot 5 \); and 5 stops halfway, at \( g(2) \). <strong>\( f(g(2))=13 \).</strong>
      - id: ev2
        title: "Evaluate 2"
        math:
          display: '\begin{aligned} p(x)&=x^{2}-4\\ q(x)&=\sqrt{2x+1} \end{aligned}'
          speak: "p of x equals x squared minus 4. q of x equals the square root of 2 x plus 1, end root."
        prompt: 'Find q(p(3)).'
        choices:
          - {value: a, label: '\( \sqrt{11} \)', speak: "the square root of 11, end root"}
          - {value: b, label: '\( 3 \)', speak: "3"}
          - {value: c, label: '\( \sqrt{7} \)', speak: "the square root of 7, end root"}
          - {value: d, label: '\( \sqrt{10}+1 \)', speak: "the square root of 10, end root, plus 1"}
        correct: a
        explanation: |-
          Inside first: \( p(3)=9-4=5 \). Then \( q(5)=\sqrt{2(5)+1}=\sqrt{11} \), an exact answer to leave as it is. 3 is \( p(q(3))=\left(\sqrt{7}\right)^{2}-4 \), the other order; \( \sqrt{7} \) is \( q(3) \), which skips \( p \); and \( \sqrt{10}+1 \) takes the root of \( 2(5) \) before adding the 1. <strong>\( q(p(3))=\sqrt{11} \).</strong>
      - id: ev3
        title: "Evaluate 3"
        math:
          display: '\begin{aligned} p(x)&=x^{3}+1\\ r(x)&=\dfrac{3x}{x+2} \end{aligned}'
          speak: "p of x equals x cubed plus 1. r of x equals the fraction 3 x, over x plus 2, end fraction."
        prompt: 'Find r(p(−2)).'
        choices:
          - {value: a, label: '\( -7 \)', speak: "negative 7"}
          - {value: b, label: '\( -\tfrac{21}{5} \)', speak: "negative the fraction 21, over 5, end fraction"}
          - {value: c, label: '\( \tfrac{27}{11} \)', speak: "the fraction 27, over 11, end fraction"}
          - {value: d, label: '\( \tfrac{21}{5} \)', speak: "the fraction 21, over 5, end fraction"}
        correct: d
        explanation: |-
          Inside first, and the input is negative: \( p(-2)=(-2)^{3}+1=-8+1=-7 \). Then \( -7 \) replaces both \( x \)'s in \( r \): \( r(-7)=\dfrac{3(-7)}{-7+2}=\dfrac{-21}{-5}=\dfrac{21}{5} \). \( -7 \) stops at \( p(-2) \); \( -\tfrac{21}{5} \) works out \( -7+2 \) as 5; and \( \tfrac{27}{11} \) uses \( (-2)^{3}=8 \), so \( p(-2) \) comes out 9. <strong>\( r(p(-2))=\tfrac{21}{5} \).</strong>
      - id: ev4
        title: "The Other Order"
        math:
          display: '\begin{aligned} h(x)&=x^{2}+2\\ q(x)&=3x-1\\ h(q(x))&=9x^{2}-6x+3 \end{aligned}'
          speak: "h of x equals x squared plus 2. q of x equals 3 x minus 1. h of q of x equals 9 x squared minus 6 x plus 3."
        prompt: 'Like CheckIt, the formula for h(q(x)) is given first. Now find q(h(−1)).'
        choices:
          - {value: a, label: '\( 18 \)', speak: "18"}
          - {value: b, label: '\( 8 \)', speak: "8"}
          - {value: c, label: '\( 3 \)', speak: "3"}
          - {value: d, label: '\( 2 \)', speak: "2"}
        correct: b
        explanation: |-
          The question asks for \( q(h(-1)) \), the opposite order from the formula, so that formula does not help. Inside first: \( h(-1)=(-1)^{2}+2=3 \). Then \( q(3)=3(3)-1=8 \). 18 puts \( -1 \) into the \( h(q(x)) \) formula, the wrong order; 3 stops at \( h(-1) \); and 2 squares \( -1 \) as \( -1 \), so \( h(-1) \) comes out 1 and \( q(1)=2 \). <strong>\( q(h(-1))=8 \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\begin{aligned} f(x)-g(x)&=(2x^{2}+4x)-(2x-3)\\ &=2x^{2}+4x-2x-3\\ &=2x^{2}+2x-3 \end{aligned}'
          speak: "f of x minus g of x equals the quantity 2 x squared plus 4 x, end quantity, minus the quantity 2 x minus 3, end quantity. That equals 2 x squared plus 4 x minus 2 x minus 3, which equals 2 x squared plus 2 x minus 3."
        prompt: 'A student wrote this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "It should be g(x) − f(x), the other way around instead."}
          - {value: c, label: "The minus must reach the −3 too: 2x² + 2x + 3."}
          - {value: d, label: "The x terms should add instead, giving 2x² + 6x − 3."}
        correct: c
        explanation: |-
          Subtracting \( (2x-3) \) means subtracting both terms: \( -(2x-3)=-2x+3 \). The student changed the sign of \( 2x \) but not of \( -3 \). Correct: \( 2x^{2}+2x+3 \). The question asked for \( f(x)-g(x) \), so the order is right; and \( 4x-2x \) really is \( 2x \), not \( 6x \). <strong>\( f(x)-g(x)=2x^{2}+2x+3 \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: 'f(x)\cdot g(x)=(2x+3)(3x-1)=6x^{2}-3'
          speak: "f of x times g of x equals the quantity 2 x plus 3, end quantity, times the quantity 3 x minus 1, end quantity, which equals 6 x squared minus 3"
        prompt: 'A student wrote this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "(3)(−1) is +3, so it should be 6x² + 3."}
          - {value: c, label: "A product means composition, so it is 2(3x − 1) + 3."}
          - {value: d, label: "The middle terms were dropped: 6x² + 7x − 3."}
        correct: d
        explanation: |-
          Every term multiplies every term: \( 2x\cdot 3x=6x^{2} \), \( 2x\cdot(-1)=-2x \), \( 3\cdot 3x=9x \), and \( 3\cdot(-1)=-3 \). The middle terms combine to \( 7x \): \( 6x^{2}+7x-3 \). \( (3)(-1) \) is \( -3 \), which the student had right; and \( 2(3x-1)+3 \) is \( f(g(x)) \), a composition, not a product. <strong>\( 6x^{2}+7x-3 \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: 'f(x)=x^{2},\quad g(x)=x+5'
          speak: "f of x equals x squared, and g of x equals x plus 5"
        prompt: 'A student says f(g(x)) = x² + 5. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "That is g(f(x)); f(g(x)) is (x + 5)²."}
          - {value: c, label: "Composition multiplies them: x²(x + 5)."}
          - {value: d, label: "Square each of the two terms: x² + 25."}
        correct: b
        explanation: |-
          In \( f(g(x)) \), \( g \) goes first and \( f \) squares its output: \( f(g(x))=(x+5)^{2}=x^{2}+10x+25 \). The student squared first and then added 5, which is \( g(f(x)) \). \( x^{2}(x+5) \) is the product \( f(x)\cdot g(x) \); and \( (x+5)^{2} \) is not \( x^{2}+25 \): squaring a sum has a middle term, \( 10x \). <strong>\( f(g(x))=(x+5)^{2}=x^{2}+10x+25 \).</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: '\begin{aligned} f(x)&=\sqrt{2x+1},\quad g(x)=x^{2}-1\\ f(g(2))&=f(3)=\sqrt{7} \end{aligned}'
          speak: "f of x equals the square root of 2 x plus 1, end root, and g of x equals x squared minus 1. f of g of 2 equals f of 3, which equals the square root of 7."
        prompt: 'A student wrote this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Apply f first: g(f(2)) = g(√5) = 4."}
          - {value: c, label: "It should be √3, since g(2) = 3."}
          - {value: d, label: "It should be 7, since the root and the square cancel."}
        correct: a
        explanation: |-
          Inside first: \( g(2)=4-1=3 \). Then \( f(3)=\sqrt{2(3)+1}=\sqrt{7} \). The student is right. \( g(f(2)) \) is the other order; \( \sqrt{3} \) puts 3 under the root without doubling it and adding 1; and nothing cancels, because the root belongs to \( f \) and the square belongs to \( g \). <strong>There is no mistake: \( f(g(2))=\sqrt{7} \).</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: '\dfrac{f(x)}{g(x)}=\dfrac{2x^{2}+3}{2x}=x+3'
          speak: "the fraction f of x, over g of x, end fraction, equals the fraction 2 x squared plus 3, over 2 x, end fraction, which equals x plus 3"
        prompt: 'A student simplified this quotient by canceling 2x. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Flip it: the quotient should be 2x over (2x² + 3)."}
          - {value: c, label: "2x is not a factor of 2x² + 3, so it cannot cancel."}
          - {value: d, label: "It should be x + 1.5, dividing just the 3 by the 2."}
        correct: c
        explanation: |-
          Only a factor of the <em>whole</em> top can cancel, and \( 2x \) divides the \( 2x^{2} \) but not the 3. Splitting the fraction gives \( \dfrac{2x^{2}}{2x}+\dfrac{3}{2x}=x+\dfrac{3}{2x} \), or leave it as \( \dfrac{2x^{2}+3}{2x} \), the way CheckIt does. The order \( f \) over \( g \) is right as written; and \( x+1.5 \), which is \( x+\tfrac{3}{2} \), forgets that the 3 is divided by \( 2x \), not by 2. <strong>\( \dfrac{2x^{2}+3}{2x}=x+\dfrac{3}{2x} \), not \( x+3 \).</strong>
