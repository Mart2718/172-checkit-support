# LF3 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt LF3 asks students to graph four lines on a -8 to 8 grid. (1) A line through two points in opposite quadrants, through a
# point and an x- or y-intercept, or through two intercepts. (2) A line with a whole-number slope from -4 to 4 (which can be 0) through a point
# or with an x- or y-intercept. (3) A horizontal or vertical line, y = c or x = c, with c from -7 to 7. (4) A line from its equation
# in point-slope or slope-intercept form (whole-number slope from -3 to 3, not 0), or standard form Ax + By = C (A, B from -6 to 6,
# not 0; C from -7 to 7, can be 0), whose slope and intercepts are often fractions.
# The answer is a graph, so these items practice the decisions behind the graph: which points to plot and which way to move.
# Figures drawn by tools/figures/make_lf3.py.
code: LF3
h1: "LF3 Support: Graphing Lines"
pageTitle: "LF3 Support: Graphing Lines — Math 172, Santa Ana College"
hubSummary: "Graphing lines from points, intercepts, a slope, or an equation in any form, including horizontal and vertical lines"
videoIntro: "A narrated walkthrough of graphing lines: plotting two points or intercepts, using a slope to find a second point, reading point-slope, slope-intercept, and standard form, and graphing horizontal and vertical lines."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'no mistake|the answer|horizontal|vertical|rising|falling'
worked:   # used for the worked-examples recording document
  title: "LF3 Worked Examples: Graphing Lines"
  coreQuestion: "What two points can I plot?"
  coreFollowup: "Every line needs two points. Intercepts give points with a 0 in them: an x-intercept of 3 is the point (3, 0). A slope gives a second point from the first: a slope of −2/5 means right 5, down 2. From an equation, find a point and the slope, or both intercepts. x = c is a vertical line and y = c is a horizontal one."
summary:   # the Quick Summary tab
  intro: 'To graph a line you need <strong>two points</strong>, or one point and the slope to find a second. Every LF3 problem hands you one of those combinations, sometimes in disguise.'
  caption: "Summary: Graphing Lines"
  columns: ["You are given", "Points to plot", "What to watch for"]
  rows:     # first cell of each row is the row header
    -
      - 'Intercepts'
      - 'An <span>\( x \)</span>-intercept <span>\( a \)</span> is the point <span>\( (a,0) \)</span>; a <span>\( y \)</span>-intercept <span>\( b \)</span> is <span>\( (0,b) \)</span>.'
      - 'Put the 0 in the right place: the <span>\( x \)</span>-intercept is on the <span>\( x \)</span>-axis.'
    -
      - 'A point and a slope'
      - 'Plot the point. For slope <span>\( \tfrac{p}{q} \)</span>, move right <span>\( q \)</span> and up <span>\( p \)</span> (down if the slope is negative), and plot again.'
      - 'Rise over run: the top number is up or down, the bottom is across. Slope 0 means a flat line.'
    -
      - 'Slope-intercept form'
      - 'For <span>\( y=mx+b \)</span>, start at <span>\( (0,b) \)</span> and use the slope <span>\( m \)</span>.'
      - 'A whole-number slope like 3 means right 1, up 3.'
    -
      - 'Point-slope form'
      - 'For <span>\( y-y_{1}=m(x-x_{1}) \)</span>, plot <span>\( (x_{1},y_{1}) \)</span> and use the slope.'
      - 'The equation shows the opposite signs of the point: <span>\( y-4=-2(x+5) \)</span> goes through <span>\( (-5,4) \)</span>. A 0 coordinate drops out: <span>\( y-2=3x \)</span> goes through <span>\( (0,2) \)</span>.'
    -
      - 'Standard form'
      - 'For <span>\( Ax+By=C \)</span>, set <span>\( x=0 \)</span> for the <span>\( y \)</span>-intercept and <span>\( y=0 \)</span> for the <span>\( x \)</span>-intercept, or solve for <span>\( y \)</span>.'
      - 'If an intercept is a fraction, solve for <span>\( y \)</span> and use the slope. If the <span>\( y \)</span>-intercept is a fraction too, try <span>\( x=1,2,-1,\ldots \)</span> until <span>\( y \)</span> comes out whole. If <span>\( C=0 \)</span>, both intercepts are <span>\( (0,0) \)</span>, so you need a second point.'
    -
      - 'x = c or y = c'
      - '<span>\( x=c \)</span> is the vertical line through <span>\( (c,0) \)</span>; <span>\( y=c \)</span> is the horizontal line through <span>\( (0,c) \)</span>.'
      - 'Every point on <span>\( x=c \)</span> has <span>\( x \)</span>-coordinate <span>\( c \)</span>, so it goes up and down. <span>\( c \)</span> can be 0: <span>\( x=0 \)</span> is the <span>\( y \)</span>-axis.'
  note: 'Draw the line all the way across the grid, with arrows if you like, not just between your two points. A good check: plot a third point from the equation and make sure it lands on your line. CheckIt''s grid runs from −8 to 8. Your CheckIt lines will be different. Finding two points is what transfers.'
tabs:
  - id: plan
    label: "Try It: Find Two Points"
    heading: "Try It: Find Two Points"
    intro: |-
      Before you draw, decide which points to plot. Make your best guess on each one, then check it.
    items:
      - id: g1
        title: "Two Intercepts"
        math:
          display: '\begin{aligned} &x\text{-intercept }-3\\ &y\text{-intercept }5 \end{aligned}'
          speak: "x-intercept negative 3, y-intercept 5"
        prompt: 'Which two points do you plot to graph this line?'
        choices:
          - {value: a, label: "(0, −3) and (5, 0)"}
          - {value: b, label: "(−3, 0) and (0, 5)"}
          - {value: c, label: "(−3, 5) only"}
          - {value: d, label: "(3, 0) and (0, 5)"}
        correct: b
        explanation: |-
          An intercept is where the line crosses an axis. The \( x \)-intercept is on the \( x \)-axis, where \( y=0 \): \( (-3,0) \). The \( y \)-intercept is on the \( y \)-axis, where \( x=0 \): \( (0,5) \). Plot both and draw the line through them. \( (0,-3) \) and \( (5,0) \) put each 0 in the wrong place; \( (-3,5) \) is a single point, which is not enough for a line and is not on this one; and \( (3,0) \) drops the minus sign. <strong>\( (-3,0) \) and \( (0,5) \).</strong>
      - id: g2
        title: "Point and Intercept"
        figure:
          file: figures/LF3/g2.svg
          title: "Two points plotted on a grid from −8 to 8, with no line drawn yet"
          caption: 'A grid from −8 to 8 in both directions, with grid lines every 1 unit. Two points are plotted: (0, 3) on the y-axis and (4, −2). No line is drawn yet.'
        math:
          display: '(4,-2),\quad y\text{-intercept }3'
          speak: "the point 4 comma negative 2, and y-intercept 3"
        prompt: 'What is the slope of the line through these two points?'
        choices:
          - {value: a, label: '\( -\tfrac{5}{4} \)', speak: "negative the fraction 5, over 4, end fraction"}
          - {value: b, label: '\( \tfrac{5}{4} \)', speak: "the fraction 5, over 4, end fraction"}
          - {value: c, label: '\( -\tfrac{4}{5} \)', speak: "negative the fraction 4, over 5, end fraction"}
          - {value: d, label: '\( \tfrac{4}{5} \)', speak: "the fraction 4, over 5, end fraction"}
        correct: a
        explanation: |-
          The \( y \)-intercept 3 is the point \( (0,3) \). From \( (0,3) \) to \( (4,-2) \): over 4, down 5, so \( m=\dfrac{-2-3}{4-0}=-\tfrac{5}{4} \). You do not need the slope to draw this line, since two points are enough, but it tells you which way the line goes. \( \tfrac{5}{4} \) misses that the line goes down; \( -\tfrac{4}{5} \) is run over rise; and \( \tfrac{4}{5} \) makes both slips: run over rise, and up instead of down. <strong>\( -\tfrac{5}{4} \).</strong>
      - id: g3
        title: "Slope and Intercept"
        math:
          display: 'm=-2,\quad x\text{-intercept }3'
          speak: "slope negative 2, x-intercept 3"
        prompt: 'You plot (3, 0). Which point should you plot next?'
        choices:
          - {value: a, label: "(5, 1)"}
          - {value: b, label: "(5, −1)"}
          - {value: c, label: "(3, −2)"}
          - {value: d, label: "(4, −2)"}
        correct: d
        explanation: |-
          The \( x \)-intercept 3 is the point \( (3,0) \). A slope of \( -2 \) is \( \tfrac{-2}{1} \): right 1, down 2, to \( (4,-2) \). Going left 1 and up 2, to \( (2,2) \), works too. \( (5,1) \) moves right 2 and up 1, which swaps rise and run and loses the minus; \( (5,-1) \) moves right 2 and down 1, which is slope \( -\tfrac{1}{2} \); and \( (3,-2) \) moves down without moving across, which does not use a run at all. <strong>\( (4,-2) \).</strong>
      - id: g4
        title: "Point and Slope"
        math:
          display: 'm=3,\quad (-2,1)'
          speak: "slope 3, through the point negative 2 comma 1"
        prompt: 'You plot (−2, 1). Which point is also on the line?'
        choices:
          - {value: a, label: "(−3, 4)"}
          - {value: b, label: "(−1, 4)"}
          - {value: c, label: "(1, 2)"}
          - {value: d, label: "(−2, 4)"}
        correct: b
        explanation: |-
          Slope 3 means \( \tfrac{3}{1} \): right 1, up 3. From \( (-2,1) \) that lands on \( (-1,4) \). \( (-3,4) \) goes left 1 and up 3, which is slope \( -3 \); \( (1,2) \) goes right 3 and up 1, slope \( \tfrac{1}{3} \); and \( (-2,4) \) goes straight up, with no run. <strong>\( (-1,4) \).</strong>
  - id: forms
    label: "Try It: Read the Equation"
    heading: "Try It: Read the Equation"
    intro: |-
      Each form of a line's equation tells you something to plot. Make your best guess, then check it.
    items:
      - id: e1
        title: "Slope-Intercept Form"
        math:
          display: 'y=-3x+2'
          speak: "y equals negative 3 x plus 2"
        prompt: 'How do you graph this line?'
        choices:
          - {value: a, label: "Start at (2, 0); go right 1, down 3."}
          - {value: b, label: "Start at (0, 2); go right 3, down 1."}
          - {value: c, label: "Start at (0, 2); go right 1, down 3."}
          - {value: d, label: "Start at (2, 0); go right 1, up 3."}
        correct: c
        explanation: |-
          In \( y=mx+b \), \( b=2 \) is the \( y \)-intercept, the point \( (0,2) \). The slope \( -3 \) is \( \tfrac{-3}{1} \): down 3 for every 1 across. So from \( (0,2) \) go right 1 and down 3, to \( (1,-1) \). Starting at \( (2,0) \) puts the intercept on the wrong axis; right 3, down 1 flips rise and run, which is slope \( -\tfrac{1}{3} \); and \( (2,0) \) with up 3 makes two slips, the wrong axis and a lost minus sign. <strong>Start at \( (0,2) \); go right 1, down 3.</strong>
      - id: e2
        title: "Point-Slope Form"
        math:
          display: 'y-2=-3(x+1)'
          speak: "y minus 2 equals negative 3 times the quantity x plus 1, end quantity"
        prompt: 'Which point and slope does this equation give?'
        choices:
          - {value: a, label: "The point (−1, 2), slope −3"}
          - {value: b, label: "The point (1, −2), slope −3"}
          - {value: c, label: "The point (−1, 2), slope 3"}
          - {value: d, label: "The point (1, −2), slope 3"}
        correct: a
        explanation: |-
          Point-slope form is \( y-y_{1}=m(x-x_{1}) \). Here \( y-2 \) means \( y_{1}=2 \), and \( x+1=x-(-1) \) means \( x_{1}=-1 \). The slope is the number in front, \( -3 \). Plot \( (-1,2) \), then go right 1 and down 3. \( (1,-2) \) reads the signs as written instead of flipping them; slope 3 drops the minus; and \( (1,-2) \) with slope 3 makes both slips. <strong>\( (-1,2) \), slope \( -3 \).</strong>
      - id: e3
        title: "Standard Form 1"
        math:
          display: '2x-3y=6'
          speak: "2 x minus 3 y equals 6"
        prompt: 'Which two intercepts can you plot to graph this line?'
        choices:
          - {value: a, label: "(3, 0) and (0, 2)"}
          - {value: b, label: "(3, 0) and (0, −2)"}
          - {value: c, label: "(−3, 0) and (0, 2)"}
          - {value: d, label: "(2, 0) and (0, −3)"}
        correct: b
        explanation: |-
          Set \( y=0 \): \( 2x=6 \), so \( x=3 \), the point \( (3,0) \). Set \( x=0 \): \( -3y=6 \), so \( y=-2 \), the point \( (0,-2) \). Standard form makes intercepts quick. \( (0,2) \) loses the sign from dividing by \( -3 \); \( (-3,0) \) and \( (0,2) \) come from changing the sign of the 6, as \( 2x=-6 \) and \( -3y=-6 \); and \( (2,0) \) and \( (0,-3) \) divide 6 by the other variable's number. <strong>\( (3,0) \) and \( (0,-2) \).</strong>
      - id: e4
        title: "Standard Form 2"
        math:
          display: '3x+4y=4'
          speak: "3 x plus 4 y equals 4"
        prompt: 'The x-intercept here is 4/3, which is hard to plot. Which two points work better?'
        choices:
          - {value: a, label: "(0, 1) and (4, −2)"}
          - {value: b, label: "(0, 1) and (4, 4)"}
          - {value: c, label: "(0, 4) and (4, 1)"}
          - {value: d, label: "(0, 1) and (3, −3)"}
        correct: a
        explanation: |-
          Solve for \( y \): \( 4y=-3x+4 \), so \( y=-\tfrac{3}{4}x+1 \). Start at the \( y \)-intercept \( (0,1) \) and use the slope: right 4, down 3, to \( (4,-2) \). Check: \( 3(4)+4(-2)=4 \). This is the move to make whenever a standard-form intercept is a fraction. \( (4,4) \) goes up instead of down; \( (0,4) \) forgets to divide by 4, then moves right 4, down 3 from there; and \( (3,-3) \) goes right 3 and down 4, which flips rise and run. <strong>\( (0,1) \) and \( (4,-2) \).</strong>
  - id: flat
    label: "Try It: Flat and Upright Lines"
    heading: "Try It: Flat and Upright Lines"
    intro: |-
      One CheckIt line is always x = c or y = c, and a slope can be 0. Make your best guess, then check it.
    items:
      - id: h1
        title: "x = c"
        math:
          display: 'x=-4'
          speak: "x equals negative 4"
        prompt: 'What does the graph of this line look like?'
        choices:
          - {value: a, label: "A vertical line through (−4, 0)"}
          - {value: b, label: "A horizontal line through (0, −4)"}
          - {value: c, label: "A line through the origin with slope −4"}
          - {value: d, label: "A horizontal line through (0, 4)"}
        correct: a
        explanation: |-
          The equation says every point has \( x=-4 \), whatever \( y \) is: \( (-4,0) \), \( (-4,3) \), \( (-4,-7) \). Those points stack straight up and down, so the graph is the vertical line through \( (-4,0) \). A horizontal line through \( (0,-4) \) is \( y=-4 \); slope \( -4 \) through the origin is \( y=-4x \); and a horizontal line through \( (0,4) \) is \( y=4 \), which uses the wrong direction and drops the sign. <strong>A vertical line through \( (-4,0) \).</strong>
      - id: h2
        title: "Name the Line"
        figure:
          file: figures/LF3/h2.svg
          title: "A straight line on a grid from −8 to 8"
          caption: 'A straight line on a grid from −8 to 8 in both directions, with grid lines every 1 unit. It runs straight across at height −2, through (−8, −2), (0, −2) and (8, −2).'
          collapse: true
        prompt: 'Which equation does this graph show?'
        choices:
          - {value: a, label: '\( x=-2 \)', speak: "x equals negative 2"}
          - {value: b, label: '\( y=-2x \)', speak: "y equals negative 2 x"}
          - {value: c, label: '\( y=-2 \)', speak: "y equals negative 2"}
          - {value: d, label: '\( y=x-2 \)', speak: "y equals x minus 2"}
        correct: c
        explanation: |-
          Every point on this line has height \( -2 \), whatever its \( x \): \( (-8,-2) \), \( (0,-2) \), \( (8,-2) \). That is the equation \( y=-2 \). \( x=-2 \) would be an up-and-down line through \( (-2,0) \); \( y=-2x \) goes through the origin and falls steeply; and \( y=x-2 \) rises with slope 1. <strong>\( y=-2 \).</strong>
      - id: h3
        title: "Slope 0"
        math:
          display: 'm=0,\quad (2,-5)'
          speak: "slope 0, through the point 2 comma negative 5"
        prompt: 'Which is the equation of this line?'
        choices:
          - {value: a, label: '\( x=2 \)', speak: "x equals 2"}
          - {value: b, label: '\( y=-5 \)', speak: "y equals negative 5"}
          - {value: c, label: '\( y=2 \)', speak: "y equals 2"}
          - {value: d, label: '\( x=-5 \)', speak: "x equals negative 5"}
        correct: b
        explanation: |-
          Slope 0 means the height never changes. The line goes through \( (2,-5) \), so its height is always \( -5 \): \( y=-5 \). Point-slope form agrees: \( y+5=0(x-2) \), so \( y=-5 \). \( x=2 \) is the up-and-down line, whose slope is undefined, not 0; \( y=2 \) uses the wrong coordinate; and \( x=-5 \) uses the right number but makes an up-and-down line. <strong>\( y=-5 \).</strong>
      - id: h4
        title: "The Value 0"
        math:
          display: 'x=0'
          speak: "x equals 0"
        prompt: 'CheckIt can ask you to graph this line. What is its graph?'
        choices:
          - {value: a, label: "The x-axis"}
          - {value: b, label: "The y-axis"}
          - {value: c, label: "Only the point (0, 0)"}
          - {value: d, label: "Nothing: x = 0 has no line to draw"}
        correct: b
        explanation: |-
          \( x=0 \) is a vertical line like any \( x=c \): every point has \( x \)-coordinate 0, such as \( (0,-3) \), \( (0,0) \) and \( (0,5) \). Those are exactly the points on the \( y \)-axis. The \( x \)-axis is \( y=0 \); \( (0,0) \) is only one of the points, and \( y \) can be anything; and 0 is a value like any other, so the line is there. <strong>The \( y \)-axis.</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each graph below was drawn by a student, with the student's plotted points marked. Decide whether it is right, and if not, what went wrong, before you check.
    items:
      - id: sl1
        title: "Slip 1"
        figure:
          file: figures/LF3/s1.svg
          title: "A student's graph on a grid from −8 to 8, with two plotted points"
          caption: 'A student''s graph on a grid from −8 to 8. The student plotted (0, 3) and (1, 5) and drew the straight line through them, which goes up from left to right.'
        math:
          display: 'y=-2x+3'
          speak: "y equals negative 2 x plus 3"
        prompt: 'A student graphed this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "It should go down: right 1, down 2 from (0, 3)."}
          - {value: c, label: "The y-intercept should be the point (3, 0) instead."}
          - {value: d, label: "Slope −2 means right 2, down 1, from (0, 3)."}
        correct: b
        explanation: |-
          The starting point \( (0,3) \) is right. But the slope is \( -2 \), so from \( (0,3) \) the line goes right 1 and <em>down</em> 2, to \( (1,1) \). The student went up, to \( (1,5) \), which is slope \( +2 \). The \( y \)-intercept is on the \( y \)-axis, \( (0,3) \), not \( (3,0) \), which puts it on the wrong axis; and right 2, down 1 flips rise and run, which is slope \( -\tfrac{1}{2} \). <strong>From \( (0,3) \), go right 1 and down 2.</strong>
      - id: sl2
        title: "Slip 2"
        figure:
          file: figures/LF3/s2.svg
          title: "A student's graph on a grid from −8 to 8, with two plotted points"
          caption: 'A student''s graph on a grid from −8 to 8. The student plotted (−1, 3) and (2, 1) and drew the straight line through them.'
        math:
          display: '2x+3y=7'
          speak: "2 x plus 3 y equals 7"
        prompt: 'A student graphed this line by finding two points with whole-number coordinates. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "It should use the intercepts, not other points."}
          - {value: c, label: "It should go up, since 2 and 3 are positive."}
          - {value: d, label: "It should cross the y-axis at (0, 7), since C is 7."}
        correct: a
        explanation: |-
          Both intercepts are fractions here: \( x=0 \) gives \( y=\tfrac{7}{3} \), and \( y=0 \) gives \( x=\tfrac{7}{2} \). So the student tried whole numbers for \( x \). Check both points: \( 2(-1)+3(3)=7 \) and \( 2(2)+3(1)=7 \). The student is right. Any two points on the line work, and these are easier to plot than the intercepts; positive \( A \) and \( B \) make the slope \( -\tfrac{2}{3} \), so the line goes down; and \( (0,7) \) forgets to divide the 7 by 3. <strong>There is no mistake.</strong>
      - id: sl3
        title: "Slip 3"
        figure:
          file: figures/LF3/s3.svg
          title: "A student's graph on a grid from −8 to 8, with one plotted point"
          caption: 'A student''s graph on a grid from −8 to 8. The student plotted (0, 3) and drew a straight line through it that runs left to right at height 3.'
        math:
          display: 'x=3'
          speak: "x equals 3"
        prompt: 'A student graphed this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "It should be the line through the origin with slope 3."}
          - {value: c, label: "x = 3 is the up-and-down line through (3, 0)."}
          - {value: d, label: "It should be the up-and-down line through (0, 3)."}
        correct: c
        explanation: |-
          \( x=3 \) says every point has \( x \)-coordinate 3: \( (3,0) \), \( (3,5) \), \( (3,-2) \). Those points line up vertically, through \( (3,0) \). The student drew \( y=3 \), the horizontal line. The line through the origin with slope 3 is \( y=3x \), which reads the 3 as a slope; and the up-and-down line through \( (0,3) \) is the \( y \)-axis, \( x=0 \): it has the right direction but puts the 3 on the wrong axis, as the student did. <strong>Draw the vertical line through \( (3,0) \).</strong>
      - id: sl4
        title: "Slip 4"
        figure:
          file: figures/LF3/s4.svg
          title: "A student's graph on a grid from −8 to 8, with two plotted points"
          caption: 'A student''s graph on a grid from −8 to 8. The student plotted (3, 0) and (0, 2) and drew the straight line through them.'
        math:
          display: '3x+2y=6'
          speak: "3 x plus 2 y equals 6"
        prompt: 'A student graphed this line using its intercepts. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The line should go up, since both numbers are positive."}
          - {value: c, label: "The intercepts should be (−2, 0) and (0, −3)."}
          - {value: d, label: "The intercepts are swapped: they are (2, 0) and (0, 3)."}
        correct: d
        explanation: |-
          Set \( y=0 \): \( 3x=6 \), so \( x=2 \), the point \( (2,0) \). Set \( x=0 \): \( 2y=6 \), so \( y=3 \), the point \( (0,3) \). The student divided 6 by the wrong number each time. Check the student's point: \( 3(3)+2(0)=9 \), not 6. Positive \( A \) and \( B \) make the line go down, since the slope is \( -\tfrac{3}{2} \); and \( (-2,0) \) and \( (0,-3) \) would be the intercepts of \( 3x+2y=-6 \), which changes the sign of the 6. <strong>Plot \( (2,0) \) and \( (0,3) \).</strong>
      - id: sl5
        title: "Slip 5"
        figure:
          file: figures/LF3/s5.svg
          title: "A student's graph on a grid from −8 to 8, with two plotted points"
          caption: 'A student''s graph on a grid from −8 to 8. The student plotted (−3, 1) and (−2, 3) and drew the straight line through them.'
        math:
          display: 'y+1=2(x-3)'
          speak: "y plus 1 equals 2 times the quantity x minus 3, end quantity"
        prompt: 'A student graphed this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The point is (3, −1); the student read the signs as written."}
          - {value: c, label: "The slope should be 1/2, so right 2 and up 1."}
          - {value: d, label: "The point should be (−1, 3), with the coordinates swapped."}
        correct: b
        explanation: |-
          Point-slope form subtracts the coordinates: \( y+1=y-(-1) \), so \( y_{1}=-1 \), and \( x-3 \) means \( x_{1}=3 \). The point is \( (3,-1) \). The student used \( (-3,1) \). The slope 2 was used correctly: right 1, up 2. Slope \( \tfrac{1}{2} \) would flip rise and run; and \( (-1,3) \) swaps the coordinates of \( (3,-1) \), which gives a point that is not on the line: \( 3+1=4 \), but \( 2(-1-3)=-8 \). <strong>Plot \( (3,-1) \), then right 1 and up 2.</strong>
