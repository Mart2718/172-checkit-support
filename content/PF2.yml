banPhrases: '\b(tan|cot|sec|csc)\b|tangent|cotangent|secant|cosecant'
worked:   # used for the worked-examples recording document
  title: "PF2 Worked Examples: Graphing Tangent, Cotangent, Secant, and Cosecant"
  coreQuestion: "Where are the vertical asymptotes? Everything else, the period, the domain, and the sketch, is built on them."
  coreFollowup: "Start from the parent function's asymptotes. A number multiplying x squeezes or stretches them: divide each location by that number. A number added to x shifts them: subtract it. The domain is everything except the asymptotes. The range does not change: all real numbers for tangent and cotangent, and everything at or beyond 1 and negative 1 for secant and cosecant."
summary:   # the Quick Summary tab
  intro: 'Every PF2 question comes back to one idea: <strong>find the vertical asymptotes first.</strong> They set the period, the domain, and where each piece of the graph goes. In the table, <span>\( k \)</span> stands for any integer.'
  caption: "The four parent functions and what a stretch or shift does to them"
  columns: ["Function", "Vertical asymptotes", "Period", "Range"]
  rows:     # first cell of each row is the row header
    -
      - '<span>\( \tan x \)</span>'
      - '<span>\( x=\tfrac{\pi}{2}+k\pi \)</span>'
      - '<span>\( \pi \)</span>'
      - 'All real numbers, <span>\( (-\infty,\infty) \)</span>'
    -
      - '<span>\( \cot x \)</span>'
      - '<span>\( x=k\pi \)</span>'
      - '<span>\( \pi \)</span>'
      - 'All real numbers, <span>\( (-\infty,\infty) \)</span>'
    -
      - '<span>\( \sec x \)</span>'
      - '<span>\( x=\tfrac{\pi}{2}+k\pi \)</span> (same as tangent)'
      - '<span>\( 2\pi \)</span>, two branches per period'
      - '<span>\( (-\infty,-1]\cup[1,\infty) \)</span>'
    -
      - '<span>\( \csc x \)</span>'
      - '<span>\( x=k\pi \)</span> (same as cotangent)'
      - '<span>\( 2\pi \)</span>, two branches per period'
      - '<span>\( (-\infty,-1]\cup[1,\infty) \)</span>'
    -
      - 'A number times <span>\( x \)</span>, such as <span>\( \tan(3x) \)</span>'
      - 'Divide each location by the size of that number, ignoring any negative sign: <span>\( x=\tfrac{\pi}{6}+\tfrac{k\pi}{3} \)</span>.'
      - 'Divide the period by its size, ignoring any negative sign: <span>\( \tfrac{\pi}{3} \)</span>. For <span>\( \cot(-2x) \)</span> the period is <span>\( \tfrac{\pi}{2} \)</span>.'
      - 'No change.'
    -
      - 'A number added to <span>\( x \)</span>, such as <span>\( \tan\left(x+\tfrac{\pi}{4}\right) \)</span>'
      - 'Subtract it from each location: <span>\( x=\tfrac{\pi}{4}+k\pi \)</span>. Adding shifts left.'
      - 'No change.'
      - 'No change.'
  note: 'The domain is every real number except the asymptotes. CheckIt writes it as the open intervals between neighboring asymptotes, with dots at each end. For <span>\( \tan\left(x+\tfrac{\pi}{4}\right) \)</span> from the table, that is <span>\( \ldots\cup\left(-\tfrac{3\pi}{4},\tfrac{\pi}{4}\right)\cup\left(\tfrac{\pi}{4},\tfrac{5\pi}{4}\right)\cup\ldots \)</span>. CheckIt keeps a negative number inside, as in <span>\( \tan(-4x) \)</span>. For tangent, cotangent, and cosecant that flips the graph upside down, the same as <span>\( -\tan(4x) \)</span>; for secant there is no flip, since <span>\( \sec(-4x)=\sec(4x) \)</span>. It never moves the asymptotes or changes the period. CheckIt also writes a shift with the number first, as in <span>\( \sec\left(-\tfrac{3}{2}\pi+x\right) \)</span> (secant of negative three halves of π, plus x), which is <span>\( \sec\left(x-\tfrac{3\pi}{2}\right) \)</span>. Your CheckIt functions will have different numbers than these examples. The reasoning is what transfers.'
tabs:
  - id: asym
    label: "Try It: Asymptotes & Period"
    heading: "Try It: Asymptotes and Period"
    intro: |-
      Before you sketch anything, find where the graph breaks. Make your best guess on each one, then check it. In every answer, k stands for any integer.
    items:
      - id: ap1
        title: "Asymptotes 1"
        math:
          display: 'f(x)=\tan(3x)'
          speak: "f of x equals tangent of 3 x"
        prompt: 'Where are the vertical asymptotes of this function?'
        choices:
          - {value: a, label: '\( x=\tfrac{\pi}{2}+k\pi \)', speak: "x equals pi over 2, plus k pi"}
          - {value: b, label: '\( x=\tfrac{\pi}{6}+\tfrac{k\pi}{3} \)', speak: "x equals pi over 6, plus k pi over 3"}
          - {value: c, label: '\( x=\tfrac{3\pi}{2}+3k\pi \)', speak: "x equals 3 pi over 2, plus 3 k pi"}
          - {value: d, label: '\( x=\tfrac{k\pi}{3} \)', speak: "x equals k pi over 3"}
        correct: b
        explanation: |-
          Tangent breaks where its input is \( \tfrac{\pi}{2}+k\pi \). Here the input is \( 3x \), so set \( 3x=\tfrac{\pi}{2}+k\pi \) and divide everything by 3: \( x=\tfrac{\pi}{6}+\tfrac{k\pi}{3} \). The 3 squeezes the graph, so the asymptotes get closer together, not farther apart. The answer \( x=\tfrac{k\pi}{3} \) uses cotangent's asymptotes. <strong>The asymptotes are at \( x=\tfrac{\pi}{6}+\tfrac{k\pi}{3} \).</strong>
      - id: ap2
        title: "Asymptotes 2"
        math:
          display: 'g(x)=\csc\left(x+\dfrac{\pi}{4}\right)'
          speak: "g of x equals cosecant of the quantity x plus pi over 4, end quantity"
        prompt: 'Where are the vertical asymptotes of this function?'
        choices:
          - {value: a, label: '\( x=\tfrac{\pi}{4}+k\pi \)', speak: "x equals pi over 4, plus k pi"}
          - {value: b, label: '\( x=k\pi \)', speak: "x equals k pi"}
          - {value: c, label: '\( x=-\tfrac{\pi}{4}+2k\pi \)', speak: "x equals negative pi over 4, plus 2 k pi"}
          - {value: d, label: '\( x=-\tfrac{\pi}{4}+k\pi \)', speak: "x equals negative pi over 4, plus k pi"}
        correct: d
        explanation: |-
          Cosecant breaks where its input is \( k\pi \). Set \( x+\tfrac{\pi}{4}=k\pi \) and subtract: \( x=-\tfrac{\pi}{4}+k\pi \). Adding inside shifts the graph left, so the asymptotes move left by \( \tfrac{\pi}{4} \). They stay \( \pi \) apart even though the period of cosecant is \( 2\pi \), because one period holds two branches. <strong>The asymptotes are at \( x=-\tfrac{\pi}{4}+k\pi \).</strong>
      - id: ap3
        title: "Asymptotes 3"
        math:
          display: 'h(x)=\sec\left(\tfrac{1}{2}x\right)'
          speak: "h of x equals secant of the quantity one half x, end quantity"
        prompt: 'Where are the vertical asymptotes of this function?'
        choices:
          - {value: a, label: '\( x=\pi+2k\pi \)', speak: "x equals pi, plus 2 k pi"}
          - {value: b, label: '\( x=\tfrac{\pi}{4}+\tfrac{k\pi}{2} \)', speak: "x equals pi over 4, plus k pi over 2"}
          - {value: c, label: '\( x=\tfrac{\pi}{2}+k\pi \)', speak: "x equals pi over 2, plus k pi"}
          - {value: d, label: '\( x=2k\pi \)', speak: "x equals 2 k pi"}
        correct: a
        explanation: |-
          Secant breaks where its input is \( \tfrac{\pi}{2}+k\pi \). Set \( \tfrac{x}{2}=\tfrac{\pi}{2}+k\pi \) and multiply by 2: \( x=\pi+2k\pi \). Dividing by one half is the same as multiplying by 2, so the graph is stretched and the asymptotes spread out. The answer \( x=2k\pi \) uses cosecant's asymptotes. <strong>The asymptotes are at \( x=\pi+2k\pi \).</strong>
      - id: ap4
        title: "Period 1"
        math:
          display: 'f(x)=\cot(-2x)'
          speak: "f of x equals cotangent of negative 2 x"
        prompt: 'What is the period of this function?'
        choices:
          - {value: a, label: '\( 2\pi \)', speak: "2 pi"}
          - {value: b, label: '\( \tfrac{\pi}{2} \)', speak: "pi over 2"}
          - {value: c, label: '\( \pi \)', speak: "pi"}
          - {value: d, label: '\( \tfrac{\pi}{4} \)', speak: "pi over 4"}
        correct: b
        explanation: |-
          The period of cotangent is \( \pi \). The 2 inside squeezes the graph, so divide: \( \tfrac{\pi}{2} \). The negative sign inside flips the graph upside down, the same as \( -\cot(2x) \). It does not change the period or move the asymptotes, which are at \( x=\tfrac{k\pi}{2} \). Only the size of the number matters for the period. The answer \( 2\pi \) multiplies by 2 instead of dividing, and \( \tfrac{\pi}{4} \) divides by 2 twice. <strong>The period is \( \tfrac{\pi}{2} \).</strong>
      - id: ap5
        title: "Reading the Notation"
        math:
          display: 'g(x)=\sec\left(-\dfrac{3}{2}\pi+x\right)'
          speak: "g of x equals secant of the quantity negative 3 halves pi, plus x, end quantity"
        prompt: 'CheckIt sometimes writes the shift first, like this. Which function is the same?'
        choices:
          - {value: a, label: '\( g(x)=\sec\left(x+\tfrac{3\pi}{2}\right) \)', speak: "g of x equals secant of the quantity x plus 3 pi over 2, end quantity"}
          - {value: b, label: '\( g(x)=\sec\left(-\tfrac{3\pi}{2}x\right) \)', speak: "g of x equals secant of the quantity negative 3 pi over 2 times x, end quantity"}
          - {value: c, label: '\( g(x)=\sec\left(x-\tfrac{3\pi}{2}\right) \)', speak: "g of x equals secant of the quantity x minus 3 pi over 2, end quantity"}
          - {value: d, label: '\( g(x)=\sec(x)-\tfrac{3\pi}{2} \)', speak: "g of x equals secant of x, minus 3 pi over 2"}
        correct: c
        explanation: |-
          The input is negative three halves of \( \pi \), plus \( x \). Adding can be done in either order, so it is the same as \( x-\tfrac{3\pi}{2} \). The \( x \) is added to the number, not multiplied by it. The number is subtracted, so the graph shifts right by \( \tfrac{3\pi}{2} \). For the asymptotes, solve \( x-\tfrac{3\pi}{2}=\tfrac{\pi}{2}+k\pi \): \( x=2\pi+k\pi \), which is every multiple of \( \pi \). <strong>It is the same as \( g(x)=\sec\left(x-\tfrac{3\pi}{2}\right) \).</strong>
  - id: domain
    label: "Try It: Domain & Range"
    heading: "Try It: Domain and Range"
    intro: |-
      The domain skips every asymptote. The range depends only on which of the four functions you have. Make your best guess, then check it.
    items:
      - id: dr1
        title: "Domain 1"
        math:
          display: 'f(x)=\tan(2x)'
          speak: "f of x equals tangent of 2 x"
        prompt: 'What is the domain of this function?'
        choices:
          - {value: a, label: '\( \ldots\cup\left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right)\cup\left(\tfrac{\pi}{2},\tfrac{3\pi}{2}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative pi over 2 to pi over 2, union the open interval from pi over 2 to 3 pi over 2, union and so on"}
          - {value: b, label: '\( \ldots\cup\left(-\tfrac{\pi}{4},\tfrac{\pi}{4}\right)\cup\left(\tfrac{\pi}{4},\tfrac{3\pi}{4}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative pi over 4 to pi over 4, union the open interval from pi over 4 to 3 pi over 4, union and so on"}
          - {value: c, label: '\( \ldots\cup\left(0,\tfrac{\pi}{2}\right)\cup\left(\tfrac{\pi}{2},\pi\right)\cup\ldots \)', speak: "and so on, union the open interval from 0 to pi over 2, union the open interval from pi over 2 to pi, union and so on"}
          - {value: d, label: '\( (-\infty,\infty) \)', speak: "the open interval from negative infinity to infinity: all real numbers"}
        correct: b
        explanation: |-
          The asymptotes are where \( 2x=\tfrac{\pi}{2}+k\pi \), so \( x=\tfrac{\pi}{4}+\tfrac{k\pi}{2} \): at \( -\tfrac{\pi}{4} \), \( \tfrac{\pi}{4} \), \( \tfrac{3\pi}{4} \), and so on. The domain is the open intervals between them. The intervals around \( \tfrac{\pi}{2} \) ignore the 2. The intervals starting at 0 belong to \( \cot(2x) \). All real numbers is the range, not the domain. <strong>The domain is the open intervals between \( -\tfrac{\pi}{4} \), \( \tfrac{\pi}{4} \), \( \tfrac{3\pi}{4} \), and so on.</strong>
      - id: dr2
        title: "Range 1"
        math:
          display: 'g(x)=\sec\left(x-\dfrac{\pi}{4}\right)'
          speak: "g of x equals secant of the quantity x minus pi over 4, end quantity"
        prompt: 'What is the range of this function?'
        choices:
          - {value: a, label: '\( (-\infty,\infty) \)', speak: "the open interval from negative infinity to infinity: all real numbers"}
          - {value: b, label: '\( [-1,1] \)', speak: "the closed interval from negative 1 to 1"}
          - {value: c, label: '\( (-\infty,-1]\cup[1,\infty) \)', speak: "from negative infinity up to and including negative 1, union from 1, included, to infinity"}
          - {value: d, label: '\( (-\infty,-1)\cup(1,\infty) \)', speak: "from negative infinity up to negative 1, not included, union from 1, not included, to infinity"}
        correct: c
        explanation: |-
          A shift moves the graph left or right, which never changes the range. Secant is 1 divided by cosine, and cosine stays between \(-1\) and \(1\), so secant is always at least 1 or at most \(-1\). It reaches exactly 1 and \(-1\) at the turning points of each branch, so those ends are included with square brackets. The interval \( [-1,1] \) is the range of cosine. <strong>The range is everything at or above 1 together with everything at or below negative 1.</strong>
      - id: dr3
        title: "Domain 2"
        math:
          display: 'h(x)=\cot\left(\tfrac{1}{3}x\right)'
          speak: "h of x equals cotangent of the quantity one third x, end quantity"
        prompt: 'What is the domain of this function?'
        choices:
          - {value: a, label: '\( \ldots\cup(-3\pi,0)\cup(0,3\pi)\cup\ldots \)', speak: "and so on, union the open interval from negative 3 pi to 0, union the open interval from 0 to 3 pi, union and so on"}
          - {value: b, label: '\( \ldots\cup\left(-\tfrac{\pi}{3},0\right)\cup\left(0,\tfrac{\pi}{3}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative pi over 3 to 0, union the open interval from 0 to pi over 3, union and so on"}
          - {value: c, label: '\( \ldots\cup\left(-\tfrac{3\pi}{2},\tfrac{3\pi}{2}\right)\cup\left(\tfrac{3\pi}{2},\tfrac{9\pi}{2}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative 3 pi over 2 to 3 pi over 2, union the open interval from 3 pi over 2 to 9 pi over 2, union and so on"}
          - {value: d, label: '\( \ldots\cup(-\pi,0)\cup(0,\pi)\cup\ldots \)', speak: "and so on, union the open interval from negative pi to 0, union the open interval from 0 to pi, union and so on"}
        correct: a
        explanation: |-
          Cotangent breaks where its input is \( k\pi \). Set \( \tfrac{x}{3}=k\pi \) and multiply by 3: \( x=3k\pi \), so the asymptotes are at \( -3\pi \), \( 0 \), \( 3\pi \), and so on. The intervals with \( \tfrac{\pi}{3} \) divide by 3 instead of multiplying. The intervals ending at \( \tfrac{3\pi}{2} \) use tangent's asymptotes, and the intervals at \( \pi \) ignore the one third. <strong>The domain is the open intervals between \( -3\pi \), \( 0 \), \( 3\pi \), and so on.</strong>
      - id: dr4
        title: "Domain 3"
        math:
          display: 'f(x)=\tan\left(x+\dfrac{3\pi}{4}\right)'
          speak: "f of x equals tangent of the quantity x plus 3 pi over 4, end quantity"
        prompt: 'What is the domain of this function?'
        choices:
          - {value: a, label: '\( \ldots\cup\left(\tfrac{\pi}{4},\tfrac{5\pi}{4}\right)\cup\left(\tfrac{5\pi}{4},\tfrac{9\pi}{4}\right)\cup\ldots \)', speak: "and so on, union the open interval from pi over 4 to 5 pi over 4, union the open interval from 5 pi over 4 to 9 pi over 4, union and so on"}
          - {value: b, label: '\( \ldots\cup\left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right)\cup\left(\tfrac{\pi}{2},\tfrac{3\pi}{2}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative pi over 2 to pi over 2, union the open interval from pi over 2 to 3 pi over 2, union and so on"}
          - {value: c, label: '\( \ldots\cup\left(-\tfrac{\pi}{4},\tfrac{3\pi}{4}\right)\cup\left(\tfrac{3\pi}{4},\tfrac{7\pi}{4}\right)\cup\ldots \)', speak: "and so on, union the open interval from negative pi over 4 to 3 pi over 4, union the open interval from 3 pi over 4 to 7 pi over 4, union and so on"}
          - {value: d, label: '\( \ldots\cup(-\pi,0)\cup(0,\pi)\cup\ldots \)', speak: "and so on, union the open interval from negative pi to 0, union the open interval from 0 to pi, union and so on"}
        correct: c
        explanation: |-
          Set \( x+\tfrac{3\pi}{4}=\tfrac{\pi}{2}+k\pi \) and subtract: \( x=-\tfrac{\pi}{4}+k\pi \). So the asymptotes are at \( -\tfrac{\pi}{4} \), \( \tfrac{3\pi}{4} \), \( \tfrac{7\pi}{4} \), and so on. The intervals starting at \( \tfrac{\pi}{4} \) shift the wrong way, to the right. The intervals around \( \tfrac{\pi}{2} \) ignore the shift, and the intervals at \( \pi \) use cotangent's asymptotes. <strong>The domain is the open intervals between \( -\tfrac{\pi}{4} \), \( \tfrac{3\pi}{4} \), \( \tfrac{7\pi}{4} \), and so on.</strong>
  - id: graphs
    label: "Try It: Graphs"
    heading: "Try It: Graphs"
    intro: |-
      Each picture shows dashed vertical lines and a curve. Use where the dashed lines are, which way the curve goes, and the labeled points to decide. Make your best guess, then check it.
    items:
      - id: graph1
        title: "Graph 1"
        figure:
          file: figures/PF2/graph1.svg
          title: "A repeating curve between dashed vertical lines, with four labeled points"
          caption: '<strong>Plotted data:</strong> dashed vertical lines at x = −3π/4, π/4, and 5π/4, spaced π apart. Between each pair of neighboring dashed lines, the curve rises from the bottom of the grid to the top, getting very close to the dashed lines at both ends. It crosses the x-axis at (−π/4, 0) and (3π/4, 0), and passes through (−π/2, −1) and (0, 1). The same rising shape continues past the dashed lines at both edges.'
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( f(x)=\tan\left(x-\tfrac{\pi}{4}\right) \)', speak: "f of x equals tangent of the quantity x minus pi over 4, end quantity"}
          - {value: b, label: '\( f(x)=\cot\left(x-\tfrac{\pi}{4}\right) \)', speak: "f of x equals cotangent of the quantity x minus pi over 4, end quantity"}
          - {value: c, label: '\( f(x)=\cot\left(x+\tfrac{\pi}{4}\right) \)', speak: "f of x equals cotangent of the quantity x plus pi over 4, end quantity"}
          - {value: d, label: '\( f(x)=\tan\left(x+\tfrac{\pi}{4}\right) \)', speak: "f of x equals tangent of the quantity x plus pi over 4, end quantity"}
        correct: d
        explanation: |-
          The curve rises between the dashed lines, which is how tangent looks; cotangent falls. For \( \tan\left(x+\tfrac{\pi}{4}\right) \) the asymptotes are where \( x+\tfrac{\pi}{4}=\tfrac{\pi}{2}+k\pi \), which is \( x=\tfrac{\pi}{4}+k\pi \), matching the dashed lines. Check a point: \( \tan\left(0+\tfrac{\pi}{4}\right)=1 \), which matches \( (0, 1) \). The version with \( x-\tfrac{\pi}{4} \) would put the dashed lines at \( \tfrac{3\pi}{4} \) and \( -\tfrac{\pi}{4} \). <strong>The graph is \( f(x)=\tan\left(x+\tfrac{\pi}{4}\right) \).</strong>
      - id: graph2
        title: "Graph 2"
        figure:
          file: figures/PF2/graph2.svg
          title: "U-shaped pieces between dashed vertical lines, with four labeled points"
          caption: '<strong>Plotted data:</strong> dashed vertical lines at x = −π, −π/2, 0, π/2, and π, spaced π/2 apart. Between each pair of neighboring dashed lines is one U-shaped piece. Each upward U climbs toward the dashed lines at both ends, and each downward U drops toward them. From left to right the pieces alternate: a U opening upward with lowest point (−3π/4, 1), a U opening downward with highest point (−π/4, −1), a U opening upward with lowest point (π/4, 1), and a U opening downward with highest point (3π/4, −1). No part of the curve lies strictly between y = −1 and y = 1.'
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( f(x)=\sec(2x) \)', speak: "f of x equals secant of 2 x"}
          - {value: b, label: '\( f(x)=\csc(2x) \)', speak: "f of x equals cosecant of 2 x"}
          - {value: c, label: '\( f(x)=\csc(-2x) \)', speak: "f of x equals cosecant of negative 2 x"}
          - {value: d, label: '\( f(x)=\csc\left(\tfrac{1}{2}x\right) \)', speak: "f of x equals cosecant of the quantity one half x, end quantity"}
        correct: b
        explanation: |-
          The dashed lines are at \( x=0 \) and every \( \tfrac{\pi}{2} \), so the asymptotes are \( x=\tfrac{k\pi}{2} \). Cosecant has an asymptote at 0, and \( 2x=k\pi \) gives exactly these. Secant of \( 2x \) would put them at \( \tfrac{\pi}{4} \), \( \tfrac{3\pi}{4} \), and so on. Now check the direction: \( \csc\left(2\cdot\tfrac{\pi}{4}\right)=\csc\left(\tfrac{\pi}{2}\right)=1 \), which matches \( \left(\tfrac{\pi}{4}, 1\right) \). With \( -2x \) inside, the graph flips and that point would be at \(-1\). Cosecant of one half \( x \) would have dashed lines \( 2\pi \) apart. <strong>The graph is \( f(x)=\csc(2x) \).</strong>
      - id: graph3
        title: "Graph 3"
        figure:
          file: figures/PF2/graph3.svg
          title: "U-shaped pieces between dashed vertical lines, with two labeled points"
          caption: '<strong>Plotted data:</strong> dashed vertical lines at x = −3π/4, π/4, and 5π/4, spaced π apart. Between −3π/4 and π/4 is a U opening upward with lowest point (−π/4, 1). Between π/4 and 5π/4 is a U opening downward with highest point (3π/4, −1). At the left edge, left of −3π/4, part of a downward U reaches −1 at x = −5π/4. At the right edge, right of 5π/4, part of an upward U reaches 1 at x = 7π/4. No part of the curve lies strictly between y = −1 and y = 1.'
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( f(x)=\sec\left(x-\tfrac{\pi}{4}\right) \)', speak: "f of x equals secant of the quantity x minus pi over 4, end quantity"}
          - {value: b, label: '\( f(x)=\csc\left(x+\tfrac{\pi}{4}\right) \)', speak: "f of x equals cosecant of the quantity x plus pi over 4, end quantity"}
          - {value: c, label: '\( f(x)=\sec\left(x+\tfrac{\pi}{4}\right) \)', speak: "f of x equals secant of the quantity x plus pi over 4, end quantity"}
          - {value: d, label: '\( f(x)=\csc\left(x-\tfrac{\pi}{4}\right) \)', speak: "f of x equals cosecant of the quantity x minus pi over 4, end quantity"}
        correct: c
        explanation: |-
          Two answers have dashed lines in the right places. For \( \sec\left(x+\tfrac{\pi}{4}\right) \), \( x+\tfrac{\pi}{4}=\tfrac{\pi}{2}+k\pi \) gives \( x=\tfrac{\pi}{4}+k\pi \). For \( \csc\left(x-\tfrac{\pi}{4}\right) \), \( x-\tfrac{\pi}{4}=k\pi \) gives the same lines. A point decides it: \( \sec\left(-\tfrac{\pi}{4}+\tfrac{\pi}{4}\right)=\sec 0=1 \), which matches \( \left(-\tfrac{\pi}{4}, 1\right) \), but \( \csc\left(-\tfrac{\pi}{2}\right)=-1 \). Secant of \( x-\tfrac{\pi}{4} \) and cosecant of \( x+\tfrac{\pi}{4} \) put the dashed lines elsewhere. <strong>The graph is \( f(x)=\sec\left(x+\tfrac{\pi}{4}\right) \).</strong>
      - id: graph4
        title: "Graph 4"
        figure:
          file: figures/PF2/graph4.svg
          title: "A repeating curve between dashed vertical lines, with three labeled points"
          caption: '<strong>Plotted data:</strong> dashed vertical lines at x = −π and x = π, spaced 2π apart. Between them the curve falls from the top of the grid near x = −π to the bottom near x = π, passing through (−π/2, 1), (0, 0), and (π/2, −1). The same falling shape appears to the left of −π and to the right of π.'
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( f(x)=\tan\left(\tfrac{1}{2}x\right) \)', speak: "f of x equals tangent of the quantity one half x, end quantity"}
          - {value: b, label: '\( f(x)=\tan\left(-\tfrac{1}{2}x\right) \)', speak: "f of x equals tangent of the quantity negative one half x, end quantity"}
          - {value: c, label: '\( f(x)=\tan(-2x) \)', speak: "f of x equals tangent of negative 2 x"}
          - {value: d, label: '\( f(x)=\cot\left(\tfrac{1}{2}x\right) \)', speak: "f of x equals cotangent of the quantity one half x, end quantity"}
        correct: b
        explanation: |-
          The dashed lines are \( 2\pi \) apart at \( \pm\pi \), and the curve crosses the x-axis at 0. For \( \tan\left(\tfrac{x}{2}\right) \), \( \tfrac{x}{2}=\tfrac{\pi}{2}+k\pi \) gives \( x=\pi+2k\pi \), which matches. Cotangent of \( \tfrac{x}{2} \) would have a dashed line at 0 instead, and \( \tan(-2x) \) would have dashed lines only \( \tfrac{\pi}{2} \) apart. But the curve falls, while tangent rises, so the graph is flipped: the number inside is negative. Check: \( \tan\left(-\tfrac{\pi}{4}\right)=-1 \) at \( x=\tfrac{\pi}{2} \). This is the same function as \( -\tan\left(\tfrac{x}{2}\right) \). <strong>The graph is \( f(x)=\tan\left(-\tfrac{1}{2}x\right) \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each statement below was made by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: 'f(x)=\tan(4x)'
          speak: "f of x equals tangent of 4 x"
        prompt: 'A student says the period of this function is \( 4\pi \). What is the mistake, if any?'
        choices:
          - {value: a, label: 'Every tangent has period \( 2\pi \).', speak: "Every tangent has period 2 pi."}
          - {value: b, label: "The 4 only changes the height, so the period is still π."}
          - {value: c, label: 'Divide by 4, do not multiply: \( \tfrac{\pi}{4} \).', speak: "Divide by 4, do not multiply: pi over 4."}
          - {value: d, label: "There is no mistake."}
        correct: c
        explanation: |-
          A number multiplying \( x \) squeezes the graph, so the period gets shorter. Tangent's period is \( \pi \), so divide: \( \tfrac{\pi}{4} \). A number in front of the function would change the height, but this 4 is inside. <strong>The period is \( \tfrac{\pi}{4} \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: 'g(x)=\sec(2x)'
          speak: "g of x equals secant of 2 x"
        prompt: 'A student says the range of this function is \( [-1,1] \). What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The range should be all real numbers, since the graph goes up and down forever."}
          - {value: c, label: 'Because of the 2, the range should be \( [-2,2] \).', speak: "Because of the 2, the range should be the closed interval from negative 2 to 2."}
          - {value: d, label: "That is cosine's range. Secant skips everything between negative 1 and 1."}
        correct: d
        explanation: |-
          Secant is 1 divided by cosine. Cosine stays between \(-1\) and \(1\), so its reciprocal is always at least 1 or at most \(-1\). The 2 inside changes only the asymptotes and the period. <strong>The range is \( (-\infty,-1]\cup[1,\infty) \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: 'h(x)=\cot\left(x-\dfrac{\pi}{4}\right)'
          speak: "h of x equals cotangent of the quantity x minus pi over 4, end quantity"
        prompt: 'A student says the asymptotes are at \( -\tfrac{\pi}{4} \) plus any multiple of \( \pi \). What is the mistake, if any?'
        choices:
          - {value: a, label: 'Subtracting inside shifts right, so the asymptotes are at \( x=\tfrac{\pi}{4}+k\pi \).', speak: "Subtracting inside shifts right, so the asymptotes are at x equals pi over 4, plus k pi."}
          - {value: b, label: "There is no mistake."}
          - {value: c, label: 'The spacing between asymptotes should be \( 2\pi \).', speak: "The spacing between asymptotes should be 2 pi."}
          - {value: d, label: 'A shift removes the asymptote at 0, so the asymptotes are at \( x=\tfrac{\pi}{2}+k\pi \).', speak: "A shift removes the asymptote at 0, so the asymptotes are at x equals pi over 2, plus k pi."}
        correct: a
        explanation: |-
          Cotangent breaks where its input is \( k\pi \). Set \( x-\tfrac{\pi}{4}=k\pi \) and add: \( x=\tfrac{\pi}{4}+k\pi \). The student moved the asymptotes the wrong way. Cotangent's period is \( \pi \), so the spacing stays \( \pi \). <strong>The asymptotes are at \( x=\tfrac{\pi}{4}+k\pi \).</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: 'f(x)=\sec(3x)'
          speak: "f of x equals secant of 3 x"
        prompt: 'A student says the asymptotes are at \( \tfrac{\pi}{6} \) plus any multiple of \( \tfrac{\pi}{3} \), so the period is \( \tfrac{\pi}{3} \). What is the mistake, if any?'
        choices:
          - {value: a, label: 'Secant matches cosecant, so the asymptotes are at \( x=\tfrac{k\pi}{3} \).', speak: "Secant matches cosecant, so the asymptotes are at x equals k pi over 3."}
          - {value: b, label: 'One period holds two branches, so the period is \( \tfrac{2\pi}{3} \).', speak: "One period holds two branches, so the period is 2 pi over 3."}
          - {value: c, label: 'The 3 stretches the graph, so the period is \( 3\pi \).', speak: "The 3 stretches the graph, so the period is 3 pi."}
          - {value: d, label: "There is no mistake."}
        correct: b
        explanation: |-
          The asymptotes are right: \( 3x=\tfrac{\pi}{2}+k\pi \) gives \( x=\tfrac{\pi}{6}+\tfrac{k\pi}{3} \). But secant's period is \( 2\pi \), not \( \pi \): one upward branch and one downward branch make one full period. Divide by 3: \( \tfrac{2\pi}{3} \). That is two asymptote gaps, not one. <strong>The period is \( \tfrac{2\pi}{3} \).</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: 'f(x)=\tan\left(\tfrac{1}{2}x\right)'
          speak: "f of x equals tangent of the quantity one half x, end quantity"
        prompt: 'A student says the asymptotes are at \( \pi \) plus any multiple of \( 2\pi \), and the domain is every real number except those. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: 'The asymptotes should be at \( x=\tfrac{\pi}{4}+\tfrac{k\pi}{2} \).', speak: "The asymptotes should be at x equals pi over 4, plus k pi over 2."}
          - {value: c, label: 'The asymptotes should be at \( x=2k\pi \).', speak: "The asymptotes should be at x equals 2 k pi."}
          - {value: d, label: "The domain should be all real numbers."}
        correct: a
        explanation: |-
          Set \( \tfrac{x}{2}=\tfrac{\pi}{2}+k\pi \) and multiply by 2: \( x=\pi+2k\pi \). The domain leaves out exactly those values. In CheckIt's form that is the open intervals between \( -\pi \), \( \pi \), \( 3\pi \), and so on. <strong>There is no mistake.</strong>
