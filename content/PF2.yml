# PF2 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt PF2 gives two functions: one of tan/cot and one of sec/csc, each with either a horizontal stretch f(ax)
# (a = ±2, ±3, ±4, ±1/2, ±1/3, ±1/4) or a shift f(x + b) (b = ±π/4, ±π/2, ±3π/4, ±3π/2). Students sketch two full periods
# and give the domain (a union of open intervals between asymptotes, with "..." at each end) and the range.
# Figures are drawn by tools/figures/make_pf2.py.
code: PF2
h1: "PF2 Support: Graphing Tangent, Cotangent, Secant, and Cosecant"
pageTitle: "PF2 Support: Graphing Tangent, Cotangent, Secant, and Cosecant — Math 172, Santa Ana College"
