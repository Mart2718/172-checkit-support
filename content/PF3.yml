        correct: d
        explanation: |-
          The student's fact is right: \( \sin\left(\tfrac{2\pi}{3}\right)=\tfrac{\sqrt{3}}{2} \), not one half. But \( \tfrac{2\pi}{3} \) is outside arcsine's range. Arcsine picks the one angle on the right half of the circle with that sine. The sine of \( \tfrac{4\pi}{3} \) is negative. <strong>The correct value is \( \tfrac{\pi}{3} \).</strong>
