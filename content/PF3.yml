# CheckIt PF3: evaluate arcsin(sin t), arccos(cos t) and arctan(tan t) for three different special angles t (inputs include 0, +/-1,
# +/-1/2, +/-sqrt(2)/2, +/-sqrt(3)/2, and for tangent +/-sqrt(3)/3 and +/-sqrt(3)), then give the domain and range of one inverse function and draw its graph.
