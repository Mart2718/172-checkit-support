          On a trig function, the \(-1\) is not an exponent: it names the inverse function, arcsine, which takes a value and gives back an angle. One over sine is cosecant, a different function. For example, arcsine of 1 is \( \tfrac{\pi}{2} \), but one over sine of 1 is about 1.19. One over cosine is secant, and the negative of sine, \( -\sin(x) \), is a reflection of the sine graph; neither is what the \(-1\) means. <strong>The notation means arcsine, not one over sine.</strong>
