banPhrases: 'arc ?(sin|cos|tan)|inverse|\bsine\b|cosine|tangent'
worked:   # used for the worked-examples recording document
  title: "PF3 Worked Examples: Inverse Trigonometric Functions"
  coreQuestion: "Which angle has this sine, cosine, or tangent, and is that angle inside the function's range?"
  coreFollowup: "Find an angle on the unit circle with the right value. Then check the range: arcsine and arctangent give angles from negative pi over 2 to pi over 2, the right half of the circle. Arccosine gives angles from 0 to pi, the top half. If your angle is outside, find the one inside that has the same value."
summary:   # the Quick Summary tab
  intro: 'Every PF3 question comes back to one idea: <strong>an inverse trig function answers “which angle?”, but only from its own range.</strong> Find a unit-circle angle with the right value, then make sure it lies in that range.'
  caption: "What each function accepts, what it gives back, and where its answers land"
  columns: ["Function", "Inputs (domain)", "Outputs (range)", "Where the answer lands"]
  rows:     # first cell of each row is the row header
    -
      - '<span>\( \arcsin(x) \)</span>, also written <span>\( \sin^{-1}(x) \)</span>'
      - '<span>\( [-1,1] \)</span>'
      - '<span>\( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \)</span>'
      - 'Right half of the unit circle, quadrants I and IV. A negative input gives a negative angle.'
    -
      - '<span>\( \arccos(x) \)</span>, also written <span>\( \cos^{-1}(x) \)</span>'
      - '<span>\( [-1,1] \)</span>'
      - '<span>\( [0,\pi] \)</span>'
      - 'Top half of the unit circle, quadrants I and II. Never negative: a negative input gives an angle between <span>\( \tfrac{\pi}{2} \)</span> and <span>\( \pi \)</span>.'
    -
      - '<span>\( \arctan(x) \)</span>, also written <span>\( \tan^{-1}(x) \)</span>'
      - 'All real numbers, <span>\( (-\infty,\infty) \)</span>'
      - '<span>\( \left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right) \)</span>, ends not included'
      - 'Right half, like arcsine, but never exactly <span>\( \pm\tfrac{\pi}{2} \)</span>, where tangent is undefined.'
  note: 'The values to know are <span>\( 0 \)</span>, <span>\( \pm 1 \)</span>, and the unit-circle values <span>\( \tfrac{1}{2} \)</span>, <span>\( \tfrac{\sqrt{2}}{2} \)</span>, <span>\( \tfrac{\sqrt{3}}{2} \)</span>, and, for tangent, <span>\( \tfrac{\sqrt{3}}{3} \)</span>, <span>\( 1 \)</span>, and <span>\( \sqrt{3} \)</span>. Any of them can be negative. If you see <span>\( \tfrac{1}{2}\sqrt{3} \)</span> or <span>\( \tfrac{1}{\sqrt{3}} \)</span>, those are the same numbers as <span>\( \tfrac{\sqrt{3}}{2} \)</span> and <span>\( \tfrac{\sqrt{3}}{3} \)</span>. The raised −1 in <span>\( \sin^{-1} \)</span> means “inverse,” not “one over.” Answers are exact angles in radians, such as <span>\( -\tfrac{\pi}{6} \)</span>. CheckIt asks for the domain and range together, and for a sketch of the graph. To sketch a graph, plot three points and connect them. Arcsine: <span>\( \left(-1,-\tfrac{\pi}{2}\right) \)</span>, <span>\( (0,0) \)</span>, <span>\( \left(1,\tfrac{\pi}{2}\right) \)</span>. Arccosine: <span>\( (-1,\pi) \)</span>, <span>\( \left(0,\tfrac{\pi}{2}\right) \)</span>, <span>\( (1,0) \)</span>. Arctangent: <span>\( \left(-1,-\tfrac{\pi}{4}\right) \)</span>, <span>\( (0,0) \)</span>, <span>\( \left(1,\tfrac{\pi}{4}\right) \)</span>, leveling off toward dashed lines at <span>\( y=\pm\tfrac{\pi}{2} \)</span>. Your CheckIt values will differ from these examples. The reasoning is what transfers.'
tabs:
  - id: evaluate
    label: "Try It: Evaluate"
    heading: "Try It: Evaluate"
    intro: |-
      Find the exact angle in radians. Make your best guess on each one, then check it.
    items:
      - id: ev1
        title: "Evaluate 1"
        math:
          display: '\arccos(-1)'
          speak: "arccosine of negative 1"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( -\pi \)', speak: "negative pi"}
          - {value: b, label: '\( 0 \)', speak: "0"}
          - {value: c, label: '\( \tfrac{\pi}{2} \)', speak: "pi over 2"}
          - {value: d, label: '\( \pi \)', speak: "pi"}
        correct: d
        explanation: |-
          Cosine is the \( x \)-coordinate on the unit circle. It is \( -1 \) at the far left point, angle \( \pi \). Arccosine gives angles from 0 to \( \pi \), and \( \pi \) is the end of that range, so it counts. \( -\pi \) points to the same spot, but arccosine is never negative; 0 is the far right point, where the \( x \)-coordinate is 1, not \( -1 \); and \( \tfrac{\pi}{2} \) is the top of the circle, where the \( x \)-coordinate is not \( -1 \) either. <strong>The value is \( \pi \).</strong>
      - id: ev2
        title: "Evaluate 2"
        math:
          display: '\arccos\left(-\dfrac{\sqrt{2}}{2}\right)'
          speak: "arccosine of negative the fraction the square root of 2, over 2, end fraction"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( -\tfrac{\pi}{4} \)', speak: "negative pi over 4"}
          - {value: b, label: '\( \tfrac{3\pi}{4} \)', speak: "3 pi over 4"}
          - {value: c, label: '\( \tfrac{5\pi}{4} \)', speak: "5 pi over 4"}
          - {value: d, label: '\( \tfrac{\pi}{4} \)', speak: "pi over 4"}
        correct: b
        explanation: |-
          The input is \( -\tfrac{\sqrt{2}}{2} \). Arccosine gives angles from 0 to \( \pi \), the top half of the circle. Cosine is negative on the left side, so the angle is in quadrant II: \( \tfrac{3\pi}{4} \). The angle \( \tfrac{5\pi}{4} \) also has that cosine but is on the bottom half. Arccosine is never negative, which rules out \( -\tfrac{\pi}{4} \), and cosine at \( \tfrac{\pi}{4} \) is positive. <strong>The value is \( \tfrac{3\pi}{4} \).</strong>
      - id: ev3
        title: "Evaluate 3"
        math:
          display: '\arctan\left(-\sqrt{3}\right)'
          speak: "arctangent of negative the square root of 3"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( \tfrac{2\pi}{3} \)', speak: "2 pi over 3"}
          - {value: b, label: '\( -\tfrac{\pi}{6} \)', speak: "negative pi over 6"}
          - {value: c, label: '\( \tfrac{5\pi}{3} \)', speak: "5 pi over 3"}
          - {value: d, label: '\( -\tfrac{\pi}{3} \)', speak: "negative pi over 3"}
        correct: d
        explanation: |-
          Tangent is \( \sqrt{3} \) at \( \tfrac{\pi}{3} \). Arctangent gives angles between \( -\tfrac{\pi}{2} \) and \( \tfrac{\pi}{2} \), and a negative input gives a negative angle, so the answer is \( -\tfrac{\pi}{3} \). The angles \( \tfrac{2\pi}{3} \) and \( \tfrac{5\pi}{3} \) have the same tangent but are outside the range. Tangent at \( -\tfrac{\pi}{6} \) is \( -\tfrac{\sqrt{3}}{3} \). <strong>The value is \( -\tfrac{\pi}{3} \).</strong>
      - id: ev4
        title: "Evaluate 4"
        math:
          display: '\arcsin\left(-\tfrac{1}{2}\right)'
          speak: "arcsine of negative one half"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( -\tfrac{\pi}{6} \)', speak: "negative pi over 6"}
          - {value: b, label: '\( \tfrac{7\pi}{6} \)', speak: "7 pi over 6"}
          - {value: c, label: '\( \tfrac{11\pi}{6} \)', speak: "11 pi over 6"}
          - {value: d, label: '\( -\tfrac{\pi}{3} \)', speak: "negative pi over 3"}
        correct: a
        explanation: |-
          Sine is \( \tfrac{1}{2} \) at \( \tfrac{\pi}{6} \). A negative input to arcsine gives a negative angle, in quadrant IV: \( -\tfrac{\pi}{6} \). The angle \( \tfrac{11\pi}{6} \) points the same way, but arcsine's range only goes down to \( -\tfrac{\pi}{2} \), so the answer is written as \( -\tfrac{\pi}{6} \). Sine at \( -\tfrac{\pi}{3} \) is \( -\tfrac{\sqrt{3}}{2} \). The angle \( \tfrac{7\pi}{6} \) also has sine \( -\tfrac{1}{2} \), but it is on the left half of the circle. <strong>The value is \( -\tfrac{\pi}{6} \).</strong>
  - id: more
    label: "Try It: More Values"
    heading: "Try It: More Values"
    intro: |-
      More exact values, with zero, negatives, and arctangent. Make your best guess, then check it. Ask yourself: which half of the unit circle can the answer be on?
    items:
      - id: mv1
        title: "Value 1"
        math:
          display: '\arccos\left(-\tfrac{1}{2}\right)'
          speak: "arccosine of negative one half"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( -\tfrac{\pi}{3} \)', speak: "negative pi over 3"}
          - {value: b, label: '\( \tfrac{4\pi}{3} \)', speak: "4 pi over 3"}
          - {value: c, label: '\( \tfrac{2\pi}{3} \)', speak: "2 pi over 3"}
          - {value: d, label: '\( \tfrac{\pi}{3} \)', speak: "pi over 3"}
        correct: c
        explanation: |-
          Cosine is \( \tfrac{1}{2} \) at \( \tfrac{\pi}{3} \). A negative cosine means the left side of the circle, and arccosine stays on the top half, so the angle is in quadrant II: \( \pi-\tfrac{\pi}{3}=\tfrac{2\pi}{3} \). The answer \( -\tfrac{\pi}{3} \) is below the \( x \)-axis, but arccosine never leaves the top half. The angle \( \tfrac{4\pi}{3} \) is on the bottom half, and cosine at \( \tfrac{\pi}{3} \) is positive. <strong>The value is \( \tfrac{2\pi}{3} \).</strong>
      - id: mv2
        title: "Value 2"
        math:
          display: '\arctan\left(\dfrac{\sqrt{3}}{3}\right)'
          speak: "arctangent of the fraction the square root of 3, over 3, end fraction"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( \tfrac{\pi}{3} \)', speak: "pi over 3"}
          - {value: b, label: '\( \tfrac{\pi}{6} \)', speak: "pi over 6"}
          - {value: c, label: '\( \tfrac{7\pi}{6} \)', speak: "7 pi over 6"}
          - {value: d, label: '\( \tfrac{\pi}{4} \)', speak: "pi over 4"}
        correct: b
        explanation: |-
          The input is \( \tfrac{\sqrt{3}}{3} \), which is the same as \( \tfrac{1}{\sqrt{3}} \). At \( \tfrac{\pi}{6} \), sine is \( \tfrac{1}{2} \) and cosine is \( \tfrac{\sqrt{3}}{2} \), so tangent is \( \tfrac{1}{\sqrt{3}} \). At \( \tfrac{\pi}{3} \) tangent is \( \sqrt{3} \) instead, and at \( \tfrac{\pi}{4} \) it is 1. The angle \( \tfrac{7\pi}{6} \) has the same tangent but is outside the range. <strong>The value is \( \tfrac{\pi}{6} \).</strong>
      - id: mv3
        title: "Value 3"
        math:
          display: '\arccos(0)'
          speak: "arccosine of 0"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( 0 \)', speak: "0"}
          - {value: b, label: '\( \tfrac{3\pi}{2} \)', speak: "3 pi over 2"}
          - {value: c, label: '\( -\tfrac{\pi}{2} \)', speak: "negative pi over 2"}
          - {value: d, label: '\( \tfrac{\pi}{2} \)', speak: "pi over 2"}
        correct: d
        explanation: |-
          Cosine is the x-coordinate on the unit circle, and it is 0 at the top and bottom of the circle. Arccosine only uses the top half, from 0 to \( \pi \), so the answer is the top: \( \tfrac{\pi}{2} \). The answer 0 is arcsine of 0, not arccosine. The angles \( \tfrac{3\pi}{2} \) and \( -\tfrac{\pi}{2} \) point to the bottom, outside the range. <strong>The value is \( \tfrac{\pi}{2} \).</strong>
      - id: mv4
        title: "Value 4"
        math:
          display: '\arctan(-1)'
          speak: "arctangent of negative 1"
        prompt: 'What is the exact value?'
        choices:
          - {value: a, label: '\( \tfrac{3\pi}{4} \)', speak: "3 pi over 4"}
          - {value: b, label: '\( -\tfrac{5\pi}{4} \)', speak: "negative 5 pi over 4"}
          - {value: c, label: '\( -\tfrac{\pi}{4} \)', speak: "negative pi over 4"}
          - {value: d, label: '\( \tfrac{\pi}{4} \)', speak: "pi over 4"}
        correct: c
        explanation: |-
          Tangent is 1 at \( \tfrac{\pi}{4} \), where sine and cosine are equal. A negative input to arctangent gives a negative angle, between \( -\tfrac{\pi}{2} \) and 0: \( -\tfrac{\pi}{4} \). The angles \( \tfrac{3\pi}{4} \) and \( -\tfrac{5\pi}{4} \) also have tangent \( -1 \), but they are outside arctangent's range; and \( \tfrac{\pi}{4} \) drops the sign. <strong>The value is \( -\tfrac{\pi}{4} \).</strong>
  - id: domain
    label: "Try It: Domain & Range"
    heading: "Try It: Domain and Range"
    intro: |-
      The domain is which inputs are allowed. The range is which angles can come out. Make your best guess, then check it.
    items:
      - id: dr1
        title: "Range 1"
        math:
          display: 'f(x)=\arcsin(x)'
          speak: "f of x equals arcsine of x"
        prompt: 'What is the range of this function?'
        choices:
          - {value: a, label: '\( \left[0,\tfrac{\pi}{2}\right] \)', speak: "the closed interval from 0 to pi over 2"}
          - {value: b, label: '\( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \)', speak: "the closed interval from negative pi over 2 to pi over 2"}
          - {value: c, label: '\( \left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right) \)', speak: "the open interval from negative pi over 2 to pi over 2"}
          - {value: d, label: '\( [-\pi,\pi] \)', speak: "the closed interval from negative pi to pi"}
        correct: b
        explanation: |-
          Arcsine gives angles on the right half of the unit circle, from \( -\tfrac{\pi}{2} \) to \( \tfrac{\pi}{2} \), and it reaches both ends: \( \arcsin(1)=\tfrac{\pi}{2} \) and \( \arcsin(-1)=-\tfrac{\pi}{2} \). So the brackets are square, not round. \( \left[0,\tfrac{\pi}{2}\right] \) forgets that negative inputs give negative angles, and \( [-\pi,\pi] \) is a whole turn, but arcsine gives just one angle for each input. <strong>The range is \( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \).</strong>
      - id: dr2
        title: "Domain 1"
        math:
          display: 'g(x)=\arccos(x)'
          speak: "g of x equals arccosine of x"
        prompt: 'What is the domain of this function?'
        choices:
          - {value: a, label: '\( [-1,1] \)', speak: "the closed interval from negative 1 to 1"}
          - {value: b, label: '\( [0,1] \)', speak: "the closed interval from 0 to 1"}
          - {value: c, label: '\( (-\infty,\infty) \)', speak: "the open interval from negative infinity to infinity"}
          - {value: d, label: '\( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \)', speak: "the closed interval from negative pi over 2 to pi over 2"}
        correct: a
        explanation: |-
          The input to arccosine is a cosine value, and cosine is always between \(-1\) and \(1\), negative on the left half of the circle. So exactly those inputs make sense: \( \arccos(2) \) has no answer. \( [0,1] \) leaves out the negative cosines; \( (-\infty,\infty) \) would need cosine to take every value; and \( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \) is a set of angles, but the input here is a cosine value, a number. <strong>The domain is \( [-1,1] \).</strong>
      - id: dr3
        title: "Range 2"
        math:
          display: 'h(x)=\arctan(x)'
          speak: "h of x equals arctangent of x"
        prompt: 'What is the range of this function?'
        choices:
          - {value: a, label: '\( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \)', speak: "the closed interval from negative pi over 2 to pi over 2"}
          - {value: b, label: '\( (-\infty,\infty) \)', speak: "the open interval from negative infinity to infinity"}
          - {value: c, label: '\( \left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right) \)', speak: "the open interval from negative pi over 2 to pi over 2"}
          - {value: d, label: '\( (0,\pi) \)', speak: "the open interval from 0 to pi"}
        correct: c
        explanation: |-
          Arctangent gives angles on the right half of the circle. But tangent is undefined at \( \pm\tfrac{\pi}{2} \), so arctangent never reaches those angles; its graph only gets closer and closer to them. The ends are left out, so the brackets are round, not square. \( (-\infty,\infty) \) is what goes in, the domain, not what comes out; and \( (0,\pi) \) is the top half of the circle, but a negative input to arctangent gives a negative angle. <strong>The range is \( \left(-\tfrac{\pi}{2},\tfrac{\pi}{2}\right) \).</strong>
      - id: dr4
        title: "Range 3"
        math:
          display: 'g(x)=\arccos(x)'
          speak: "g of x equals arccosine of x"
        prompt: 'What is the range of this function?'
        choices:
          - {value: a, label: '\( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \)', speak: "the closed interval from negative pi over 2 to pi over 2"}
          - {value: b, label: '\( [0,\pi] \)', speak: "the closed interval from 0 to pi"}
          - {value: c, label: '\( [0,2\pi) \)', speak: "the interval from 0, included, to 2 pi, not included"}
          - {value: d, label: '\( (0,\pi) \)', speak: "the open interval from 0 to pi"}
        correct: b
        explanation: |-
          Arccosine gives angles on the top half of the circle, from 0 to \( \pi \), and it reaches both ends: \( \arccos(1)=0 \) and \( \arccos(-1)=\pi \). So the brackets are square. \( \left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right] \) is the right half, which would give negative angles, and arccosine is never negative; \( [0,2\pi) \) is the whole circle, but each input gets just one angle; and \( (0,\pi) \) leaves out the ends, which are reached. <strong>The range is \( [0,\pi] \).</strong>
  - id: graphs
    label: "Try It: Graphs"
    heading: "Try It: Graphs"
    intro: |-
      Each picture shows one of the inverse functions. Use where the curve starts and stops, which way it goes, and the labeled points. Make your best guess, then check it.
    items:
      - id: graph1
        title: "Graph 1"
        figure:
          file: figures/PF3/graph1.svg
          title: "A rising curve between two solid end dots, with three labeled points"
          caption: '<strong>Plotted data:</strong> a curve that exists only from x = −1 to x = 1, with solid dots at both ends: (−1, −π/2) and (1, π/2). It passes through (0, 0) and rises from left to right. It is steepest near its two ends and flattest in the middle. Nothing is drawn to the left of x = −1 or to the right of x = 1.'
          collapse: true
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( y=\arccos(x) \)', speak: "y equals arccosine of x"}
          - {value: b, label: '\( y=\arctan(x) \)', speak: "y equals arctangent of x"}
          - {value: c, label: '\( y=\sin(x) \)', speak: "y equals sine of x"}
          - {value: d, label: '\( y=\arcsin(x) \)', speak: "y equals arcsine of x"}
        correct: d
        explanation: |-
          The curve only exists for inputs from \(-1\) to \(1\), so it is arcsine or arccosine. It rises and passes through \( (0, 0) \), and \( \arcsin(0)=0 \). The outputs run from \( -\tfrac{\pi}{2} \) to \( \tfrac{\pi}{2} \), the range of arcsine. Arccosine is never negative, but this curve goes below the \( x \)-axis; arctangent would accept every input; and sine would repeat forever left and right. <strong>The graph is \( y=\arcsin(x) \).</strong>
      - id: graph2
        title: "Graph 2"
        figure:
          file: figures/PF3/graph2.svg
          title: "A falling curve between two solid end dots, with three labeled points"
          caption: '<strong>Plotted data:</strong> a curve that exists only from x = −1 to x = 1, with solid dots at both ends: (−1, π) and (1, 0). It passes through (0, π/2) and falls from left to right. It is steepest near its two ends. Nothing is drawn to the left of x = −1 or to the right of x = 1.'
          collapse: true
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( y=\arccos(x) \)', speak: "y equals arccosine of x"}
          - {value: b, label: '\( y=\arcsin(x) \)', speak: "y equals arcsine of x"}
          - {value: c, label: '\( y=\arctan(x) \)', speak: "y equals arctangent of x"}
          - {value: d, label: '\( y=\arcsin(x)+\tfrac{\pi}{2} \)', speak: "y equals arcsine of x, plus pi over 2"}
        correct: a
        explanation: |-
          The inputs run from \(-1\) to \(1\), and every output is between 0 and \( \pi \), never negative. That is the range of arccosine. Check the points: \( \arccos(1)=0 \), \( \arccos(0)=\tfrac{\pi}{2} \), and \( \arccos(-1)=\pi \). Arcsine and arctangent both give negative outputs for negative inputs, and arctangent accepts every input. \( \arcsin(x)+\tfrac{\pi}{2} \) also has outputs from 0 to \( \pi \), but it rises from left to right, and this curve falls. <strong>The graph is \( y=\arccos(x) \).</strong>
      - id: graph3
        title: "Graph 3"
        figure:
          file: figures/PF3/graph3.svg
          title: "A rising curve between two dashed horizontal lines, with three labeled points"
          caption: '<strong>Plotted data:</strong> dashed horizontal lines at y = −π/2 and y = π/2. A curve runs across the whole grid, from x = −4 to x = 4, rising from left to right. It passes through (−1, −π/4), (0, 0), and (1, π/4). Toward the left it levels off, approaching the lower dashed line, and toward the right it approaches the upper one, without touching either.'
          collapse: true
        prompt: 'Which function has this graph?'
        choices:
          - {value: a, label: '\( y=\arcsin(x) \)', speak: "y equals arcsine of x"}
          - {value: b, label: '\( y=\sin(x) \)', speak: "y equals sine of x"}
          - {value: c, label: '\( y=\arctan(x) \)', speak: "y equals arctangent of x"}
          - {value: d, label: '\( y=\arccos(x) \)', speak: "y equals arccosine of x"}
        correct: c
        explanation: |-
          The curve accepts every input, so it cannot be arcsine or arccosine, which stop at \(-1\) and \(1\). It levels off toward \( y=\pm\tfrac{\pi}{2} \) without reaching them, which is the range of arctangent. Check: \( \arctan(1)=\tfrac{\pi}{4} \). Sine would wave up and down between \(-1\) and \(1\) forever. <strong>The graph is \( y=\arctan(x) \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each line below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\arcsin\left(\tfrac{\sqrt{3}}{2}\right)=\tfrac{2\pi}{3}'
          speak: "arcsine of the fraction the square root of 3, over 2, end fraction, equals 2 pi over 3"
        prompt: 'A student wrote this because \( \sin\left(\tfrac{2\pi}{3}\right)=\tfrac{\sqrt{3}}{2} \). What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The sine of that angle is really one half, so the angle is wrong."}
          - {value: c, label: 'The other angle with this sine works instead: \( \tfrac{4\pi}{3} \).', speak: "The other angle with this sine works instead: 4 pi over 3."}
