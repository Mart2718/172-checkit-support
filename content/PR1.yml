# PR1 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt PR1 gives one quadratic q(x), in standard form ax^2 + bx + c or vertex form a(x - h)^2 + k (half the time each), with
# a from -5 to 5 (not 0). It asks which way the parabola opens, the vertex and whether it is a maximum or a minimum, the axis
# of symmetry, and for a sketch. A third of the parabolas have two whole-number x-intercepts (from -5 to 5, not 0), a third
# touch the x-axis at a whole number (the vertex is on the axis), and a third have no x-intercepts. About 45% of vertices have
# a fraction for h, and 40% a fraction for k. In vertex form Sage clears a fraction inside the square, so 4(x - 1/2)^2 + 1
# prints as (2x - 1)^2 + 1 and 2(x - 7/2)^2 - 9/2 as 1/2(2x - 7)^2 - 9/2. CheckIt's answer graph marks the vertex and the x-intercepts.
# Figures drawn by tools/figures/make_pr1.py.
code: PR1
h1: "PR1 Support: Graphing Quadratic Functions"
pageTitle: "PR1 Support: Graphing Quadratic Functions — Math 172, Santa Ana College"
hubSummary: "Graphing quadratic functions: which way the parabola opens, the vertex as a maximum or minimum, the axis of symmetry, and a sketch"
videoIntro: "A narrated walkthrough of graphing quadratic functions: telling which way a parabola opens, finding the vertex from standard or vertex form, deciding whether it is a maximum or a minimum, naming the axis of symmetry, and sketching the graph."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'no mistake|the answer|vertex is|maximum|minimum'
worked:   # used for the worked-examples recording document
  title: "PR1 Worked Examples: Graphing Quadratic Functions"
  coreQuestion: "Where is the vertex, and which way does the parabola open from there?"
  coreFollowup: "The sign of a tells the direction: up if a is positive, down if it is negative. The vertex is the turning point: in vertex form a(x − h)² + k it is (h, k); in standard form, h = −b/(2a) and k = q(h). Opening up makes the vertex a minimum; opening down makes it a maximum. The axis of symmetry is the vertical line x = h, and the sketch is the vertex, the x-intercepts if there are any, and a mirror-image pair of points."
summary:   # the Quick Summary tab
  intro: 'Every question about a parabola starts from <strong>two facts: the sign of <span>\( a \)</span> and the vertex</strong>. The direction, the maximum or minimum, the axis and the sketch all follow from them.'
  caption: "Summary: Graphing Quadratic Functions"
  columns: ["Question", "How to answer it", "What to watch for"]
  rows:     # first cell of each row is the row header
    -
      - 'Up or down'
      - 'Look at the sign of <span>\( a \)</span>, the number in front of <span>\( x^{2} \)</span> or of the squared quantity.'
      - 'A minus sign in front of the parentheses counts: <span>\( -(x+1)^{2}+4 \)</span> opens down, even though the square is never negative.'
    -
      - 'Vertex from standard form'
      - 'For <span>\( ax^{2}+bx+c \)</span>, <span>\( h=-\dfrac{b}{2a} \)</span>, then <span>\( k=q(h) \)</span>.'
      - 'Keep the minus in <span>\( -b \)</span>, and keep fractions exact: <span>\( 2x^{2}+5x+5 \)</span> has <span>\( h=-\tfrac{5}{4} \)</span>. Square a negative <span>\( h \)</span> before multiplying by <span>\( a \)</span>.'
    -
      - 'Vertex from vertex form'
      - 'For <span>\( a(x-h)^{2}+k \)</span>, the vertex is <span>\( (h,k) \)</span>.'
      - 'The sign inside is the opposite of <span>\( h \)</span>: <span>\( (x+4)^{2} \)</span> means <span>\( h=-4 \)</span>. The <span>\( k \)</span> keeps its sign. CheckIt clears a fraction inside the square: in <span>\( \tfrac{1}{2}(2x-5)^{2}+3 \)</span>, set <span>\( 2x-5=0 \)</span>, so <span>\( h=\tfrac{5}{2} \)</span>.'
    -
      - 'Maximum or minimum'
      - 'Opens up: the vertex is a minimum. Opens down: the vertex is a maximum.'
      - 'The maximum or minimum value is <span>\( k \)</span>, the height of the vertex.'
    -
      - 'Axis of symmetry'
      - 'The vertical line <span>\( x=h \)</span>, halfway between the <span>\( x \)</span>-intercepts when there are two.'
      - 'It is a line, so write <span>\( x=h \)</span>, not <span>\( y=k \)</span> or just a number.'
    -
      - 'Sketch'
      - 'Plot the vertex, the <span>\( x \)</span>-intercepts if any, and the <span>\( y \)</span>-intercept <span>\( (0,c) \)</span> with its mirror point across the axis.'
      - 'Vertex on the <span>\( x \)</span>-axis: one <span>\( x \)</span>-intercept. Opening up from above the axis, or down from below it: none.'
  note: 'CheckIt uses both forms equally, and almost half of its vertices have a fraction in them, such as <span>\( \left(-\tfrac{3}{4},\tfrac{15}{8}\right) \)</span> for <span>\( 2x^{2}+3x+3 \)</span>. Fractions are normal; keep them exact. Your CheckIt function will be different. The sign of <span>\( a \)</span> and the vertex are what transfer.'
tabs:
  - id: vertex
    label: "Try It: The Vertex"
    heading: "Try It: The Vertex"
    intro: |-
      Find the vertex, and decide whether it is the highest or the lowest point. Make your best guess on each one, then check it.
    items:
      - id: a1
        title: "Standard Form 1"
        math:
          display: 'q(x)=3x^{2}+5x+4'
          speak: "q of x equals 3 x squared plus 5 x plus 4"
        prompt: 'What is the vertex, and is it a maximum or a minimum?'
        choices:
          - {value: a, label: "(−5/6, 23/12), a minimum"}
          - {value: b, label: "(5/6, 41/4), a maximum"}
          - {value: c, label: "(−5/3, 4), a minimum"}
          - {value: d, label: "(−5/6, 23/12), a maximum"}
        correct: a
        explanation: |-
          \( h=-\dfrac{b}{2a}=-\dfrac{5}{2(3)}=-\tfrac{5}{6} \). Then \( k=3\left(-\tfrac{5}{6}\right)^{2}+5\left(-\tfrac{5}{6}\right)+4=\tfrac{25}{12}-\tfrac{50}{12}+\tfrac{48}{12}=\tfrac{23}{12} \). Since \( a=3 \) is positive, the parabola opens up, so the vertex is the lowest point: a minimum. Denominators like 6 and 12 are normal on CheckIt. \( \left(\tfrac{5}{6},\tfrac{41}{4}\right) \) as a maximum makes two slips: it drops the minus in \( -\tfrac{b}{2a} \), giving \( q\left(\tfrac{5}{6}\right)=\tfrac{41}{4} \), and misses the sign of \( a \); \( \left(-\tfrac{5}{3},4\right) \) divides by \( a \) instead of \( 2a \); and \( \left(-\tfrac{5}{6},\tfrac{23}{12}\right) \) as a maximum has the right point but misses that \( a \) is positive. <strong>\( \left(-\tfrac{5}{6},\tfrac{23}{12}\right) \), a minimum.</strong>
      - id: a2
        title: "Standard Form 2"
        math:
          display: 'q(x)=2x^{2}-14x+20'
          speak: "q of x equals 2 x squared minus 14 x plus 20"
        prompt: 'What is the vertex of this parabola?'
        choices:
          - {value: a, label: '\( \left(-\tfrac{7}{2},\tfrac{187}{2}\right) \)', speak: "the point negative the fraction 7, over 2, end fraction, comma the fraction 187, over 2, end fraction"}
          - {value: b, label: '\( (7,20) \)', speak: "the point 7 comma 20"}
          - {value: c, label: '\( \left(\tfrac{7}{2},-\tfrac{9}{2}\right) \)', speak: "the point the fraction 7, over 2, end fraction, comma negative the fraction 9, over 2, end fraction"}
          - {value: d, label: '\( \left(\tfrac{7}{2},20\right) \)', speak: "the point the fraction 7, over 2, end fraction, comma 20"}
        correct: c
        explanation: |-
          \( h=-\dfrac{-14}{2(2)}=\tfrac{14}{4}=\tfrac{7}{2} \). Then \( k=2\left(\tfrac{7}{2}\right)^{2}-14\left(\tfrac{7}{2}\right)+20=2\cdot\tfrac{49}{4}-49+20=\tfrac{49}{2}-29=-\tfrac{9}{2} \). The vertex has fractions, which is normal on CheckIt. \( -\tfrac{7}{2} \) drops the minus in \( -\tfrac{b}{2a} \), and then \( q\left(-\tfrac{7}{2}\right)=\tfrac{187}{2} \); \( (7,20) \) divides by \( a \) instead of \( 2a \), and \( q(7)=20 \); and \( \left(\tfrac{7}{2},20\right) \) squares the 2 along with \( \tfrac{7}{2} \), as \( \left(2\cdot\tfrac{7}{2}\right)^{2}=49 \), so the first two terms cancel. <strong>\( \left(\tfrac{7}{2},-\tfrac{9}{2}\right) \).</strong>
      - id: a3
        title: "Standard Form 3"
        math:
          display: 'q(x)=2x^{2}-12x+18'
          speak: "q of x equals 2 x squared minus 12 x plus 18"
        prompt: 'What is the vertex of this parabola?'
        choices:
          - {value: a, label: '\( (-3,72) \)', speak: "the point negative 3 comma 72"}
          - {value: b, label: '\( (3,0) \)', speak: "the point 3 comma 0"}
          - {value: c, label: '\( (3,18) \)', speak: "the point 3 comma 18"}
          - {value: d, label: '\( (0,18) \)', speak: "the point 0 comma 18"}
        correct: b
        explanation: |-
          \( h=-\dfrac{-12}{2(2)}=3 \), and \( k=q(3)=18-36+18=0 \). The vertex \( (3,0) \) is on the \( x \)-axis, so the parabola touches the axis at one point: \( q(x)=2(x-3)^{2} \). This happens in about a third of CheckIt's problems. \( (-3,72) \) drops the minus in \( -\tfrac{b}{2a} \); \( (3,18) \) squares the 2 along with the 3, as \( (2\cdot3)^{2}=36 \), so the first two terms cancel; and \( (0,18) \) is the \( y \)-intercept, not the vertex. <strong>\( (3,0) \).</strong>
      - id: a4
        title: "Vertex Form"
        math:
          display: 'q(x)=(2x-1)^{2}+1'
          speak: "q of x equals the quantity 2 x minus 1, end quantity, squared, plus 1"
        prompt: 'CheckIt printed this vertex form. What is the vertex, and is it a maximum or a minimum?'
        choices:
          - {value: a, label: "(1/2, 1), a minimum"}
          - {value: b, label: "(1, 1), a minimum"}
          - {value: c, label: "(1/2, 1), a maximum"}
          - {value: d, label: "(−1/2, 1), a maximum"}
        correct: a
        explanation: |-
          CheckIt clears a fraction inside the square: \( (2x-1)^{2}=4\left(x-\tfrac{1}{2}\right)^{2} \), so this is \( 4\left(x-\tfrac{1}{2}\right)^{2}+1 \). The vertex is where the square is 0: \( 2x-1=0 \), so \( h=\tfrac{1}{2} \), and \( k=1 \). With \( a=4 \), positive, the parabola opens up, so \( \left(\tfrac{1}{2},1\right) \) is the lowest point: a minimum. \( (1,1) \) takes the 1 in \( 2x-1 \) as \( h \), but \( x=1 \) makes \( 2x-1=1 \), not 0; \( \left(\tfrac{1}{2},1\right) \) as a maximum misses that \( a \) is positive; and \( \left(-\tfrac{1}{2},1\right) \) as a maximum makes two slips, the sign of \( h \) and the direction. <strong>\( \left(\tfrac{1}{2},1\right) \), a minimum.</strong>
  - id: axis
    label: "Try It: Axis and Shape"
    heading: "Try It: Axis and Shape"
    intro: |-
      The axis of symmetry runs through the vertex. Which way the parabola opens and where the vertex sits tell you how many times it crosses the x-axis. Make your best guess, then check it.
    items:
      - id: b1
        title: "Axis from Vertex Form"
        math:
          display: 'q(x)=-3(x+2)^{2}+3'
          speak: "q of x equals negative 3 times the quantity x plus 2, end quantity, squared, plus 3"
        prompt: 'What is the axis of symmetry?'
        choices:
          - {value: a, label: '\( x=3 \)', speak: "x equals 3"}
          - {value: b, label: '\( x=-2 \)', speak: "x equals negative 2"}
          - {value: c, label: '\( y=-2 \)', speak: "y equals negative 2"}
          - {value: d, label: '\( y=3 \)', speak: "y equals 3"}
        correct: b
        explanation: |-
          \( x+2=x-(-2) \), so \( h=-2 \) and the vertex is \( (-2,3) \). The axis of symmetry is the vertical line through the vertex: \( x=-2 \). \( x=3 \) uses \( k \), the vertex's height, as if it were \( h \); \( y=-2 \) has the right number but makes a horizontal line; and \( y=3 \) is the horizontal line at the vertex's height, but a parabola like this is symmetric left to right, about a vertical line. <strong>\( x=-2 \).</strong>
      - id: b2
        title: "How Many Crossings"
        math:
          display: 'q(x)=x^{2}-4x+7'
          speak: "q of x equals x squared minus 4 x plus 7"
        prompt: 'How many x-intercepts does the graph of q have?'
        choices:
          - {value: a, label: "None"}
          - {value: b, label: "One"}
          - {value: c, label: "Two"}
        correct: a
        explanation: |-
          Find the vertex: \( h=-\dfrac{-4}{2(1)}=2 \), and \( k=4-8+7=3 \). The vertex \( (2,3) \) is above the \( x \)-axis, and \( a=1 \) is positive, so the parabola opens up from there and never comes down to the axis. A third of CheckIt's parabolas are like this, so the sketch has no \( x \)-intercepts; plot the vertex and the \( y \)-intercept \( (0,7) \) with its mirror point \( (4,7) \). One crossing would need the vertex on the axis, and two crossings would need it to open toward the axis from the other side. <strong>None.</strong>
      - id: b3
        title: "Axis from the Intercepts"
        figure:
          file: figures/PR1/b3.svg
          title: "A parabola with its two x-intercepts marked"
          caption: 'A parabola on a grid with x from −6 to 3 and y from −8 to 8. It opens upward, and its two x-intercepts are marked with dots at (−4, 0) and (1, 0). Its lowest point is below the x-axis, between the two intercepts.'
        prompt: 'What is the axis of symmetry of this parabola?'
        choices:
          - {value: a, label: '\( x=-\tfrac{5}{2} \)', speak: "x equals negative the fraction 5, over 2, end fraction"}
          - {value: b, label: '\( x=\tfrac{3}{2} \)', speak: "x equals the fraction 3, over 2, end fraction"}
          - {value: c, label: '\( x=-\tfrac{3}{2} \)', speak: "x equals negative the fraction 3, over 2, end fraction"}
          - {value: d, label: '\( y=-\tfrac{25}{4} \)', speak: "y equals negative the fraction 25, over 4, end fraction"}
        correct: c
        explanation: |-
          The axis is halfway between the \( x \)-intercepts: \( \dfrac{-4+1}{2}=-\tfrac{3}{2} \). So the axis is \( x=-\tfrac{3}{2} \), and the vertex is \( \left(-\tfrac{3}{2},-\tfrac{25}{4}\right) \) for this parabola, \( q(x)=(x+4)(x-1) \). \( -\tfrac{5}{2} \) averages \( -4 \) and \( -1 \), dropping the sign of 1; \( \tfrac{3}{2} \) drops the sign of the average; and \( y=-\tfrac{25}{4} \) is the horizontal line at the vertex's height, not the axis. <strong>\( x=-\tfrac{3}{2} \).</strong>
      - id: b4
        title: "Which Way"
        math:
          display: 'q(x)=-5(x+3)^{2}'
          speak: "q of x equals negative 5 times the quantity x plus 3, end quantity, squared"
        prompt: 'Which way does this parabola open, and what is its vertex?'
        choices:
          - {value: a, label: "Up, since (x + 3)² is never negative; vertex (−3, 0) is the lowest point"}
          - {value: b, label: "Down; vertex (−3, 0) is the highest point"}
          - {value: c, label: "Down; vertex (3, 0) is the highest point"}
          - {value: d, label: "Up; vertex (3, 0) is the lowest point"}
        correct: b
        explanation: |-
          There is no \( +k \), so \( k=0 \), and \( x+3=x-(-3) \) gives \( h=-3 \): the vertex is \( (-3,0) \), on the \( x \)-axis. With \( a=-5 \), the parabola opens down, so \( (-3,0) \) is its highest point, and its only \( x \)-intercept. The square is never negative, but multiplying by \( -5 \) makes the whole function never positive; \( (3,0) \) reads the sign inside as written; and opening up with \( (3,0) \) makes both slips. <strong>Down, with vertex \( (-3,0) \) as the highest point.</strong>
  - id: graph
    label: "Try It: Graphs and Sketches"
    heading: "Try It: Graphs and Sketches"
    intro: |-
      Like CheckIt's answer graphs, these mark the vertex (here with a square) and the x-intercepts (with dots). Match the graph to its function, or plan a sketch. Make your best guess, then check it.
    items:
      - id: c1
        title: "Graph 1"
        figure:
          file: figures/PR1/c1.svg
          title: "A parabola with its vertex marked"
          caption: 'A parabola on a grid with x from −2 to 4 and y from −2 to 20. It opens upward. A square marks the vertex at (1, 1), and the parabola never reaches the x-axis. It also passes through (0, 3), (2, 3), (−1, 9) and (3, 9).'
          collapse: true
        prompt: 'Which function does this graph show?'
        choices:
          - {value: a, label: '\( q(x)=2(x+1)^{2}+1 \)', speak: "q of x equals 2 times the quantity x plus 1, end quantity, squared, plus 1"}
          - {value: b, label: '\( q(x)=(x-1)^{2}+1 \)', speak: "q of x equals the quantity x minus 1, end quantity, squared, plus 1"}
          - {value: c, label: '\( q(x)=(x+1)^{2}+1 \)', speak: "q of x equals the quantity x plus 1, end quantity, squared, plus 1"}
          - {value: d, label: '\( q(x)=2(x-1)^{2}+1 \)', speak: "q of x equals 2 times the quantity x minus 1, end quantity, squared, plus 1"}
        correct: d
        explanation: |-
          The vertex is \( (1,1) \), so \( q(x)=a(x-1)^{2}+1 \). One step across from the vertex, at \( x=2 \), the height is 3, which is 2 above the vertex: \( a(1)^{2}+1=3 \), so \( a=2 \). Check: \( 2(3-1)^{2}+1=9 \). With no \( x \)-intercepts, a third of CheckIt's sketches look like this one. \( 2(x+1)^{2}+1 \) puts the vertex at \( (-1,1) \), the sign as written; \( (x-1)^{2}+1 \) leaves out \( a \), so it would pass through \( (2,2) \), not \( (2,3) \); and \( (x+1)^{2}+1 \) makes both slips. <strong>\( q(x)=2(x-1)^{2}+1 \).</strong>
      - id: c2
        title: "Graph 2"
        figure:
          file: figures/PR1/c2.svg
          title: "A parabola with its vertex and x-intercepts marked"
          caption: 'A parabola on a grid with x from −5 to 3 and y from −9 to 11. It opens upward. A square marks the vertex at (−1, −8), and the x-intercepts are marked with dots at (−3, 0) and (1, 0). It also passes through (0, −6) and (−2, −6).'
          collapse: true
        prompt: 'Which function does this graph show?'
        choices:
          - {value: a, label: '\( q(x)=2(x+1)^{2}-8 \)', speak: "q of x equals 2 times the quantity x plus 1, end quantity, squared, minus 8"}
          - {value: b, label: '\( q(x)=2(x+3)^{2}-8 \)', speak: "q of x equals 2 times the quantity x plus 3, end quantity, squared, minus 8"}
          - {value: c, label: '\( q(x)=(x+1)^{2}-4 \)', speak: "q of x equals the quantity x plus 1, end quantity, squared, minus 4"}
          - {value: d, label: '\( q(x)=2(x-1)^{2}-8 \)', speak: "q of x equals 2 times the quantity x minus 1, end quantity, squared, minus 8"}
        correct: a
        explanation: |-
          The vertex is \( (-1,-8) \), so \( q(x)=a(x+1)^{2}-8 \). To find \( a \), use an intercept: \( a(1+1)^{2}-8=0 \), so \( 4a=8 \) and \( a=2 \). From the vertex, one step across goes up 2, not 1: \( (0,-6) \). \( 2(x+3)^{2}-8 \) uses the left intercept, \( -3 \), as \( h \), which moves the vertex to \( (-3,-8) \); \( (x+1)^{2}-4 \) has the right intercepts but puts the vertex at \( (-1,-4) \); and \( 2(x-1)^{2}-8 \) puts the vertex at \( (1,-8) \), the sign as written. <strong>\( q(x)=2(x+1)^{2}-8 \).</strong>
      - id: c3
        title: "Graph 3"
        figure:
          file: figures/PR1/c3.svg
          title: "A parabola with its vertex marked"
          caption: 'A parabola on a grid with x from −1 to 8 and y from −10 to 2. It opens downward. Its vertex, marked with a square at (4, 0), is its only point on the x-axis. It also passes through (3, −1), (5, −1), (2, −4) and (6, −4).'
          collapse: true
        prompt: 'Which function, in standard form, does this graph show?'
        choices:
          - {value: a, label: '\( q(x)=-x^{2}-8x-16 \)', speak: "q of x equals negative x squared minus 8 x minus 16"}
          - {value: b, label: '\( q(x)=x^{2}-8x+16 \)', speak: "q of x equals x squared minus 8 x plus 16"}
          - {value: c, label: '\( q(x)=-x^{2}+8x-16 \)', speak: "q of x equals negative x squared plus 8 x minus 16"}
          - {value: d, label: '\( q(x)=-x^{2}+16 \)', speak: "q of x equals negative x squared plus 16"}
        correct: c
        explanation: |-
          The vertex \( (4,0) \) is on the axis, and from it one step across goes down 1, so \( q(x)=-(x-4)^{2} \). Expand: \( -(x^{2}-8x+16)=-x^{2}+8x-16 \). Check: \( h=-\dfrac{8}{2(-1)}=4 \). \( -x^{2}-8x-16=-(x+4)^{2} \) puts the vertex at \( (-4,0) \); \( x^{2}-8x+16=(x-4)^{2} \) opens up; and \( -x^{2}+16 \) squares only the \( x \), as if \( (x-4)^{2}=x^{2}-16 \), which gives a parabola with vertex \( (0,16) \) crossing at \( \pm 4 \). <strong>\( q(x)=-x^{2}+8x-16 \).</strong>
      - id: c4
        title: "Plan the Sketch"
        math:
          display: 'q(x)=-2x^{2}+4x+6'
          speak: "q of x equals negative 2 x squared plus 4 x plus 6"
        prompt: 'Which points should a sketch of this parabola show?'
        choices:
          - {value: a, label: "Vertex (1, 8); x-intercepts −1 and 3"}
          - {value: b, label: "Vertex (1, 8); x-intercepts 1 and −3"}
          - {value: c, label: "Vertex (−1, 0); x-intercepts −1 and 3"}
          - {value: d, label: "Vertex (−1, 0); x-intercepts 1 and −3"}
        correct: a
        explanation: |-
          Vertex: \( h=-\dfrac{4}{2(-2)}=1 \), and \( k=-2+4+6=8 \). Intercepts: \( -2x^{2}+4x+6=-2(x^{2}-2x-3)=-2(x-3)(x+1) \), which is 0 at \( x=3 \) and \( x=-1 \). The axis \( x=1 \) is halfway between them, which checks. Opening down from \( (1,8) \), the parabola crosses the axis twice. Intercepts 1 and \( -3 \) take the numbers from the factors with their signs, but \( x-3=0 \) means \( x=3 \); vertex \( (-1,0) \) drops the minus in \( -\tfrac{b}{2a} \), and \( q(-1)=0 \) only because \( -1 \) is an intercept; and vertex \( (-1,0) \) with intercepts 1 and \( -3 \) makes both slips. <strong>Vertex \( (1,8) \); \( x \)-intercepts \( -1 \) and 3.</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\begin{aligned} &q(x)=3x^{2}+12x-15\\ &h=\tfrac{12}{2(3)}=2\\ &k=q(2)=21\\ &\text{vertex }(2,21) \end{aligned}'
          speak: "q of x equals 3 x squared plus 12 x minus 15. Next line: h equals the fraction 12, over 2 times 3, end fraction, which equals 2. Next line: k equals q of 2, which equals 21. Next line: vertex, the point 2 comma 21."
        prompt: 'A student found the vertex this way. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "With the minus, h = −2: the vertex is (−2, −27)."}
          - {value: c, label: "Divide by a, not 2a: h = −4, so the vertex is (−4, −15)."}
          - {value: d, label: "The vertex is the y-intercept, (0, −15)."}
        correct: b
        explanation: |-
