# PR2 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt PR2 tells one of three stories and asks when (or how many) and how high (or how low), in either order.
# (1) Average age of adults x years after 1900: a(x) = ax^2 + bx + c with a from 0.0020 to 0.0050, b from -0.50 to -0.20,
# c from 40.00 to 49.99; the year of the minimum is rounded to a whole year (answer 1900 + x), and the minimum age, rounded to
# a tenth, is a(x) at that rounded x. (2) A projectile: h(t) = -16t^2 + bt + c, launched from c feet (0 in about a fifth of
# problems); the time of the maximum is a whole or half second and the maximum height a whole number of feet. (3) Unit cost:
# C(x) = ax^2 + bx + c with a from 0.1 to 0.9, b from -199 to -100, c from 10,000 to 29,999; the number of units is rounded to
# a whole number, and the minimum cost, to the cent, is C at that rounded number (so it often differs by a few cents from the
# value at the exact vertex).
# Figures drawn by tools/figures/make_pr2.py.
code: PR2
h1: "PR2 Support: Quadratic Models"
pageTitle: "PR2 Support: Quadratic Models — Math 172, Santa Ana College"
hubSummary: "Quadratic models in context: when a quantity reaches its maximum or minimum, how high or low it gets, and what those numbers mean"
videoIntro: "A narrated walkthrough of quadratic models: deciding whether a model has a maximum or a minimum, finding when it happens and how big it is, and reading the answer back in the story, with projectiles, costs and ages."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'no mistake|the answer|maximum|minimum|highest|lowest'
worked:   # used for the worked-examples recording document
  title: "PR2 Worked Examples: Quadratic Models"
  coreQuestion: "Is the vertex a maximum or a minimum, and does the question ask for its input or its output?"
  coreFollowup: "The vertex answers both questions. Its input, x = −b/(2a), says when or how many. Its output, found by putting that input into the model, says how high or how low. Then read the answer back in the story: add the start year to x, round units to whole numbers, and give the units."
summary:   # the Quick Summary tab
  intro: 'In every PR2 story, the answer is the <strong>vertex</strong> of a parabola. One question asks for its input, the other for its output.'
  caption: "Summary: Quadratic Models"
  columns: ["The question asks", "How to answer it", "What to watch for"]
  rows:     # first cell of each row is the row header
    -
      - 'Maximum or minimum?'
      - 'Look at the sign of <span>\( a \)</span>: positive opens up, so the vertex is a minimum; negative opens down, so it is a maximum.'
      - 'A projectile, with <span>\( a=-16 \)</span>, has a greatest height. A unit cost or an average age with a positive <span>\( a \)</span> has a least value.'
    -
      - 'When, or how many?'
      - 'The input of the vertex: <span>\( x=-\dfrac{b}{2a} \)</span>.'
      - 'Keep the 2 in <span>\( 2a \)</span>, and watch the decimals: <span>\( 2(0.7)=1.4 \)</span>. A negative <span>\( b \)</span> makes <span>\( -b \)</span> positive.'
    -
      - 'A year'
      - 'If <span>\( x \)</span> is years after 1900, the year is <span>\( 1900+x \)</span>: <span>\( x=63 \)</span> is the year 1963.'
      - 'Round <span>\( x \)</span> to the nearest whole number first, then add.'
    -
      - 'How high, or how low?'
      - 'The output of the vertex: put its input into the model.'
      - 'Square before you multiply: <span>\( -16(4.5)^{2}=-16(20.25)=-324 \)</span>.'
    -
      - 'Whole numbers or not'
      - 'If the input must be a whole number, such as units made, use the whole number nearest the vertex: for a parabola it is always the best one. If the input can be any number, such as time, keep the vertex unrounded while you compute and round only the final answer.'
      - 'On CheckIt, the least cost is found at the rounded number of units, so it can differ by up to about 20 cents from the value at the exact vertex. A vertex at exactly .5, such as 252.5, rounds up to 253.'
    -
      - 'Reading a projectile model'
      - '<span>\( h(0)=c \)</span> is the launch height, and the projectile lands when <span>\( h(t)=0 \)</span>.'
      - 'The top of the path comes before the landing: the vertex time is not when it hits the ground.'
  note: 'CheckIt prints numbers without extra zeros or commas: a least cost of $2,479.20 shows as 2479.2, and a time of 4 seconds as 4.0. Give every answer in the story''s units: seconds and feet, units and dollars, a year and years of age. Round only at the end, as the question says. Your CheckIt story and numbers will be different. Finding the vertex and reading it back in the story is what transfers.'
tabs:
  - id: when
    label: "Try It: When, or How Many"
    heading: "Try It: When, or How Many"
    intro: |-
      Each question asks for the input of the vertex. Make your best guess on each one, then check it.
    items:
      - id: t1
        title: "A Projectile"
        math:
          display: 'h(t)=-16t^{2}+128t+144'
          speak: "h of t equals negative 16 t squared plus 128 t plus 144"
        prompt: 'A projectile is fired into the air from an initial height of 144 feet. Its height after t seconds is h(t) feet. When does it reach its maximum height?'
        choices:
          - {value: a, label: "8 seconds"}
          - {value: b, label: "−8 seconds"}
          - {value: c, label: "4 seconds"}
          - {value: d, label: "9 seconds"}
        correct: c
        explanation: |-
          The time of the maximum is the input of the vertex: \( t=-\dfrac{b}{2a}=-\dfrac{128}{2(-16)}=\dfrac{128}{32}=4 \) seconds. 8 seconds is \( -\tfrac{b}{a} \), which leaves out the 2; at \( t=8 \) the projectile is back down at 144 feet. −8 seconds is \( \tfrac{b}{a}=\tfrac{128}{-16} \), which drops both the minus and the 2; and 9 seconds is when it lands, \( h(9)=0 \), not when it is highest. <strong>4 seconds.</strong>
      - id: t2
        title: "Average Age"
        math:
          display: 'a(x)=0.0035x^{2}-0.42x+45.1'
          speak: "a of x equals 0.0035 x squared minus 0.42 x plus 45.1"
        prompt: 'In a town, the average age of adult residents x years after 1900 was a(x) years. In what year was the average age at a minimum? (Round to the nearest year.)'
        choices:
          - {value: a, label: "1960"}
          - {value: b, label: "60"}
          - {value: c, label: "1780"}
          - {value: d, label: "2020"}
        correct: a
        explanation: |-
          \( a=0.0035 \) is positive, so the parabola opens up and the vertex is a minimum. Its input: \( x=-\dfrac{-0.42}{2(0.0035)}=\dfrac{0.42}{0.007}=60 \). But \( x \) counts years after 1900, so the year is \( 1900+60=1960 \). 60 is the right \( x \) but not a year; 1780 makes two slips, dividing by \( a \) and dropping the minus, so \( x=-120 \); and 2020 divides by \( a \) instead of \( 2a \), giving \( x=120 \). <strong>1960.</strong>
      - id: t3
        title: "Unit Cost"
        math:
          display: 'C(x)=0.4x^{2}-152x+18000'
          speak: "C of x equals 0.4 x squared minus 152 x plus 18000"
        prompt: 'The cost per unit to produce x widgets is C(x) dollars. How many widgets should be produced to minimize the unit cost? (Round to the nearest unit.)'
        choices:
          - {value: a, label: "380 widgets"}
          - {value: b, label: "190 widgets"}
          - {value: c, label: "3,800 widgets"}
          - {value: d, label: "3,560 widgets"}
        correct: b
        explanation: |-
          \( x=-\dfrac{-152}{2(0.4)}=\dfrac{152}{0.8}=190 \). With \( a=0.4 \) positive, that is a minimum. 380 is \( \tfrac{152}{0.4} \), which leaves out the 2; 3,800 is \( \tfrac{152}{0.04} \), which leaves out the 2 and also slips a decimal place; and 3,560 is \( C(190) \), the least cost in dollars, which answers the other question. <strong>190 widgets.</strong>
      - id: t4
        title: "A Half Second"
        math:
          display: 'h(t)=-16t^{2}+80t+384'
          speak: "h of t equals negative 16 t squared plus 80 t plus 384"
        prompt: 'A projectile is fired into the air from an initial height of 384 feet. Its height after t seconds is h(t) feet. When does it reach its maximum height?'
        choices:
          - {value: a, label: "2.5 seconds"}
          - {value: b, label: "5.0 seconds"}
          - {value: c, label: "8.0 seconds"}
          - {value: d, label: "−5.0 seconds"}
        correct: a
        explanation: |-
          \( t=-\dfrac{80}{2(-16)}=\dfrac{80}{32}=2.5 \) seconds. Half seconds are common on CheckIt, and 2.5 is already rounded to a tenth. 5 seconds is \( \tfrac{80}{16} \), which leaves out the 2; 8 seconds is when it lands, \( h(8)=0 \); and −5 seconds is \( \tfrac{80}{-16} \), which drops both the minus and the 2. <strong>2.5 seconds.</strong>
  - id: howhigh
    label: "Try It: How High, or How Low"
    heading: "Try It: How High, or How Low"
    intro: |-
      Each question asks for the output of the vertex. Find the input first, then put it into the model. Make your best guess, then check it.
    items:
      - id: v1
        title: "From the Ground"
        math:
          display: 'h(t)=-16t^{2}+160t'
          speak: "h of t equals negative 16 t squared plus 160 t"
        prompt: 'A projectile is fired into the air from an initial height of 0 feet. Its height after t seconds is h(t) feet. What is the maximum height it reaches?'
        choices:
          - {value: a, label: "800 feet"}
          - {value: b, label: "400 feet"}
          - {value: c, label: "720 feet"}
          - {value: d, label: "0 feet"}
        correct: b
        explanation: |-
          First the time: \( t=-\dfrac{160}{2(-16)}=5 \) seconds. Then the height: \( h(5)=-16(25)+160(5)=-400+800=400 \) feet. 800 feet is only the \( 160t \) term, leaving out \( -16t^{2} \); 720 feet forgets to square the 5, using \( -16(5)=-80 \); and 0 feet is the height at launch, and again when it lands at \( t=10 \). <strong>400 feet.</strong>
      - id: v2
        title: "Least Average Age"
        math:
          display: 'a(x)=0.0042x^{2}-0.34x+41.25'
          speak: "a of x equals 0.0042 x squared minus 0.34 x plus 41.25"
        prompt: 'In a town, the average age of adult residents x years after 1900 was a(x) years. What was the minimum average age? (Round to the nearest tenth of a year.)'
        choices:
          - {value: a, label: "61.9 years"}
          - {value: b, label: "27.7 years"}
          - {value: c, label: "41.3 years"}
          - {value: d, label: "34.4 years"}
        correct: d
        explanation: |-
          \( x=\dfrac{0.34}{2(0.0042)}=\dfrac{0.34}{0.0084}\approx 40.476 \). Time can be any number, so keep \( x \) unrounded: \( a(40.476)\approx 0.0042(1638.3)-0.34(40.476)+41.25\approx 6.881-13.762+41.25=34.369 \), about 34.4 years. (CheckIt evaluates at the rounded year, \( a(40)=34.37 \), which also rounds to 34.4.) 61.9 adds the 13.762 instead of subtracting it; 27.7 forgets to square, using \( 0.0042(40.476)\approx 0.170 \); and 41.3 is \( a(0)=41.25 \), the average age in 1900, not the least one. <strong>34.4 years.</strong>
      - id: v3
        title: "Least Unit Cost"
        math:
          display: 'C(x)=0.3x^{2}-145x+20000'
          speak: "C of x equals 0.3 x squared minus 145 x plus 20000"
        prompt: 'The cost per unit to produce x widgets is C(x) dollars, and the number of widgets that minimizes it is rounded to the nearest unit. What is the minimum unit cost? (Round to the nearest cent.)'
        choices:
          - {value: a, label: "$2,479.20"}
          - {value: b, label: "$2,479.17"}
          - {value: c, label: "$20,000.00"}
          - {value: d, label: "$72,659.20"}
        correct: a
        explanation: |-
          \( x=\dfrac{145}{2(0.3)}=\dfrac{145}{0.6}\approx 241.67 \), so make 242 widgets: you cannot make part of one. Then \( C(242)=0.3(58{,}564)-145(242)+20{,}000=17{,}569.20-35{,}090+20{,}000=2{,}479.20 \). CheckIt does the same: it evaluates the cost at the rounded number of units, and prints the answer as 2479.2. $2,479.17 is the cost at the exact vertex, 241.67 widgets, which is not a whole number of widgets; $20,000.00 is \( C(0) \), the constant term; and $72,659.20 adds the 35,090 instead of subtracting it. <strong>$2,479.20.</strong>
      - id: v4
        title: "Greatest Height"
        math:
          display: 'h(t)=-16t^{2}+48t+288'
          speak: "h of t equals negative 16 t squared plus 48 t plus 288"
        prompt: 'A projectile is fired into the air from an initial height of 288 feet. Its height after t seconds is h(t) feet. What is the maximum height it reaches?'
        choices:
          - {value: a, label: "360 feet"}
          - {value: b, label: "324 feet"}
          - {value: c, label: "336 feet"}
          - {value: d, label: "288 feet"}
        correct: b
        explanation: |-
          \( t=\dfrac{48}{32}=1.5 \) seconds. Then \( h(1.5)=-16(2.25)+48(1.5)+288=-36+72+288=324 \) feet. 360 feet leaves out the \( -16t^{2} \) term; 336 feet forgets to square the 1.5, using \( -16(1.5)=-24 \); and 288 feet is the launch height, \( h(0) \). <strong>324 feet.</strong>
  - id: meaning
    label: "Try It: What It Means"
    heading: "Try It: What It Means"
    intro: |-
      A number is not an answer until you say what it means in the story. Make your best guess, then check it.
    items:
      - id: r1
        title: "Why a Least Cost"
        math:
          display: 'C(x)=0.2x^{2}-101x+15000'
          speak: "C of x equals 0.2 x squared minus 101 x plus 15000"
        prompt: 'The cost per unit to produce x widgets is C(x) dollars. Why does this model have a minimum unit cost, and no maximum?'
        choices:
          - {value: a, label: "a = 0.2 is positive, so the parabola opens up"}
          - {value: b, label: "b = −101 is negative, so the cost goes down"}
          - {value: c, label: "c = 15,000 is the largest the cost can be"}
          - {value: d, label: "Costs cannot be negative, so it has a floor"}
        correct: a
        explanation: |-
          The sign of \( a \), the number in front of \( x^{2} \), decides the shape. \( a=0.2 \) is positive, so the parabola opens up: the cost falls to the vertex and then rises forever, with a least value and no greatest. A negative \( b \) only moves the vertex to the right of 0; the cost does go down at first, but it turns around; \( C(0)=15{,}000 \) is the cost at 0 units, and for large \( x \) the cost goes far past it; and costs that cannot be negative would not explain the turning point. <strong>\( a \) is positive, so the parabola opens up.</strong>
      - id: r2
        title: "Reading the Vertex"
        math:
          display: 'h(t)=-16t^{2}+96t+112'
          speak: "h of t equals negative 16 t squared plus 96 t plus 112"
        prompt: 'A projectile''s height after t seconds is h(t) feet. The vertex of h is (3, 256). What does the vertex tell you?'
        choices:
          - {value: a, label: "After 256 seconds it reaches its greatest height, 3 feet"}
          - {value: b, label: "It hits the ground after 3 seconds, 256 feet away"}
          - {value: c, label: "After 3 seconds it reaches its greatest height, 256 feet"}
          - {value: d, label: "It is launched from 256 feet and lands after 3 seconds"}
        correct: c
        explanation: |-
          The vertex is \( (t,h(t)) \): input first, a time in seconds; output second, a height in feet. With \( a=-16 \), it is the top of the path: 3 seconds after launch, the projectile is 256 feet high. Check: \( h(3)=-144+288+112=256 \). Reading 256 as the time swaps the input and the output; the projectile lands when \( h(t)=0 \), which is at \( t=7 \), and the model gives a height, not a distance away; and the launch height is \( h(0)=112 \), not 256. <strong>After 3 seconds it reaches its greatest height, 256 feet.</strong>
      - id: r3
        title: "Rounding the Year"
        math:
          display: 'a(x)=0.0026x^{2}-0.3x+44'
          speak: "a of x equals 0.0026 x squared minus 0.3 x plus 44"
        prompt: 'In a town, the average age of adult residents x years after 1900 was a(x) years. In what year was the average age at a minimum? (Round to the nearest year.)'
        choices:
          - {value: a, label: "1957"}
          - {value: b, label: "1958"}
          - {value: c, label: "57"}
          - {value: d, label: "1842"}
        correct: b
        explanation: |-
          \( x=\dfrac{0.3}{2(0.0026)}=\dfrac{0.3}{0.0052}\approx 57.69 \). Rounded to the nearest whole year, \( x=58 \), so the year is \( 1900+58=1958 \). 1957 cuts off the decimal instead of rounding, but 57.69 is closer to 58; 57 cuts off the decimal and also forgets to add 1900; and 1842 drops the minus in \( -\tfrac{b}{2a} \), giving \( x=-58 \). <strong>1958.</strong>
      - id: r4
        title: "The Constant Term"
        figure:
          file: figures/PR2/proj.svg
          title: "A graph of the projectile's height over time"
          caption: 'A graph with seconds, t, from 0 to 6 across and height in feet, h(t), from 0 to 160 up. The curve starts at height 80 when t = 0, rises to its top point at t = 2, where the height is 144, and comes back down to 0 at t = 5.'
          collapse: true
        math:
          display: 'h(t)=-16t^{2}+64t+80'
          speak: "h of t equals negative 16 t squared plus 64 t plus 80"
        prompt: 'A projectile''s height after t seconds is h(t) feet. What does h(0) = 80 tell you?'
        choices:
          - {value: a, label: "Its greatest height is 80 feet"}
          - {value: b, label: "It lands after 80 seconds"}
          - {value: c, label: "It starts 80 feet above the ground"}
          - {value: d, label: "It starts upward at 80 feet per second"}
        correct: c
        explanation: |-
          \( h(0) \) is the height at \( t=0 \), the moment of launch, so the projectile starts 80 feet up. CheckIt's stories say this as "an initial height of 80 feet." Its greatest height is at \( t=2 \): \( h(2)=-64+128+80=144 \) feet, higher than the launch; it lands when \( h(t)=0 \), at \( t=5 \); and the upward speed at launch is the 64 in \( 64t \), feet per second, not the 80. <strong>It starts 80 feet above the ground.</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\begin{aligned} a(x)&=0.003x^{2}-0.33x+46\\ x&=\tfrac{0.33}{2(0.003)}=55 \end{aligned}'
          speak: "a of x equals 0.003 x squared minus 0.33 x plus 46. Next line: x equals the fraction 0.33, over 2 times 0.003, end fraction, which equals 55."
        prompt: 'In a town, the average age of adult residents x years after 1900 was a(x) years. A student found the year of the minimum average age and answered "55". What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Add the 1900: the year is 1955."}
          - {value: c, label: "Divide by a, not 2a: the year is 2010."}
          - {value: d, label: "The year is a(55), about 36.9."}
        correct: b
        explanation: |-
          The vertex work is right: \( x=55 \). But the question asks for a year, and \( x \) counts years after 1900, so the year is \( 1900+55=1955 \). The formula needs \( 2a \), and \( \tfrac{0.33}{0.003}=110 \) would give 2010; and \( a(55)\approx 36.9 \) is the least average age, which answers the other question. <strong>1955.</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: '\begin{aligned} h(t)&=-16t^{2}+112t+480\\ t&=\tfrac{112}{16}=7\\ h(7)&=480 \end{aligned}'
          speak: "h of t equals negative 16 t squared plus 112 t plus 480. Next line: t equals the fraction 112, over 16, end fraction, which equals 7. Next line: h of 7 equals 480."
        prompt: 'A student found the maximum height of this projectile and answered 480 feet. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The time is right, but h(7) is 1,264 feet."}
          - {value: c, label: "t = −b/(2a) = 3.5, so the height is 676 feet."}
          - {value: d, label: "The greatest height is the launch height, 480 feet."}
        correct: c
        explanation: |-
          The formula is \( t=-\dfrac{b}{2a}=-\dfrac{112}{2(-16)}=3.5 \) seconds; the student left out the 2. Then \( h(3.5)=-16(12.25)+112(3.5)+480=-196+392+480=676 \) feet. A clue: the student's answer equals the launch height, because \( t=7 \) is the mirror image of \( t=0 \) across the vertex. \( h(7)=-784+784+480=480 \), so 1,264, which is \( 112(7)+480 \), leaves out the \( -16t^{2} \) term; and the projectile rises above its launch height, so 480 is not the greatest. <strong>676 feet, at 3.5 seconds.</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} C(x)&=0.6x^{2}-180x+25000\\ x&=\tfrac{180}{2(0.6)}=150\\ C(150)&=13500-27000+25000=11500 \end{aligned}'
          speak: "C of x equals 0.6 x squared minus 180 x plus 25000. Next line: x equals the fraction 180, over 2 times 0.6, end fraction, which equals 150. Next line: C of 150 equals 13500 minus 27000 plus 25000, which equals 11500."
        prompt: 'The cost per unit to produce x widgets is C(x) dollars. A student found the number of widgets that minimizes the unit cost, and the minimum unit cost. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "a = 0.6 is positive, so 150 gives the greatest cost."}
          - {value: c, label: "2(0.6) is 0.12, so x should be 1,500."}
          - {value: d, label: "The least cost is the constant, $25,000."}
        correct: a
        explanation: |-
          \( x=\dfrac{180}{1.2}=150 \) widgets, a whole number already. \( C(150)=0.6(22{,}500)-180(150)+25{,}000=13{,}500-27{,}000+25{,}000=11{,}500 \). The student is right: produce 150 widgets, for a least unit cost of $11,500.00. A positive \( a \) opens up, so the vertex is the least cost, not the greatest; \( 2(0.6)=1.2 \), and 0.12 is a decimal slip; and $25,000 is \( C(0) \), which is more than \( C(150) \). <strong>There is no mistake.</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: '\begin{aligned} a(x)&=0.0045x^{2}-0.47x+48.2\\ x&\approx 52.22\\ a(52.22)&\approx 0.0045(104.44)-24.54+48.2\approx 24.1 \end{aligned}'
          speak: "a of x equals 0.0045 x squared minus 0.47 x plus 48.2. Next line: x is about 52.22. Next line: a of 52.22 is about 0.0045 times 104.44, minus 24.54, plus 48.2, which is about 24.1."
        prompt: 'In a town, the average age of adult residents x years after 1900 was a(x) years. A student found the minimum average age. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "52.22 is past 52, so use a(53) for the least age."}
          - {value: c, label: "The minimum is at x = 1952, so use a(1952)."}
          - {value: d, label: "Square 52.22 instead of doubling it: 35.9."}
        correct: d
        explanation: |-
          \( 52.22^{2}\approx 2{,}727 \); the student doubled 52.22 instead of squaring it. So \( a(52.22)\approx 0.0045(2{,}727)-24.54+48.2\approx 12.27-24.54+48.2\approx 35.9 \) years. The vertex is the least point, so the input stays at 52.22, not the next whole year, 53; and \( x \) is years after 1900, so the year 1952 is \( x=52 \), not \( x=1952 \). <strong>35.9 years.</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: '\begin{aligned} h(t)&=-16t^{2}+96t\\ \text{vertex}&=(3,144) \end{aligned}'
          speak: "h of t equals negative 16 t squared plus 96 t. Next line: vertex equals the point 3 comma 144."
        prompt: 'A projectile is fired from the ground. A student found the vertex and wrote, "The lowest the projectile gets is 144 feet, at 3 seconds." What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "144 feet is the greatest height, not the least."}
          - {value: c, label: "The vertex should be the point (−3, −432)."}
          - {value: d, label: "The vertex should be (6, 0), the point where it lands."}
        correct: b
        explanation: |-
