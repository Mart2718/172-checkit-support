# PR3 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt PR3 gives one polynomial f(x) = c k (x - r1)^2 (x - r2)^n with k from 2 to 5, c = +/-1, n = 1 or 2, and zeros from
# +/-2 to +/-5, and asks for (1) the zeros (or roots) and their multiplicities, (2) the y-intercept, (3) the end behavior,
# worded "As x approaches infinity, y approaches positive infinity", and (4) a sketch.
# Figures drawn by tools/figures/make_pr3.py.
code: PR3
h1: "PR3 Support: Graphs of Polynomial Functions"
pageTitle: "PR3 Support: Graphs of Polynomial Functions — Math 172, Santa Ana College"
hubSummary: "Graphs of polynomials: zeros and multiplicities, the y-intercept, end behavior, and sketching"
videoIntro: "A narrated walkthrough of graphing a polynomial in factored form: finding the zeros and their multiplicities, deciding whether the graph touches or crosses at each zero, finding the y-intercept, and reading the end behavior from the degree and the leading coefficient."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'touches|crosses|bounces|multiplicity [0-9]|even multiplicity|odd multiplicity|rises on|falls on'
worked:   # used for the worked-examples recording document
  title: "PR3 Worked Examples: Graphs of Polynomial Functions"
  coreQuestion: "What does each factor tell me about the graph?"
  coreFollowup: "Each factor (x − a) gives a zero at x = a, and its exponent is the multiplicity: an even exponent means the graph touches the x-axis and turns around, an odd exponent means it crosses. Plug in x = 0 for the y-intercept. Add the exponents for the degree, and look at the sign of the number in front. Together those tell you how the two ends of the graph behave."
summary:   # the Quick Summary tab
  intro: 'A polynomial in factored form, like <span>\( f(x)=2(x-3)^{2}(x+1) \)</span>, shows its whole graph if you read it piece by piece. <strong>Each factor tells you one thing.</strong>'
  caption: "What each part of a factored polynomial tells you, and what to watch for"
  columns: ["Look at", "It tells you", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - 'Each factor <span>\( (x-a) \)</span>'
      - 'A zero at <span>\( x=a \)</span>: set the factor equal to 0.'
      - '<span>\( (x+5) \)</span> gives the zero <span>\( -5 \)</span>, not 5. The number in front is not a zero.'
    -
      - 'The exponent on a factor'
      - 'The multiplicity of that zero. Even: the graph touches the <span>\( x \)</span>-axis and turns around. Odd: the graph crosses the <span>\( x \)</span>-axis.'
      - 'A factor with no exponent showing has multiplicity 1, so the graph crosses there.'
    -
      - '<span>\( f(0) \)</span>'
      - 'The <span>\( y \)</span>-intercept: replace every <span>\( x \)</span> with 0 and multiply.'
      - 'Square before multiplying: <span>\( (0-6)^{2}=36 \)</span>, not <span>\( -6 \)</span> or <span>\( -36 \)</span>. Write it as a point, <span>\( (0,\ f(0)) \)</span>.'
    -
      - 'Degree and leading coefficient'
      - 'Degree: add the exponents. Leading coefficient: the number in front. Even degree: both ends go the same way, up if it is positive and down if it is negative. Odd degree: the ends go opposite ways; positive goes down on the left and up on the right.'
      - 'CheckIt says it this way: "As <span>\( x \)</span> approaches infinity, <span>\( y \)</span> approaches positive infinity." Approaching infinity means going to the right; approaching negative infinity means going to the left.'
  note: 'To sketch, plot the zeros and the <span>\( y \)</span>-intercept, draw the two ends, then connect them, touching or crossing at each zero. CheckIt calls the zeros "zeroes" or "roots"; they mean the same thing. Your CheckIt polynomial will have different numbers. Reading the factors is what transfers.'
tabs:
  - id: zeros
    label: "Try It: Zeros and Multiplicities"
    heading: "Try It: Zeros and Multiplicities"
    intro: |-
      Read the zeros and their multiplicities straight from the factors, and decide what the graph does at each zero. Make your best guess on each one, then check it.
    items:
      - id: zm1
        title: "Zeros 1"
        math:
          display: 'f(x)=2(x+4)(x-3)^{2}'
          speak: "f of x equals 2 times the quantity x plus 4, times the quantity x minus 3, end quantity, squared"
        prompt: 'What are the zeros and their multiplicities?'
        choices:
          - {value: a, label: "−3 with multiplicity 2, and 4 with multiplicity 1"}
          - {value: b, label: "3 with multiplicity 2, and −4 with multiplicity 1"}
          - {value: c, label: "3 with multiplicity 1, and −4 with multiplicity 2"}
          - {value: d, label: "2, 3, and −4, each with multiplicity 1"}
        correct: b
        explanation: |-
          Set each factor equal to 0: \( x-3=0 \) gives \( x=3 \), and \( x+4=0 \) gives \( x=-4 \). The exponent on each factor is its multiplicity: 2 for \( x=3 \) and 1 for \( x=-4 \), since no exponent means 1. The order of the factors does not matter. Reading the signs as written gives −3 and 4, and the 2 in front is a coefficient, not a zero. <strong>3 with multiplicity 2, and −4 with multiplicity 1.</strong>
      - id: zm2
        title: "Zeros 2"
        math:
          display: 'f(x)=-5(x+2)^{2}(x-5)^{2}'
          speak: "f of x equals negative 5 times the quantity x plus 2, end quantity, squared, times the quantity x minus 5, end quantity, squared"
        prompt: 'What are the zeros and their multiplicities?'
        choices:
          - {value: a, label: "2 and −5, each with multiplicity 2"}
          - {value: b, label: "−2 and 5, each with multiplicity 1"}
          - {value: c, label: "−5, −2, and 5, each with multiplicity 2"}
          - {value: d, label: "−2 and 5, each with multiplicity 2"}
        correct: d
        explanation: |-
          \( x+2=0 \) gives \( x=-2 \), and \( x-5=0 \) gives \( x=5 \). Both factors are squared, so both zeros have multiplicity 2. The −5 in front is the leading coefficient; it changes the height and flips the graph, but it is not a zero. <strong>−2 and 5, each with multiplicity 2.</strong>
      - id: zm3
        title: "Zeros 3"
        math:
          display: 'f(x)=3(x-4)^{2}(x+1)'
          speak: "f of x equals 3 times the quantity x minus 4, end quantity, squared, times the quantity x plus 1"
        prompt: 'What does the graph do at x = 4?'
        choices:
          - {value: a, label: "It goes straight through the x-axis to the other side."}
          - {value: b, label: "It has a vertical asymptote there."}
          - {value: c, label: "It meets the x-axis and turns back the way it came."}
          - {value: d, label: "It stays above the x-axis without reaching it."}
        correct: c
        explanation: |-
          The factor \( (x-4) \) is squared, so \( x=4 \) has even multiplicity. A square is never negative, so \( (x-4)^{2} \) does not change sign as \( x \) passes 4: the graph touches the \( x \)-axis and turns around. At \( x=-1 \), multiplicity 1, it crosses instead. Polynomials never have vertical asymptotes. <strong>It touches the x-axis and turns around.</strong>
      - id: zm4
        title: "Zeros 4"
        math:
          display: 'f(x)=-2(x+5)^{2}(x-2)'
          speak: "f of x equals negative 2 times the quantity x plus 5, end quantity, squared, times the quantity x minus 2"
        prompt: 'Which describes the graph at its zeros?'
        choices:
          - {value: a, label: "At −5 it turns around at the axis; at 2 it goes through."}
          - {value: b, label: "At −5 it goes through the axis; at 2 it turns around."}
          - {value: c, label: "At 5 it turns around at the axis; at −2 it goes through."}
          - {value: d, label: "It goes through the x-axis at both −5 and 2."}
        correct: a
        explanation: |-
          The zeros are \( -5 \), with multiplicity 2 because \( (x+5) \) is squared, and \( 2 \), with multiplicity 1. Even multiplicity: touch and turn around. Odd: cross. Saying it turns at 2 and goes through at −5 swaps them; using 5 and −2 reads the signs as written; going through at both ignores the square. The \( -2 \) in front flips the graph upside down, but it does not change touching into crossing. <strong>Touches at −5, crosses at 2.</strong>
  - id: ends
    label: "Try It: Intercept and Ends"
    heading: "Try It: Intercept and Ends"
    intro: |-
      Find where the graph crosses the y-axis, and where its two ends go. Make your best guess, then check it.
    items:
      - id: ie1
        title: "Intercept 1"
        math:
          display: 'f(x)=2(x+4)(x-3)^{2}'
          speak: "f of x equals 2 times the quantity x plus 4, times the quantity x minus 3, end quantity, squared"
        prompt: 'What is the y-intercept?'
        choices:
          - {value: a, label: "(0, 24)"}
          - {value: b, label: "(0, −72)"}
          - {value: c, label: "(0, 2)"}
          - {value: d, label: "(0, 72)"}
        correct: d
        explanation: |-
          \( f(0)=2(0+4)(0-3)^{2}=2\cdot 4\cdot 9=72 \). Square first: \( (-3)^{2}=9 \), which is positive. The answer 24 forgets the square, \( 2\cdot 4\cdot 3 \); −72 squares \( -3 \) to get \( -9 \); and 2 is just the coefficient. <strong>\( (0,72) \).</strong>
      - id: ie2
        title: "Intercept 2"
        math:
          display: 'f(x)=-3(x+2)^{2}(x-5)^{2}'
          speak: "f of x equals negative 3 times the quantity x plus 2, end quantity, squared, times the quantity x minus 5, end quantity, squared"
        prompt: 'What is the y-intercept?'
        choices:
          - {value: a, label: "(0, −300)"}
          - {value: b, label: "(0, 300)"}
          - {value: c, label: "(0, −30)"}
          - {value: d, label: "(0, −150)"}
        correct: a
        explanation: |-
          \( f(0)=-3(2)^{2}(-5)^{2}=-3\cdot 4\cdot 25=-300 \). Both squares are positive, so the sign comes only from the −3. The answer 300 loses that sign, −30 forgets both squares, and −150 squares only one of them. <strong>\( (0,-300) \).</strong>
      - id: ie3
        title: "Ends 1"
        math:
          display: 'f(x)=4(x-2)^{2}(x+3)'
          speak: "f of x equals 4 times the quantity x minus 2, end quantity, squared, times the quantity x plus 3"
        prompt: 'Which describes the end behavior?'
        choices:
          - {value: a, label: "Both ends go up"}
          - {value: b, label: "Left end down, right end up"}
          - {value: c, label: "Left end up, right end down"}
          - {value: d, label: "Both ends go down"}
        correct: b
        explanation: |-
          The degree is \( 2+1=3 \), which is odd, so the ends go opposite ways. The leading coefficient 4 is positive, so the graph goes up on the right, like \( y=x^{3} \). In CheckIt's words: as \( x \) approaches infinity, \( y \) approaches positive infinity; as \( x \) approaches negative infinity, \( y \) approaches negative infinity. <strong>Down on the left, up on the right.</strong>
      - id: ie4
        title: "Ends 2"
        math:
          display: 'f(x)=-2(x+4)^{2}(x-1)^{2}'
          speak: "f of x equals negative 2 times the quantity x plus 4, end quantity, squared, times the quantity x minus 1, end quantity, squared"
        prompt: 'Which describes the end behavior?'
        choices:
          - {value: a, label: "Both ends go up"}
          - {value: b, label: "Left end down, right end up"}
          - {value: c, label: "Both ends go down"}
          - {value: d, label: "Left end up, right end down"}
        correct: c
        explanation: |-
          The degree is \( 2+2=4 \), which is even, so both ends go the same way. The leading coefficient −2 is negative, so both go down, like \( y=-x^{4} \). In CheckIt's words: as \( x \) approaches infinity and as \( x \) approaches negative infinity, \( y \) approaches negative infinity. <strong>Down on both the left and the right.</strong>
  - id: match
    label: "Try It: Match the Graph"
    heading: "Try It: Match the Graph"
    intro: |-
      Each graph shows its zeros and its y-intercept. Use them, and what the graph does at each zero and at its ends, to find its formula. The last item runs the other way: from a formula to the shape you would sketch. Make your best guess, then check it.
    items:
      - id: mg1
        title: "Match 1"
        figure:
          file: figures/PR3/mg1.svg
          title: "A polynomial graph with two zeros and a y-intercept"
          caption: 'A graph on axes with x from about −4.5 to 3.5 and y from −60 to 60. Coming from the lower left, it rises to meet the x-axis at (−3, 0), turns back down without going above the axis, reaches a low point just right of the y-axis, passing through the y-intercept (0, −36), then rises through the x-axis at (2, 0) and keeps rising to the upper right. The two zeros and the y-intercept are labeled.'
        prompt: 'Which formula matches this graph?'
        choices:
          - {value: a, label: '\( f(x)=2(x+3)^{2}(x-2) \)', speak: "f of x equals 2 times the quantity x plus 3, end quantity, squared, times the quantity x minus 2"}
          - {value: b, label: '\( f(x)=2(x+3)(x-2)^{2} \)', speak: "f of x equals 2 times the quantity x plus 3, times the quantity x minus 2, end quantity, squared"}
          - {value: c, label: '\( f(x)=-2(x+3)^{2}(x-2) \)', speak: "f of x equals negative 2 times the quantity x plus 3, end quantity, squared, times the quantity x minus 2"}
          - {value: d, label: '\( f(x)=2(x-3)^{2}(x+2) \)', speak: "f of x equals 2 times the quantity x minus 3, end quantity, squared, times the quantity x plus 2"}
        correct: a
        explanation: |-
          The graph turns around at \( -3 \), so \( (x+3) \) has an even exponent, and it crosses at 2, so \( (x-2) \) has an odd one. The ends go down on the left and up on the right: odd degree, positive leading coefficient. Check the \( y \)-intercept: \( 2(3)^{2}(-2)=-36 \). Swapping the exponents would make it cross at −3; the −2 version would flip the ends; and \( (x-3)^{2}(x+2) \) has zeros at 3 and −2. <strong>\( f(x)=2(x+3)^{2}(x-2) \).</strong>
      - id: mg2
        title: "Match 2"
        figure:
          file: figures/PR3/mg2.svg
          title: "A polynomial graph with two zeros and a y-intercept"
          caption: 'A graph on axes with x from about −5.5 to 2.5 and y from −200 to 200. Coming up from the lower left, it rises to meet the x-axis at (−4, 0) and turns back down, falls to a low point near x = −1.5, rises through the y-intercept (0, −48) to meet the x-axis again at (1, 0), turns back down, and falls to the lower right. The graph never goes above the x-axis. The two zeros and the y-intercept are labeled.'
        prompt: 'Which formula matches this graph?'
        choices:
          - {value: a, label: '\( f(x)=3(x-1)^{2}(x+4)^{2} \)', speak: "f of x equals 3 times the quantity x minus 1, end quantity, squared, times the quantity x plus 4, end quantity, squared"}
          - {value: b, label: '\( f(x)=-3(x-1)(x+4)^{2} \)', speak: "f of x equals negative 3 times the quantity x minus 1, times the quantity x plus 4, end quantity, squared"}
          - {value: c, label: '\( f(x)=-3(x+1)^{2}(x-4)^{2} \)', speak: "f of x equals negative 3 times the quantity x plus 1, end quantity, squared, times the quantity x minus 4, end quantity, squared"}
          - {value: d, label: '\( f(x)=-3(x-1)^{2}(x+4)^{2} \)', speak: "f of x equals negative 3 times the quantity x minus 1, end quantity, squared, times the quantity x plus 4, end quantity, squared"}
        correct: d
        explanation: |-
          It turns around at both zeros, so both exponents are even. Both ends go down: even degree, negative leading coefficient. Zeros at 1 and −4 mean factors \( (x-1) \) and \( (x+4) \). Check: \( -3(-1)^{2}(4)^{2}=-48 \). The positive version would point both ends up, the version with \( (x-1) \) to the first power would cross at 1, and \( (x+1)^{2}(x-4)^{2} \) has zeros at −1 and 4. <strong>\( f(x)=-3(x-1)^{2}(x+4)^{2} \).</strong>
      - id: mg3
        title: "Match 3"
        figure:
          file: figures/PR3/mg3.svg
          title: "A polynomial graph with two zeros and a y-intercept"
          caption: 'A graph on axes with x from about −3.5 to 5.5 and y from −200 to 200. Coming from the lower left, it rises to meet the x-axis at (−2, 0), turns back down without going above the axis, passes through the y-intercept (0, −64), reaches a low point near x = 2, then rises through the x-axis at (4, 0) and keeps rising to the upper right. The two zeros and the y-intercept are labeled.'
        prompt: 'Which formula matches this graph? Use the y-intercept.'
        choices:
          - {value: a, label: '\( f(x)=2(x+2)^{2}(x-4) \)', speak: "f of x equals 2 times the quantity x plus 2, end quantity, squared, times the quantity x minus 4"}
          - {value: b, label: '\( f(x)=4(x+2)^{2}(x-4) \)', speak: "f of x equals 4 times the quantity x plus 2, end quantity, squared, times the quantity x minus 4"}
          - {value: c, label: '\( f(x)=4(x+2)(x-4)^{2} \)', speak: "f of x equals 4 times the quantity x plus 2, times the quantity x minus 4, end quantity, squared"}
          - {value: d, label: '\( f(x)=-4(x+2)^{2}(x-4) \)', speak: "f of x equals negative 4 times the quantity x plus 2, end quantity, squared, times the quantity x minus 4"}
        correct: b
        explanation: |-
          Turns at −2 and crosses at 4, with ends down-left and up-right, so the form is \( k(x+2)^{2}(x-4) \) with \( k \) positive. The shape alone cannot tell 2 from 4; the \( y \)-intercept can: \( k(2)^{2}(-4)=-16k=-64 \), so \( k=4 \). With \( k=2 \) the intercept would be \( (0,-32) \). The other two choices cross at the wrong zero or flip the ends. <strong>\( f(x)=4(x+2)^{2}(x-4) \).</strong>
      - id: mg4
        title: "Sketch It"
        math:
          display: 'f(x)=-2(x-3)^{2}(x+1)'
          speak: "f of x equals negative 2 times the quantity x minus 3, end quantity, squared, times the quantity x plus 1"
        prompt: 'CheckIt will ask you to sketch this. Reading from left to right, which description of the graph is right?'
        choices:
          - {value: a, label: "Starts low, goes through the axis at −1, turns at 3, ends high"}
          - {value: b, label: "Starts high, turns at −1, goes through the axis at 3, ends low"}
          - {value: c, label: "Starts high, goes through the axis at −1, turns at 3, ends low"}
          - {value: d, label: "Starts high, goes through the axis at 1, turns at −3, ends low"}
        correct: c
        explanation: |-
          Degree \( 2+1=3 \) with a negative leading coefficient: up on the left, down on the right. Coming down from the upper left, the graph crosses at \( x=-1 \) (multiplicity 1), dips to a low point, passes through the \( y \)-intercept \( -2(-3)^{2}(1)=-18 \), rises to touch the axis at \( x=3 \) (multiplicity 2), and turns back down. Starting low is the positive version, turning at −1 swaps the multiplicities, and 1 and −3 read the signs as written. <strong>Starts high, crosses at −1, touches at 3, ends low.</strong> To sketch it, plot \( (-1,0) \), \( (3,0) \), and \( (0,-18) \), then connect them this way.
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: 'f(x)=3(x+4)^{2}(x-1)'
          speak: "f of x equals 3 times the quantity x plus 4, end quantity, squared, times the quantity x minus 1"
        prompt: 'A student says the zeros are 4, with multiplicity 2, and −1, with multiplicity 1. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The multiplicities are swapped: 4 has 1 and −1 has 2."}
          - {value: c, label: "The signs are flipped: the zeros are −4 and 1."}
          - {value: d, label: "3 is also a zero, with multiplicity 1."}
        correct: c
        explanation: |-
          Set each factor equal to 0: \( x+4=0 \) gives \( x=-4 \), and \( x-1=0 \) gives \( x=1 \). The multiplicities were right. <strong>The zeros are −4, with multiplicity 2, and 1, with multiplicity 1.</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: '\begin{aligned} f(0)&=2(0-1)^{2}(0+3)\\ &=2\cdot 1\cdot 3\\ &=6 \end{aligned}'
          speak: "f of 0 equals 2 times the quantity 0 minus 1, end quantity, squared, times the quantity 0 plus 3. Next line: equals 2 times 1 times 3. Next line: equals 6"
        prompt: 'For f(x) = 2(x − 1)²(x + 3), a student found the y-intercept (0, 6) with this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "(−1)² is −1, so the intercept is (0, −6)."}
          - {value: c, label: "The y-intercept is where y = 0, so x = 1."}
          - {value: d, label: "It should be (0, 2), from the leading coefficient."}
        correct: a
        explanation: |-
          The \( y \)-intercept is where \( x=0 \). \( (0-1)^{2}=(-1)^{2}=1 \), and \( 2\cdot 1\cdot 3=6 \). <strong>There is no mistake.</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: 'f(x)=(x+2)^{2}(x-3)'
          speak: "f of x equals the quantity x plus 2, end quantity, squared, times the quantity x minus 3"
        prompt: 'A student sketched the graph crossing the x-axis at x = −2 and at x = 3. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "At −2 the multiplicity is 2, so it turns there."}
          - {value: c, label: "It should turn around at 3, not at −2."}
          - {value: d, label: "The zeros should be at 2 and −3, not at −2 and 3."}
        correct: b
        explanation: |-
          \( (x+2) \) is squared, so \( x=-2 \) has even multiplicity and the graph touches the \( x \)-axis and turns around there. At \( x=3 \), multiplicity 1, it does cross. <strong>Touch at −2, cross at 3.</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: 'f(x)=-2(x-3)^{2}(x+1)'
          speak: "f of x equals negative 2 times the quantity x minus 3, end quantity, squared, times the quantity x plus 1"
        prompt: 'A student says both ends go down, because the leading coefficient is negative. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Both ends go up, because 2 squared is positive."}
          - {value: c, label: "The left end goes down and the right end goes up."}
          - {value: d, label: "The degree is odd, so the ends go opposite ways."}
        correct: d
        explanation: |-
          The degree is \( 2+1=3 \), so the ends go opposite ways. With a negative leading coefficient, the graph goes up on the left and down on the right. "Both ends down" is right only for even degree. <strong>Up on the left, down on the right.</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: '\begin{aligned} f(0)&=-4(0-2)^{2}(0+5)\\ &=-4\cdot(-2)\cdot 5\\ &=40 \end{aligned}'
          speak: "f of 0 equals negative 4 times the quantity 0 minus 2, end quantity, squared, times the quantity 0 plus 5. Next line: equals negative 4 times negative 2 times 5. Next line: equals 40"
        prompt: 'For f(x) = −4(x − 2)²(x + 5), a student found the y-intercept with this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The square was skipped: (−2)² = 4, so it is (0, −80)."}
          - {value: c, label: "The y-intercept should be (0, −4), the leading coefficient."}
          - {value: d, label: "It should be (0, 80), since squares are positive."}
        correct: b
        explanation: |-
          \( (0-2)^{2}=(-2)^{2}=4 \), not \( -2 \). So \( f(0)=-4\cdot 4\cdot 5=-80 \). The square makes that factor positive, and the sign comes from the −4. <strong>The \( y \)-intercept is \( (0,-80) \).</strong>
