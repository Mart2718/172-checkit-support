# PR4 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt PR4 builds f = q*g + r with g = (x - a)(x - b) a monic quadratic, q = k(x - c) with k from +/-1 to +/-6, and r = x - d,
# and asks: "Use long division to find the quotient and remainder for f(x) = (cubic)/(g)". The answer is written
# f(x) = q + r/g. About 1 in 13 CheckIt problems has a missing term (a 0 coefficient) in the cubic.
# Figures drawn by tools/figures/make_pr4.py.
code: PR4
h1: "PR4 Support: Polynomial Long Division"
pageTitle: "PR4 Support: Polynomial Long Division — Math 172, Santa Ana College"
hubSummary: "Polynomial long division: quotient, remainder, and writing f(x) = quotient + remainder over divisor"
videoIntro: "A narrated walkthrough of polynomial long division: divide the leading terms, multiply, subtract every term, bring down, and stop when the remainder's degree is less than the divisor's."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'placeholder|missing term|sign error|stopped early|unfinished|misalign|lined up wrong|forgot|is finished|not finished'
worked:   # used for the worked-examples recording document
  title: "PR4 Worked Examples: Polynomial Long Division"
  coreQuestion: "What do I multiply the divisor by to match the leading term?"
  coreFollowup: "Divide the leading term by the divisor's leading term to get the next quotient term. Multiply the whole divisor by it, subtract every term, and bring down the next term. Repeat until the bottom line has a lower degree than the divisor; that line is the remainder. Write the answer as quotient plus remainder over divisor, and check it by multiplying back."
summary:   # the Quick Summary tab
  intro: 'Polynomial long division works like the long division you learned with numbers: <span>\( 17\div 5=3+\dfrac{2}{5} \)</span>. <strong>One short loop does all the work: divide, multiply, subtract, bring down.</strong>'
  caption: "The steps of polynomial long division, and what to watch for at each one"
  columns: ["Step", "Do this", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - 'Set up'
      - 'Write the dividend with powers going down. Put a 0 in for any missing power.'
      - '<span>\( 7x^{3}-2x+9 \)</span> becomes <span>\( 7x^{3}+0x^{2}-2x+9 \)</span>, so like terms stay in the same column.'
    -
      - 'Divide'
      - 'Leading term ÷ the divisor''s leading term gives the next quotient term: <span>\( 7x^{3}\div x^{2}=7x \)</span>.'
      - 'Subtract the exponents when you divide powers. Keep the sign.'
    -
      - 'Multiply and subtract'
      - 'Multiply the whole divisor by that term. Subtract it: change every sign in that row, then add.'
      - 'Subtract every term, not only the first. The leading terms should cancel.'
    -
      - 'Bring down and repeat'
      - 'Bring down the next term and go again. Stop when the bottom line has a lower degree than the divisor.'
      - 'Bring each term down into its own column, under its own power.'
    -
      - 'Write and check'
      - 'Write <span>\( f(x)=\text{quotient}+\dfrac{\text{remainder}}{\text{divisor}} \)</span>.'
      - 'Check: quotient times divisor, plus remainder, should give back the dividend.'
  note: 'CheckIt''s outcome calls the answer "a polynomial plus a proper rational function": the quotient is the polynomial, and the remainder over the divisor is proper because its top has a lower degree than its bottom. Your CheckIt problem divides a degree 3 polynomial by a degree 2 polynomial. Your numbers will be different. The loop is what transfers, and in calculus the same division shows which line a graph follows far out.'
tabs:
  - id: steps
    label: "Try It: One Step at a Time"
    heading: "Try It: One Step at a Time"
    intro: |-
      Each item zooms in on one step of the loop: divide, multiply and subtract, divide again, and knowing when to stop. Make your best guess on each one, then check it.
    items:
      - id: st1
        title: "Divide"
        figure:
          file: figures/PR4/st1.svg
          title: "A long division setup"
          caption: 'A long division setup. The divisor, x squared plus x minus 6, is to the left of the division bracket. Under the bracket is the dividend, 5x cubed minus 15x squared minus 49x plus 121. The space above the bracket, where the quotient goes, is empty.'
        prompt: 'What is the first term of the quotient?'
        choices:
          - {value: a, label: '\( 5x^{2} \)', speak: "5 x squared"}
          - {value: b, label: '\( 5x \)', speak: "5 x"}
          - {value: c, label: "5"}
          - {value: d, label: '\( 5x^{3} \)', speak: "5 x cubed"}
        correct: b
        explanation: |-
          Divide the leading terms: \( \dfrac{5x^{3}}{x^{2}}=5x \), since dividing powers subtracts the exponents, \( 3-2=1 \). Check: \( 5x\cdot x^{2}=5x^{3} \), the leading term. \( 5x^{2} \) divides by \( x \) instead of \( x^{2} \); 5 drops the \( x \); and \( 5x^{3} \) does not divide at all. The other terms of the dividend wait their turn. <strong>\( 5x \).</strong>
      - id: st2
        title: "Multiply and Subtract"
        figure:
          file: figures/PR4/st2.svg
          title: "A long division in progress, with an empty box for the next line"
          caption: 'A long division in progress. The divisor x squared minus 3x minus 4 is to the left of the bracket, and the dividend under it is negative 6x cubed plus 6x squared plus 61x plus 45. Above the bracket, the first quotient term is negative 6x. Below the dividend, marked to be subtracted, is the product negative 6x cubed plus 18x squared plus 24x, with a line under it. Below the line is an empty box with a question mark.'
        prompt: 'Subtract, then bring down the 45. What goes in the box?'
        choices:
          - {value: a, label: '\( 24x^{2}+85x+45 \)', speak: "24 x squared plus 85 x plus 45"}
          - {value: b, label: '\( 24x^{2}+37x+45 \)', speak: "24 x squared plus 37 x plus 45"}
          - {value: c, label: '\( -12x^{2}+37x+45 \)', speak: "negative 12 x squared plus 37 x plus 45"}
          - {value: d, label: '\( -12x^{2}+85x+45 \)', speak: "negative 12 x squared plus 85 x plus 45"}
        correct: c
        explanation: |-
          Subtract every term: \( 6x^{2}-18x^{2}=-12x^{2} \) and \( 61x-24x=37x \). The \( -6x^{3} \) terms cancel, as the leading terms always should. Then bring down 45. \( 24x^{2} \) comes from adding \( 18x^{2} \) instead of subtracting it, and \( 85x \) from adding \( 24x \). Those happen when only the leading term's sign gets changed; one choice has both slips. Tip: change every sign in the bottom row, then add. <strong>\( -12x^{2}+37x+45 \).</strong>
      - id: st3
        title: "Divide Again"
        figure:
          file: figures/PR4/st3.svg
          title: "A long division after its first subtraction"
          caption: 'A long division in progress. The divisor x squared minus x minus 6 is to the left of the bracket, and the dividend under it is 4x cubed plus 16x squared minus 43x minus 121. Above the bracket, the first quotient term is 4x. Below the dividend, marked to be subtracted, is 4x cubed minus 4x squared minus 24x, with a line under it. Below the line is the new line, 20x squared minus 19x minus 121.'
        prompt: 'What is the next term of the quotient?'
        choices:
          - {value: a, label: "20"}
          - {value: b, label: '\( 20x \)', speak: "20 x"}
          - {value: c, label: "−20"}
          - {value: d, label: '\( 20x^{2} \)', speak: "20 x squared"}
        correct: a
        explanation: |-
          Divide the new leading term by the divisor's leading term: \( \dfrac{20x^{2}}{x^{2}}=20 \). It is a number, with no \( x \), because the powers match. \( 20x \) divides by \( x \) instead of \( x^{2} \); −20 changes the sign; and \( 20x^{2} \) skips the division. The quotient so far is \( 4x+20 \). <strong>20.</strong>
      - id: st4
        title: "Stop or Go On?"
        figure:
          file: figures/PR4/st4.svg
          title: "A long division worked down to a bottom line"
          caption: 'A long division. The divisor x squared minus 3x minus 4 is to the left of the bracket, and the dividend is 3x cubed minus 15x squared plus 7x plus 19. Above the bracket is the quotient, 3x minus 6. Below the dividend: subtract 3x cubed minus 9x squared minus 12x, leaving negative 6x squared plus 19x plus 19; then subtract the quantity negative 6x squared plus 18x plus 24, leaving x minus 5 on the bottom line.'
        prompt: 'The bottom line is x − 5. Should the division stop here?'
        choices:
          - {value: a, label: "No: keep dividing until the bottom line is just a single number."}
          - {value: b, label: "No: x goes into x once more, so the remainder is really −5."}
          - {value: c, label: "Yes: the last term of the dividend, 19, has been brought down."}
          - {value: d, label: "Yes: x − 5 has degree 1, less than the divisor's degree 2."}
        correct: d
        explanation: |-
          Stop when the bottom line's degree is less than the divisor's. \( x-5 \) has degree 1 and \( x^{2}-3x-4 \) has degree 2, and \( x^{2} \) does not go into \( x \) as a polynomial term. So \( x-5 \) is the remainder and \( 3x-6 \) is the quotient. Bringing down the last term has to happen, but it is not the test, and a remainder can be an expression like \( x-5 \), not only a number. <strong>Yes: degree 1 is less than degree 2.</strong>
  - id: divide
    label: "Try It: Divide It"
    heading: "Try It: Divide It"
    intro: |-
      Now run the whole loop. Work each one on paper first, then pick the result that matches yours. Make your best guess, then check it.
    items:
      - id: dv1
        title: "Divide 1"
        math:
          display: '\dfrac{3x^{3}-6x^{2}-56x+62}{x^{2}-6x+5}'
          speak: "the fraction 3 x cubed minus 6 x squared minus 56 x plus 62, over x squared minus 6 x plus 5, end fraction"
        prompt: 'Use long division. Which is the result?'
        choices:
          - {value: a, label: '\( f(x)=3x-12+\dfrac{x+2}{x^{2}-6x+5} \)', speak: "f of x equals 3 x minus 12, plus the fraction x plus 2, over x squared minus 6 x plus 5, end fraction"}
          - {value: b, label: '\( f(x)=3x+12+\dfrac{x^{2}-6x+5}{x+2} \)', speak: "f of x equals 3 x plus 12, plus the fraction x squared minus 6 x plus 5, over x plus 2, end fraction"}
          - {value: c, label: '\( f(x)=3x+12+\dfrac{x+2}{x^{2}-6x+5} \)', speak: "f of x equals 3 x plus 12, plus the fraction x plus 2, over x squared minus 6 x plus 5, end fraction"}
          - {value: d, label: '\( f(x)=3x+12+\dfrac{x-2}{x^{2}-6x+5} \)', speak: "f of x equals 3 x plus 12, plus the fraction x minus 2, over x squared minus 6 x plus 5, end fraction"}
        correct: c
        explanation: |-
          \( \dfrac{3x^{3}}{x^{2}}=3x \). Subtract \( 3x(x^{2}-6x+5)=3x^{3}-18x^{2}+15x \): \( -6x^{2}+18x^{2}=12x^{2} \) and \( -56x-15x=-71x \); bring down 62. Next, \( \dfrac{12x^{2}}{x^{2}}=12 \). Subtract \( 12(x^{2}-6x+5)=12x^{2}-72x+60 \): \( -71x+72x=x \) and \( 62-60=2 \). The remainder \( x+2 \) has degree 1, so stop. The quotient \( 3x-12 \) has the wrong sign on 12: \( -6x^{2}-(-18x^{2})=+12x^{2} \). The remainder \( x-2 \) subtracts in the wrong order, \( 60-62 \); and the remainder goes over the divisor, not the other way around. <strong>\( f(x)=3x+12+\dfrac{x+2}{x^{2}-6x+5} \).</strong>
      - id: dv2
        title: "Divide 2"
        math:
          display: '\dfrac{-x^{3}+3x^{2}+11x-19}{x^{2}+x-6}'
          speak: "the fraction negative x cubed plus 3 x squared plus 11 x minus 19, over x squared plus x minus 6, end fraction"
        prompt: 'Use long division. Which is the result?'
        choices:
          - {value: a, label: '\( f(x)=-x+4+\dfrac{x+5}{x^{2}+x-6} \)', speak: "f of x equals negative x plus 4, plus the fraction x plus 5, over x squared plus x minus 6, end fraction"}
          - {value: b, label: '\( f(x)=x+4+\dfrac{x+5}{x^{2}+x-6} \)', speak: "f of x equals x plus 4, plus the fraction x plus 5, over x squared plus x minus 6, end fraction"}
          - {value: c, label: '\( f(x)=-x+2+\dfrac{x+5}{x^{2}+x-6} \)', speak: "f of x equals negative x plus 2, plus the fraction x plus 5, over x squared plus x minus 6, end fraction"}
          - {value: d, label: '\( f(x)=-x+4+x+5 \)', speak: "f of x equals negative x plus 4 plus x plus 5"}
        correct: a
        explanation: |-
          The leading coefficient is a hidden \( -1 \): \( \dfrac{-x^{3}}{x^{2}}=-x \). Subtract \( -x(x^{2}+x-6)=-x^{3}-x^{2}+6x \): \( 3x^{2}-(-x^{2})=4x^{2} \) and \( 11x-6x=5x \); bring down \( -19 \). Next, \( \dfrac{4x^{2}}{x^{2}}=4 \). Subtract \( 4x^{2}+4x-24 \): \( 5x-4x=x \) and \( -19-(-24)=5 \). The remainder is \( x+5 \). \( x+4 \) drops the negative on \( -x \); the 2 comes from \( 3x^{2}+(-x^{2}) \), adding instead of subtracting; and the remainder has to be divided by the divisor, not just added on. <strong>\( f(x)=-x+4+\dfrac{x+5}{x^{2}+x-6} \).</strong>
      - id: dv3
        title: "Divide 3"
        figure:
          file: figures/PR4/dv3.svg
          title: "A long division setup with the first quotient term"
          caption: 'A long division setup. The divisor x squared plus 3x minus 4 is to the left of the division bracket. Under the bracket is the dividend, 2x cubed minus 25x plus 26, with a blank space where an x squared term would go. Above the bracket, the first term of the quotient, 2x, is written above negative 25x.'
        prompt: 'The dividend has no \( x^{2} \) term. Multiply \( 2x \) by the divisor and subtract. What is the new line, after bringing down?'
        choices:
          - {value: a, label: '\( -31x^{2}+34x \)', speak: "negative 31 x squared plus 34 x"}
          - {value: b, label: '\( -6x^{2}-33x+26 \)', speak: "negative 6 x squared minus 33 x plus 26"}
          - {value: c, label: '\( 6x^{2}-17x+26 \)', speak: "6 x squared minus 17 x plus 26"}
          - {value: d, label: '\( -6x^{2}-17x+26 \)', speak: "negative 6 x squared minus 17 x plus 26"}
        correct: d
        explanation: |-
          Rewrite the dividend with a 0 for the missing power, \( 2x^{3}+0x^{2}-25x+26 \), so like terms line up. Subtract \( 2x(x^{2}+3x-4)=2x^{3}+6x^{2}-8x \): \( 0x^{2}-6x^{2}=-6x^{2} \) and \( -25x-(-8x)=-17x \); bring down 26. Without the 0, the \( 6x^{2} \) lands under \( -25x \), which gives \( -31x^{2}+34x \). The \( 6x^{2} \) version adds instead of subtracting, and \( -33x \) adds \( -8x \) instead of subtracting it. Finishing gives \( f(x)=2x-6+\dfrac{x+2}{x^{2}+3x-4} \). <strong>\( -6x^{2}-17x+26 \).</strong>
      - id: dv4
        title: "Divide 4"
        math:
          display: '\dfrac{-3x^{3}+3x^{2}+67x-119}{x^{2}+3x-10}'
          speak: "the fraction negative 3 x cubed plus 3 x squared plus 67 x minus 119, over x squared plus 3 x minus 10, end fraction"
        prompt: 'Use long division. What is the quotient?'
        choices:
          - {value: a, label: '\( -3x-12 \)', speak: "negative 3 x minus 12"}
          - {value: b, label: '\( -3x+12 \)', speak: "negative 3 x plus 12"}
          - {value: c, label: '\( -3x^{2}+12x \)', speak: "negative 3 x squared plus 12 x"}
          - {value: d, label: '\( 3x+12 \)', speak: "3 x plus 12"}
        correct: b
        explanation: |-
          \( \dfrac{-3x^{3}}{x^{2}}=-3x \). Subtract \( -3x(x^{2}+3x-10)=-3x^{3}-9x^{2}+30x \): \( 3x^{2}+9x^{2}=12x^{2} \) and \( 67x-30x=37x \); bring down \( -119 \). Next, \( \dfrac{12x^{2}}{x^{2}}=12 \), and subtracting \( 12x^{2}+36x-120 \) leaves \( x+1 \), degree 1, the remainder. −12 has the right size but the wrong sign: \( 3x^{2}-(-9x^{2})=3x^{2}+9x^{2}=+12x^{2} \); \( 3x+12 \) drops the negative; and \( -3x^{2}+12x \) divides by \( x \) instead of \( x^{2} \). A degree 3 polynomial divided by a degree 2 one has a degree 1 quotient. <strong>\( -3x+12 \), with remainder \( x+1 \).</strong>
  - id: use
    label: "Try It: Write, Check, Look Ahead"
    heading: "Try It: Write, Check, Look Ahead"
    intro: |-
      Once the division is done: write the answer the way CheckIt wants it, check it by multiplying back, and see what the result tells you about the graph. Make your best guess, then check it.
    items:
      - id: wc1
        title: "Write It"
        math:
          display: '\dfrac{-2x^{3}+6x^{2}+21x-47}{x^{2}-6x+8}'
          speak: "the fraction negative 2 x cubed plus 6 x squared plus 21 x minus 47, over x squared minus 6 x plus 8, end fraction"
        prompt: 'Long division gives quotient \( -2x-6 \) and remainder \( x+1 \). Which of these equals f(x)?'
        choices:
          - {value: a, label: '\( f(x)=-2x-6+x+1 \)', speak: "f of x equals negative 2 x minus 6 plus x plus 1"}
          - {value: b, label: '\( f(x)=-2x-6+\dfrac{x^{2}-6x+8}{x+1} \)', speak: "f of x equals negative 2 x minus 6, plus the fraction x squared minus 6 x plus 8, over x plus 1, end fraction"}
          - {value: c, label: '\( f(x)=-2x-6+\dfrac{x+1}{x^{2}-6x+8} \)', speak: "f of x equals negative 2 x minus 6, plus the fraction x plus 1, over x squared minus 6 x plus 8, end fraction"}
          - {value: d, label: '\( f(x)=\dfrac{-2x-6}{x^{2}-6x+8}+x+1 \)', speak: "f of x equals the fraction negative 2 x minus 6, over x squared minus 6 x plus 8, end fraction, plus x plus 1"}
        correct: c
        explanation: |-
          It works like \( 17\div 5=3+\dfrac{2}{5} \): the quotient, plus the remainder over the divisor. Adding \( x+1 \) on its own leaves out the division; flipping the fraction puts the divisor on top; and the quotient is never divided by anything. <strong>\( f(x)=-2x-6+\dfrac{x+1}{x^{2}-6x+8} \).</strong>
      - id: wc2
        title: "Check It"
        math:
          display: '\begin{aligned} f(x)&=(-4x+8)(x^{2}-4x-5)\\ &\quad+(x+3) \end{aligned}'
          speak: "f of x equals the quantity negative 4 x plus 8, end quantity, times the quantity x squared minus 4 x minus 5, end quantity, plus the quantity x plus 3, end quantity"
        prompt: 'Dividing f(x) by \( x^{2}-4x-5 \) gave quotient \( -4x+8 \) and remainder \( x+3 \). Multiply back as shown. What is f(x)?'
        choices:
          - {value: a, label: '\( -4x^{3}+24x^{2}-11x-37 \)', speak: "negative 4 x cubed plus 24 x squared minus 11 x minus 37"}
          - {value: b, label: '\( -4x^{3}+24x^{2}-13x-43 \)', speak: "negative 4 x cubed plus 24 x squared minus 13 x minus 43"}
          - {value: c, label: '\( -4x^{3}+24x^{2}-12x-40 \)', speak: "negative 4 x cubed plus 24 x squared minus 12 x minus 40"}
          - {value: d, label: '\( -4x^{3}+16x^{2}-11x-37 \)', speak: "negative 4 x cubed plus 16 x squared minus 11 x minus 37"}
        correct: a
        explanation: |-
          \( (-4x+8)(x^{2}-4x-5)=-4x^{3}+16x^{2}+20x+8x^{2}-32x-40=-4x^{3}+24x^{2}-12x-40 \). Adding \( x+3 \) gives \( -4x^{3}+24x^{2}-11x-37 \). Stopping before the remainder is added, subtracting it, or missing the \( 8x^{2} \) from \( 8\cdot x^{2} \) gives the other three. Use this check on your own CheckIt answer: if it does not give back the dividend, look for a sign slip. <strong>\( -4x^{3}+24x^{2}-11x-37 \).</strong>
      - id: wc3
        title: "Predict"
        math:
          display: '\dfrac{ax^{3}+bx^{2}+cx+d}{x^{2}+px+q}'
          speak: "the fraction a x cubed plus b x squared plus c x plus d, over x squared plus p x plus q, end fraction"
        prompt: 'Before you start: dividing a degree 3 polynomial by a degree 2 polynomial, what degrees can the quotient and the remainder have?'
        choices:
          - {value: a, label: "Quotient of degree 1; remainder of degree 2 or less"}
          - {value: b, label: "Quotient of degree 1; remainder of degree 1 or less"}
          - {value: c, label: "Quotient of degree 2; remainder of degree 1 or less"}
          - {value: d, label: "Quotient of degree 0; remainder of degree 1 or less"}
        correct: b
        explanation: |-
          The first quotient term is \( x^{3}\div x^{2}=x \), so the quotient has degree \( 3-2=1 \). The division stops as soon as the bottom line's degree drops below 2, so the remainder has degree 1 or less. A degree 2 remainder would mean you could still divide again. That is why the quotient cannot have degree 2 or degree 0. That is the shape of every CheckIt answer: a degree 1 quotient, plus a degree 1 remainder over the divisor. <strong>Quotient of degree 1; remainder of degree 1 or less.</strong>
      - id: wc4
        title: "Look Ahead"
        math:
          display: 'f(x)=2x-2+\dfrac{x-2}{x^{2}+7x+12}'
          speak: "f of x equals 2 x minus 2, plus the fraction x minus 2, over x squared plus 7 x plus 12, end fraction"
        prompt: 'This is what long division gives for one function f. When x is very large, the graph of f is very close to which line?'
        choices:
          - {value: a, label: '\( y=2 \)', speak: "y equals 2"}
          - {value: b, label: '\( y=0 \)', speak: "y equals 0"}
          - {value: c, label: '\( y=3x-4 \)', speak: "y equals 3 x minus 4"}
          - {value: d, label: '\( y=2x-2 \)', speak: "y equals 2 x minus 2"}
        correct: d
        explanation: |-
          The fraction's top has degree 1 and its bottom has degree 2, so for large \( x \) the bottom grows much faster and the fraction shrinks toward 0. At \( x=100 \) it is \( \dfrac{98}{10712}\approx 0.009 \). What is left is \( 2x-2 \), so the graph hugs the line \( y=2x-2 \). This line is called a slant asymptote. In calculus you will confirm it with limits as \( x \) grows. \( y=2 \) compares leading coefficients, which works only when the top and bottom degrees match; \( y=0 \) is where the fraction goes, not the whole function; and \( 3x-4 \) adds the remainder on whole instead of keeping it over the divisor. <strong>\( y=2x-2 \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        figure:
          file: figures/PR4/sl1.svg
          title: "A student's first subtraction in a long division"
          caption: 'A student''s long division. The divisor x squared minus 2x minus 3 is to the left of the bracket, and the dividend is 4x cubed plus 16x squared minus 59x minus 74. Above the bracket, the first quotient term is 4x. Below the dividend, marked to be subtracted, is 4x cubed minus 8x squared minus 12x, with a line under it. The student''s new line below is 24x squared minus 71x minus 74.'
        prompt: 'A student is dividing \( 4x^{3}+16x^{2}-59x-74 \) by \( x^{2}-2x-3 \). Here is the first subtraction. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "16x² − (−8x²) is 8x², so the line should start with 8x²."}
          - {value: c, label: "−12x was added: −59x − (−12x) is −47x, not −71x."}
          - {value: d, label: "The first term of the quotient should be 4x², not 4x."}
        correct: c
        explanation: |-
          Subtracting changes every sign in the bottom row. \( 16x^{2}-(-8x^{2})=24x^{2} \), which the student got right, but \( -59x-(-12x)=-47x \), not \( -71x \). The new line is \( 24x^{2}-47x-74 \), and \( 4x^{3}\div x^{2}=4x \) was right. <strong>The \( x \)-term was added instead of subtracted.</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: 'f(x)=4x+\dfrac{8x^{2}-39x-51}{x^{2}-5x-6}'
          speak: "f of x equals 4 x, plus the fraction 8 x squared minus 39 x minus 51, over x squared minus 5 x minus 6, end fraction"
        prompt: 'For \( 4x^{3}-12x^{2}-63x-51 \) divided by \( x^{2}-5x-6 \), a student gave quotient \( 4x \) and remainder \( 8x^{2}-39x-51 \), and wrote this answer. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "8x² − 39x − 51 has degree 2, not less than 2: divide again."}
          - {value: c, label: "The quotient should be 4x², since 4x³ ÷ x is 4x²."}
          - {value: d, label: "The remainder should be written over 4x³ − 12x² − 63x − 51."}
        correct: b
        explanation: |-
          A remainder must have a lower degree than the divisor. \( 8x^{2}-39x-51 \) has degree 2, the same as \( x^{2}-5x-6 \), so there is another step: \( 8x^{2}\div x^{2}=8 \), and subtracting \( 8x^{2}-40x-48 \) leaves \( x-3 \). The first step, \( 4x^{3}\div x^{2}=4x \), was right, and the remainder goes over the divisor, not over the dividend. <strong>Quotient \( 4x+8 \), remainder \( x-3 \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} &(5x+10)(x^{2}-4x+3)\\ &\quad+(x+4)\\ &=5x^{3}-10x^{2}-25x+30\\ &\quad+x+4\\ &=5x^{3}-10x^{2}-24x+34 \end{aligned}'
          speak: "the quantity 5 x plus 10, end quantity, times the quantity x squared minus 4 x plus 3, end quantity, plus the quantity x plus 4, end quantity. Next line: equals 5 x cubed minus 10 x squared minus 25 x plus 30, plus x plus 4. Next line: equals 5 x cubed minus 10 x squared minus 24 x plus 34"
        prompt: 'For \( 5x^{3}-10x^{2}-24x+34 \) divided by \( x^{2}-4x+3 \), a student got quotient \( 5x+10 \) and remainder \( x+4 \), then checked it this way. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The check should add the divisor, not the remainder."}
          - {value: c, label: "The remainder should be x − 4, from the last subtraction."}
          - {value: d, label: "The quotient should be 5x − 10, from −10x² − (−20x²)."}
        correct: a
        explanation: |-
          \( (5x+10)(x^{2}-4x+3)=5x^{3}-10x^{2}-25x+30 \), and adding \( x+4 \) gives \( 5x^{3}-10x^{2}-24x+34 \), the dividend. Adding the remainder is the right check, and because the check gives back the dividend, the remainder \( x+4 \) is right too. Also \( -10x^{2}-(-20x^{2})=10x^{2} \), so the quotient's second term is \( +10 \). Multiplying back like this is how to be sure before you submit. <strong>There is no mistake.</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: 'f(x)=-4x+4+x-3'
          speak: "f of x equals negative 4 x plus 4 plus x minus 3"
        prompt: 'For \( -4x^{3}+20x^{2}+33x-51 \) divided by \( x^{2}-4x-12 \), a student found quotient \( -4x+4 \) and remainder \( x-3 \), and wrote this answer. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The quotient should be 4x + 4, since −4x³ ÷ x² is a positive 4x."}
          - {value: c, label: "It is not simplified: combine like terms to get −3x + 1."}
          - {value: d, label: "The remainder goes over the divisor: + (x − 3)/(x² − 4x − 12)."}
        correct: d
        explanation: |-
          The remainder is divided by the divisor, the way \( 17\div 5=3+\dfrac{2}{5} \). Writing \( +x-3 \) adds it on whole, and combining that into \( -3x+1 \) only simplifies a wrong answer. \( -4x^{3}\div x^{2}=-4x \) keeps its sign. <strong>\( f(x)=-4x+4+\dfrac{x-3}{x^{2}-4x-12} \).</strong>
      - id: sl5
        title: "Slip 5"
        figure:
          file: figures/PR4/sl5.svg
          title: "A student's first subtraction in a long division"
          caption: 'A student''s long division. The divisor x squared plus x minus 6 is to the left of the bracket, and the dividend is written 6x cubed minus 41x plus 32. Above the bracket, the student wrote 6x above negative 41x. Below the dividend, marked to be subtracted, is 6x cubed plus 6x squared minus 36x, written so that 6x squared is under negative 41x and negative 36x is under 32. The student''s new line is negative 47x squared plus 68x.'
        prompt: 'A student is dividing \( 6x^{3}-41x+32 \) by \( x^{2}+x-6 \). Here is the first subtraction. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The first term of the quotient should be 6x², since 6x³ ÷ x is 6x²."}
          - {value: c, label: "Without 0x², the columns slip; the line should be −6x² − 5x + 32."}
          - {value: d, label: "The product should be 6x³ − 6x² + 36x, since it is being subtracted."}
        correct: c
        explanation: |-
          The dividend has no \( x^{2} \) term, so write it as \( 6x^{3}+0x^{2}-41x+32 \). Then \( 6x^{2} \) sits under \( 0x^{2} \) and \( -36x \) under \( -41x \): \( 0-6x^{2}=-6x^{2} \) and \( -41x-(-36x)=-5x \), then bring down 32. Combining \( -41x \) with \( 6x^{2} \) mixes unlike terms. The quotient term was right, \( 6x^{3}\div x^{2}=6x \), and so was the product \( 6x(x^{2}+x-6)=6x^{3}+6x^{2}-36x \); the signs change when you subtract, not before. <strong>The new line is \( -6x^{2}-5x+32 \).</strong>
