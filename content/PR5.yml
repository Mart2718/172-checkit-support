          A zero with multiplicity 2 gives its factor twice: \( (x-3)^{2} \). Count: degree 5 needs five linear factors, and the student wrote four. Irrational zeros do give linear factors, \( \big(x-(1+\sqrt{5})\big) \) and \( \big(x-(1-\sqrt{5})\big) \), which the student wrote correctly; \( (x+1+\sqrt{5}) \) would go with the zero \( -1-\sqrt{5} \). CheckIt's answer key writes these with the inner parentheses removed, \( (x-1-\sqrt{5})(x-1+\sqrt{5}) \): the same factors. <strong>\( c(x)=(x+5)(x-3)^{2}\big(x-(1+\sqrt{5})\big)\big(x-(1-\sqrt{5})\big) \).</strong>
