          - {value: b, label: "Subtracting −1/(x + 3) adds, so the top is 7x + 14."}
          - {value: c, label: "The bottom should be (x − 4) + (x + 3), not their product."}
          - {value: d, label: "6(x + 3) is 6x + 3, so the top is 5x + 7."}
        correct: b
        explanation: |-
          Subtracting a negative fraction is adding: \( \dfrac{6(x+3)}{(x-4)(x+3)}+\dfrac{x-4}{(x-4)(x+3)} \), so the top is \( 6x+18+x-4=7x+14=7(x+2) \). With critical points −3, −2, and 4, the answer is \( (-3,-2)\cup(4,\infty) \). The common denominator is the product, and \( 6(x+3)=6x+18 \). <strong>The top is \( 7x+14 \), not \( 5x+22 \).</strong>
