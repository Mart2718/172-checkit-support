# TE2 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt TE2 asks students to verify two identities and gives no answer key. Each is built the same way:
# (1) h(x) times (f(x) plus or minus g(x)), and (2) (plus or minus f(x) plus or minus g(x)) times two factors from sec, 1/cos, csc, 1/sin,
# with f, g, h chosen from the six trig functions. The other side is Sage's simplification, usually a sum of
# simple terms in mixed form, such as sec(x) - cos(x)/sin(x). The moves: rewrite in sine and cosine, distribute,
# cancel or combine fractions, sometimes use sin^2 + cos^2 = 1, then rename 1/cos as sec, and so on.
# Figure drawn by tools/figures/make_te2.py.
code: TE2
h1: "TE2 Support: Verifying Trigonometric Identities"
pageTitle: "TE2 Support: Verifying Trigonometric Identities — Math 172, Santa Ana College"
hubSummary: "Verifying identities: rewriting in sines and cosines, distributing, simplifying, and working on one side"
videoIntro: "A narrated walkthrough of verifying trigonometric identities: rewriting each function in sines and cosines, distributing and simplifying fractions, using the Pythagorean identity, and writing the verification one side at a time."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'not an identity|is an identity|cancel|cancels'
worked:   # used for the worked-examples recording document
  title: "TE2 Worked Examples: Verifying Trigonometric Identities"
  coreQuestion: "What does this side look like in sines and cosines?"
  coreFollowup: "Almost every TE2 verification starts the same way: rewrite every function in terms of sine and cosine. Then distribute, cancel what multiplies, combine fractions with a common denominator, and use sin² + cos² = 1 if it appears. Finish by renaming 1/cos as sec, cos/sin as cot, and so on, until you reach the other side. Work on one side only, and make each line equal the one before."
summary:   # the Quick Summary tab
  intro: 'To verify an identity, you show that one side can be rewritten, one true step at a time, until it becomes the other side. <strong>Start by writing everything in sines and cosines.</strong>'
  caption: "The moves that verify most TE2 identities, and what to watch for"
  columns: ["Move", "How", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - 'Rewrite in sine and cosine'
      - '<span>\( \tan x=\tfrac{\sin x}{\cos x} \)</span>, <span>\( \cot x=\tfrac{\cos x}{\sin x} \)</span>, <span>\( \sec x=\tfrac{1}{\cos x} \)</span>, <span>\( \csc x=\tfrac{1}{\sin x} \)</span>.'
      - 'Secant goes with cosine and cosecant goes with sine, even though the letters suggest the opposite.'
    -
      - 'Distribute'
      - 'Multiply the outside factor by every term inside the parentheses.'
      - 'A minus in front of the parentheses changes the sign of every term inside.'
    -
      - 'Simplify fractions'
      - 'Cancel a factor that multiplies the whole top and the whole bottom. To add fractions, use a common denominator.'
      - 'You cannot cancel part of a sum: <span>\( \tfrac{\sin x+\cos x}{\sin x} \)</span> is <span>\( 1+\cot x \)</span>, not <span>\( \cos x \)</span>.'
    -
      - 'Use the Pythagorean identity'
      - '<span>\( \sin^{2}x+\cos^{2}x=1 \)</span>, so <span>\( 1-\cos^{2}x=\sin^{2}x \)</span> and <span>\( 1-\sin^{2}x=\cos^{2}x \)</span>.'
      - 'It works only with squares: <span>\( \sin x+\cos x \)</span> is not 1.'
    -
      - 'Rename and finish'
      - 'Turn <span>\( \tfrac{1}{\cos x} \)</span> back into <span>\( \sec x \)</span>, <span>\( \tfrac{\cos x}{\sin x} \)</span> into <span>\( \cot x \)</span>, and so on, to match the other side.'
      - 'Work on one side only. Do not move terms across the equals sign or do the same thing to both sides.'
  note: 'CheckIt''s TE2 problems have no answer key: you write the verification. A good one starts with one side, lists each step on its own line, and ends with the other side. CheckIt may write a side in mixed form, like <span>\( \sec(x)-\tfrac{\cos(x)}{\sin(x)} \)</span>, or with a power after the parentheses, like <span>\( \sin(x)^{2} \)</span> for <span>\( \sin^{2}x \)</span>. Plugging in a number can show that an equation is <em>not</em> an identity, but it can never prove that one is. Your CheckIt identities will be different from these examples. The moves are what transfer.'
tabs:
  - id: rewrite
    label: "Try It: Rewrite It"
    heading: "Try It: Rewrite It"
    intro: |-
      Every verification starts here. Rewrite each product in sines and cosines, simplify, and name the result. Make your best guess on each one, then check it.
    items:
      - id: rw1
        title: "Rewrite 1"
        table:
          caption: "The six trig functions written in terms of sine and cosine"
          label: "Trig functions in terms of sine and cosine"
          rows:
            - ["Function", "tan x", "cot x", "sec x", "csc x"]
            - ["In sine and cosine", "sin x / cos x", "cos x / sin x", "1 / cos x", "1 / sin x"]
        math:
          display: '\tan x\,\csc x'
          speak: "tangent x times cosecant x"
        prompt: 'Which single function equals this product?'
        choices:
          - {value: a, label: '\( \csc x \)', speak: "cosecant x"}
          - {value: b, label: '\( \sec x \)', speak: "secant x"}
          - {value: c, label: '\( \dfrac{\sin^{2}x}{\cos x} \)', speak: "sine squared x, over cosine x"}
          - {value: d, label: '\( \cot x \)', speak: "cotangent x"}
        correct: b
        explanation: |-
          \( \tan x\csc x=\tfrac{\sin x}{\cos x}\cdot\tfrac{1}{\sin x}=\tfrac{1}{\cos x}=\sec x \). The sines cancel because they multiply. The answer \( \tfrac{\sin^{2}x}{\cos x} \) uses \( \csc x=\sin x \), and \( \csc x \) comes from canceling the cosine instead of the sine. <strong>\( \tan x\csc x=\sec x \).</strong>
      - id: rw2
        title: "Rewrite 2"
        math:
          display: '\sec x\,\csc x'
          speak: "secant x times cosecant x"
        prompt: 'Which expression equals this product?'
        choices:
          - {value: a, label: '\( \sin x\cos x \)', speak: "sine x times cosine x"}
          - {value: b, label: '\( \dfrac{1}{\sin x+\cos x} \)', speak: "1 over the quantity sine x plus cosine x"}
          - {value: c, label: '\( \dfrac{1}{\sin x\cos x} \)', speak: "1 over sine x times cosine x"}
          - {value: d, label: '\( \dfrac{\cos x}{\sin x} \)', speak: "cosine x over sine x"}
        correct: c
        explanation: |-
          \( \sec x\csc x=\tfrac{1}{\cos x}\cdot\tfrac{1}{\sin x}=\tfrac{1}{\sin x\cos x} \). Multiplying fractions multiplies the denominators; it does not add them. The answer \( \sin x\cos x \) forgets that these are reciprocals. <strong>\( \sec x\csc x=\tfrac{1}{\sin x\cos x} \).</strong> This product shows up in many CheckIt identities.
      - id: rw3
        title: "Rewrite 3"
        math:
          display: '\cot x\,\sec x'
          speak: "cotangent x times secant x"
        prompt: 'Which single function equals this product?'
        choices:
          - {value: a, label: '\( \csc x \)', speak: "cosecant x"}
          - {value: b, label: '\( \sec x \)', speak: "secant x"}
          - {value: c, label: '\( \dfrac{\cos^{2}x}{\sin x} \)', speak: "cosine squared x, over sine x"}
          - {value: d, label: '\( \tan x \)', speak: "tangent x"}
        correct: a
        explanation: |-
          \( \cot x\sec x=\tfrac{\cos x}{\sin x}\cdot\tfrac{1}{\cos x}=\tfrac{1}{\sin x}=\csc x \). The answer \( \tfrac{\cos^{2}x}{\sin x} \) uses \( \sec x=\cos x \), and \( \tan x \) flips the cotangent instead of simplifying. <strong>\( \cot x\sec x=\csc x \).</strong>
      - id: rw4
        title: "Rewrite 4"
        math:
          display: '\dfrac{\tan x}{\sec x}'
          speak: "tangent x over secant x"
        prompt: 'Which single function equals this quotient?'
        choices:
          - {value: a, label: '\( \cos x \)', speak: "cosine x"}
          - {value: b, label: '\( \dfrac{\sin x}{\cos^{2}x} \)', speak: "sine x over cosine squared x"}
          - {value: c, label: '\( 1 \)', speak: "1"}
          - {value: d, label: '\( \sin x \)', speak: "sine x"}
        correct: d
        explanation: |-
          Dividing by \( \sec x=\tfrac{1}{\cos x} \) is the same as multiplying by \( \cos x \): \( \tfrac{\sin x}{\cos x}\cdot\cos x=\sin x \). The answer \( \tfrac{\sin x}{\cos^{2}x} \) multiplies by \( \sec x \) instead of dividing. <strong>\( \tfrac{\tan x}{\sec x}=\sin x \).</strong>
  - id: distribute
    label: "Try It: Distribute and Simplify"
    heading: "Try It: Distribute and Simplify"
    intro: |-
      These look like the left sides of CheckIt identities. Distribute, simplify each term, and find the matching right side. Make your best guess, then check it.
    items:
      - id: ds1
        title: "Simplify 1"
        math:
          display: '\tan x\,(\sin x+\cos x)'
          speak: "tangent x times the quantity sine x plus cosine x"
        prompt: 'Which expression equals this one?'
        choices:
          - {value: a, label: '\( \dfrac{\sin^{2}x}{\cos x}+\sin x \)', speak: "sine squared x over cosine x, plus sine x"}
          - {value: b, label: '\( \sin^{2}x+\sin x \)', speak: "sine squared x, plus sine x"}
          - {value: c, label: '\( \dfrac{\sin^{2}x}{\cos x}+1 \)', speak: "sine squared x over cosine x, plus 1"}
          - {value: d, label: '\( \dfrac{\sin x}{\cos x}\cdot\sin x+\cos x \)', speak: "sine x over cosine x, times sine x, plus cosine x"}
        correct: a
        explanation: |-
          Distribute: \( \tan x\sin x+\tan x\cos x=\tfrac{\sin^{2}x}{\cos x}+\tfrac{\sin x}{\cos x}\cdot\cos x=\tfrac{\sin^{2}x}{\cos x}+\sin x \). CheckIt might write the first term as \( \sec(x)\sin(x)^{2} \), which is the same thing. The answer \( \sin^{2}x+\sin x \) drops a denominator, \( +1 \) says \( \tan x\cos x=1 \), and the last one multiplies only the first term. <strong>\( \tfrac{\sin^{2}x}{\cos x}+\sin x \).</strong>
      - id: ds2
        title: "Simplify 2"
        math:
          display: '\csc x\,(\tan x-\cos x)'
          speak: "cosecant x times the quantity tangent x minus cosine x"
        prompt: 'Which expression equals this one?'
        choices:
          - {value: a, label: '\( \sec x+\cot x \)', speak: "secant x plus cotangent x"}
          - {value: b, label: '\( \sec x-1 \)', speak: "secant x minus 1"}
          - {value: c, label: '\( \sec x-\cot x \)', speak: "secant x minus cotangent x"}
          - {value: d, label: '\( \csc x\tan x-\cos x \)', speak: "cosecant x tangent x, minus cosine x"}
        correct: c
        explanation: |-
          \( \csc x\tan x-\csc x\cos x=\tfrac{1}{\sin x}\cdot\tfrac{\sin x}{\cos x}-\tfrac{1}{\sin x}\cdot\cos x=\tfrac{1}{\cos x}-\tfrac{\cos x}{\sin x}=\sec x-\cot x \). CheckIt might leave the second term as \( \tfrac{\cos(x)}{\sin(x)} \). The answer \( \sec x-1 \) says \( \csc x\cos x=1 \), the plus version loses the minus sign, and the last one multiplies only the first term. <strong>\( \sec x-\cot x \).</strong>
      - id: ds3
        title: "Simplify 3"
        math:
          display: '(\sin x+\cos x)\sec x\,\csc x'
          speak: "the quantity sine x plus cosine x, times secant x times cosecant x"
        prompt: 'Which expression equals this one?'
        choices:
          - {value: a, label: '\( \tan x+\cot x \)', speak: "tangent x plus cotangent x"}
          - {value: b, label: '\( \sec x+\csc x \)', speak: "secant x plus cosecant x"}
          - {value: c, label: '\( 2 \)', speak: "2"}
          - {value: d, label: '\( \sin x\sec x+\cos x \)', speak: "sine x secant x, plus cosine x"}
        correct: b
        explanation: |-
          \( \sec x\csc x=\tfrac{1}{\sin x\cos x} \), so the expression is \( \tfrac{\sin x+\cos x}{\sin x\cos x}=\tfrac{\sin x}{\sin x\cos x}+\tfrac{\cos x}{\sin x\cos x}=\tfrac{1}{\cos x}+\tfrac{1}{\sin x} \). Split the fraction into two, then each one simplifies. The answer \( \tan x+\cot x \) keeps the wrong function on top, and 2 assumes everything cancels. <strong>\( \sec x+\csc x \).</strong>
      - id: ds4
        title: "Simplify 4"
        math:
          display: '(\tan x-\cot x)\sec x\,\csc x'
          speak: "the quantity tangent x minus cotangent x, times secant x times cosecant x"
        prompt: 'Which expression equals this one?'
        choices:
          - {value: a, label: '\( \sec x-\csc x \)', speak: "secant x minus cosecant x"}
          - {value: b, label: '\( \csc^{2}x-\sec^{2}x \)', speak: "cosecant squared x, minus secant squared x"}
          - {value: c, label: '\( \tan^{2}x-\cot^{2}x \)', speak: "tangent squared x, minus cotangent squared x"}
          - {value: d, label: '\( \sec^{2}x-\csc^{2}x \)', speak: "secant squared x, minus cosecant squared x"}
        correct: d
        explanation: |-
          Multiply each term by \( \tfrac{1}{\sin x\cos x} \): \( \tfrac{\sin x}{\cos x}\cdot\tfrac{1}{\sin x\cos x}=\tfrac{1}{\cos^{2}x} \) and \( \tfrac{\cos x}{\sin x}\cdot\tfrac{1}{\sin x\cos x}=\tfrac{1}{\sin^{2}x} \). So the expression is \( \sec^{2}x-\csc^{2}x \). The first choice loses the squares, the second reverses the order, and \( \tan^{2}x-\cot^{2}x \) is a different expression: try \( x=\tfrac{\pi}{6} \). <strong>\( \sec^{2}x-\csc^{2}x \).</strong>
  - id: proof
    label: "Try It: Build the Proof"
    heading: "Try It: Build the Proof"
    intro: |-
      A verification is a chain: each line equals the one before it. Find the missing link, or spot the equation that is not true. Make your best guess, then check it.
    items:
      - id: pf1
        title: "Proof 1"
        figure:
          file: figures/TE2/pf1.svg
          title: "The usual route through a verification"
          caption: 'A flowchart with five numbered steps from top to bottom: 1, start with one side; 2, rewrite in sin and cos; 3, distribute, combine, simplify; 4, use sin squared plus cos squared equals 1 if needed; 5, rename to reach the other side. A box at the bottom says: work on one side only, never move terms across the equals sign.'
        math:
          display: '\begin{aligned} &\cot x\,(\sin x-\sec x)\\ &=\dfrac{\cos x}{\sin x}\left(\sin x-\dfrac{1}{\cos x}\right)\\ &=\ ?\\ &=\cos x-\csc x \end{aligned}'
          speak: "cotangent x times the quantity sine x minus secant x. Next line: equals cosine x over sine x, times the quantity sine x minus 1 over cosine x. Next line: equals a missing step. Next line: equals cosine x minus cosecant x"
        prompt: 'Which line fills the missing step?'
        choices:
          - {value: a, label: '\( \cos x-\dfrac{1}{\cos x} \)', speak: "cosine x minus 1 over cosine x"}
          - {value: b, label: '\( 1-\dfrac{1}{\sin x} \)', speak: "1 minus 1 over sine x"}
          - {value: c, label: '\( \cos x-\cot x \)', speak: "cosine x minus cotangent x"}
          - {value: d, label: '\( \cos x-\dfrac{1}{\sin x} \)', speak: "cosine x minus 1 over sine x"}
        correct: d
        explanation: |-
          Distribute: \( \tfrac{\cos x}{\sin x}\cdot\sin x=\cos x \), and \( \tfrac{\cos x}{\sin x}\cdot\tfrac{1}{\cos x}=\tfrac{1}{\sin x} \). That gives \( \cos x-\tfrac{1}{\sin x} \), and renaming \( \tfrac{1}{\sin x}=\csc x \) finishes. The answer \( \cos x-\tfrac{1}{\cos x} \) cancels the wrong factor, and \( 1-\tfrac{1}{\sin x} \) says \( \cot x\sin x=1 \). <strong>\( \cos x-\tfrac{1}{\sin x} \).</strong>
      - id: pf2
        title: "Proof 2"
        math:
          display: '\begin{aligned} &\sec x-\cos x\\ &=\dfrac{1}{\cos x}-\dfrac{\cos^{2}x}{\cos x}\\ &=\dfrac{1-\cos^{2}x}{\cos x}\\ &=\ ?\\ &=\sin x\cdot\dfrac{\sin x}{\cos x}\\ &=\sin x\tan x \end{aligned}'
          speak: "secant x minus cosine x equals 1 over cosine x, minus cosine squared x over cosine x, which equals 1 minus cosine squared x, all over cosine x. Next line: equals a missing step. Next line: equals sine x times sine x over cosine x, which equals sine x tangent x"
        prompt: 'Which line fills the missing step?'
        choices:
          - {value: a, label: '\( \dfrac{\sin x}{\cos x} \)', speak: "sine x over cosine x"}
          - {value: b, label: '\( \dfrac{\sin^{2}x}{\cos x} \)', speak: "sine squared x over cosine x"}
          - {value: c, label: '\( \dfrac{\cos^{2}x}{\cos x} \)', speak: "cosine squared x over cosine x"}
          - {value: d, label: '\( \dfrac{1}{\cos x}-1 \)', speak: "1 over cosine x, minus 1"}
        correct: b
        explanation: |-
          By the Pythagorean identity, \( 1-\cos^{2}x=\sin^{2}x \), so the fraction is \( \tfrac{\sin^{2}x}{\cos x} \). Splitting \( \sin^{2}x \) into \( \sin x\cdot\sin x \) gives the next line. The answer \( \tfrac{\sin x}{\cos x} \) loses the square, \( \tfrac{\cos^{2}x}{\cos x} \) uses the wrong half of the identity, and \( \tfrac{1}{\cos x}-1 \) cancels the cosine out of part of a difference. <strong>\( \tfrac{\sin^{2}x}{\cos x} \).</strong>
      - id: pf3
        title: "Proof 3"
        math:
          display: '\begin{aligned} &\tan x+\cot x\\ &=\dfrac{\sin x}{\cos x}+\dfrac{\cos x}{\sin x}\\ &=\ ?\\ &=\dfrac{1}{\sin x\cos x}\\ &=\sec x\,\csc x \end{aligned}'
          speak: "tangent x plus cotangent x equals sine x over cosine x, plus cosine x over sine x. Next line: equals a missing step. Next line: equals 1 over sine x cosine x, which equals secant x cosecant x"
        prompt: 'Which line fills the missing step?'
        choices:
          - {value: a, label: '\( \dfrac{\sin x+\cos x}{\sin x\cos x} \)', speak: "sine x plus cosine x, all over sine x cosine x"}
          - {value: b, label: '\( \dfrac{\sin^{2}x+\cos^{2}x}{\sin x+\cos x} \)', speak: "sine squared x plus cosine squared x, all over the quantity sine x plus cosine x"}
          - {value: c, label: '\( \dfrac{\sin^{2}x+\cos^{2}x}{\sin x\cos x} \)', speak: "sine squared x plus cosine squared x, all over sine x cosine x"}
          - {value: d, label: '\( \dfrac{\sin x\cos x}{\sin x\cos x} \)', speak: "sine x cosine x over sine x cosine x"}
        correct: c
        explanation: |-
          The common denominator is \( \sin x\cos x \). Multiply the first fraction by \( \tfrac{\sin x}{\sin x} \) and the second by \( \tfrac{\cos x}{\cos x} \): \( \tfrac{\sin^{2}x+\cos^{2}x}{\sin x\cos x} \). The top is 1, which gives the next line. The first choice adds the tops without rewriting them, and the second adds the bottoms. <strong>\( \tfrac{\sin^{2}x+\cos^{2}x}{\sin x\cos x} \).</strong>
      - id: pf4
        title: "Proof 4"
        prompt: 'Three of these equations are true for every \( x \) where both sides are defined. Which one is not? Testing the value above can help, or rewrite each one in sines and cosines.'
        math:
          display: 'x=\dfrac{\pi}{6}'
          speak: "a value to test: x equals pi over 6"
        choices:
          - {value: a, label: '\( \sin x\sec x=\tan x \)', speak: "sine x secant x equals tangent x"}
          - {value: b, label: '\( \tan x\cos x=\cos x \)', speak: "tangent x cosine x equals cosine x"}
          - {value: c, label: '\( \cos x\csc x=\cot x \)', speak: "cosine x cosecant x equals cotangent x"}
          - {value: d, label: '\( \sec x\cot x=\csc x \)', speak: "secant x cotangent x equals cosecant x"}
        correct: b
        explanation: |-
          \( \tan x\cos x=\tfrac{\sin x}{\cos x}\cdot\cos x=\sin x \), which is not \( \cos x \). At \( x=\tfrac{\pi}{6} \), the left side is \( \tfrac{1}{2} \) and the right side is \( \tfrac{\sqrt{3}}{2} \). Careful: at \( x=\tfrac{\pi}{4} \) both sides are \( \tfrac{\sqrt{2}}{2} \), so one lucky value proves nothing. A number can show an equation is false; only a verification shows it is true. The other three check out in sines and cosines. <strong>\( \tan x\cos x=\cos x \) is the false one.</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\dfrac{\sin x+\cos x}{\sin x}=\cos x'
          speak: "sine x plus cosine x, all over sine x, equals cosine x"
        prompt: 'A student simplified this fraction by crossing out \( \sin x \) on the top and the bottom. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "It should be 1 + cos x, keeping the 1 from sin x over sin x."}
          - {value: c, label: "Only part of the top is sin x, so it is 1 + cot x."}
          - {value: d, label: "The cos x should be crossed out instead, leaving sin x."}
        correct: c
        explanation: |-
          Only a factor of the whole top can be crossed out. Split the fraction instead: \( \tfrac{\sin x}{\sin x}+\tfrac{\cos x}{\sin x}=1+\cot x \). Check at \( x=\tfrac{\pi}{4} \): the fraction is 2, but \( \cos\tfrac{\pi}{4}\approx 0.707 \). <strong>It equals \( 1+\cot x \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: '\begin{aligned} &(\cos x-\sin x)\sec x\,\csc x\\ &=\dfrac{\cos x-\sin x}{\sin x\cos x}\\ &=\dfrac{1}{\sin x}-\dfrac{1}{\cos x}\\ &=\csc x-\sec x \end{aligned}'
          speak: "the quantity cosine x minus sine x, times secant x cosecant x, equals cosine x minus sine x, all over sine x cosine x. Next line: equals 1 over sine x, minus 1 over cosine x. Next line: equals cosecant x minus secant x"
        prompt: 'A student verified this identity. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The last line should be sec x − csc x."}
          - {value: c, label: "The first fraction cannot be split into two."}
          - {value: d, label: "sec x csc x should be sin x cos x, so it is cos²x − sin²x."}
        correct: a
        explanation: |-
          \( \sec x\csc x=\tfrac{1}{\sin x\cos x} \). Splitting gives \( \tfrac{\cos x}{\sin x\cos x}-\tfrac{\sin x}{\sin x\cos x}=\tfrac{1}{\sin x}-\tfrac{1}{\cos x} \), and renaming gives \( \csc x-\sec x \). Each line equals the one before, starting from one side and ending at the other. <strong>There is no mistake.</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} \sec x-\cos x&=\sin x\tan x\\ 1-\cos^{2}x&=\sin^{2}x\\ \sin^{2}x&=\sin^{2}x \end{aligned}'
          speak: "secant x minus cosine x equals sine x tangent x. Next line: 1 minus cosine squared x equals sine squared x. Next line: sine squared x equals sine squared x"
        prompt: 'To verify \( \sec x-\cos x=\sin x\tan x \), a student multiplied both sides by \( \cos x \) and simplified. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake; both sides match."}
          - {value: b, label: "It should multiply both sides by sec x, not by cos x."}
          - {value: c, label: "1 − cos²x is cos²x, not sin²x."}
          - {value: d, label: "It works on both sides at once, not one side."}
        correct: d
        explanation: |-
          A verification may not treat the identity as an equation to solve: multiplying both sides assumes what you are trying to show. Work on one side only: \( \sec x-\cos x=\tfrac{1-\cos^{2}x}{\cos x}=\tfrac{\sin^{2}x}{\cos x}=\sin x\tan x \). The algebra here happened to be right, but the method would not be accepted. <strong>Work on one side only.</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: '\begin{aligned} &-\sec x\,(\cos x-\cot x)\\ &=-1-\csc x \end{aligned}'
          speak: "negative secant x times the quantity cosine x minus cotangent x, equals negative 1 minus cosecant x"
        prompt: 'A student distributed and simplified this expression. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The minus multiplies both terms, so it is −1 + csc x."}
          - {value: c, label: "sec x times cos x is 0, so the answer is just −csc x."}
