        explanation: |-
          \( -\sec x\cos x=-1 \), and \( -\sec x\cdot(-\cot x)=+\tfrac{1}{\cos x}\cdot\tfrac{\cos x}{\sin x}=+\csc x \). The negative in front changes the sign of every term inside. <strong>It equals \( -1+\csc x \).</strong>
