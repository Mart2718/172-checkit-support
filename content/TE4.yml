# TE4 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt TE4: triangle ABC with C = 90 degrees. Given one acute angle and one side, or two sides; find the rest.
# Sides round to the nearest tenth or whole number, angles to the nearest degree or tenth of a degree.
# CheckIt always says "Solve the triangle": find every missing side and angle. Whole-number sides come with angles to the tenth of a degree;
# whole-degree angles come with sides to the nearest tenth.
# Labels follow the standard convention: side a is across from angle A, b across from B, c (the hypotenuse) across from C.
# Known CheckIt issue: when it gives a whole-degree angle, its answer key computes a = c cos A and b = c sin A (generator lines 19-20),
# so it lists a and b the other way around from this convention. Its whole-number-sides problems follow the convention.
# Figure drawn by tools/figures/make_te4.py.
code: TE4
h1: "TE4 Support: Solving Right Triangles"
pageTitle: "TE4 Support: Solving Right Triangles — Math 172, Santa Ana College"
hubSummary: "Solving right triangles with sine, cosine, tangent, and the Pythagorean Theorem"
videoIntro: "A narrated walkthrough of solving right triangles: labeling the sides, choosing sine, cosine, or tangent, using the Pythagorean Theorem, and finding angles with inverse trig."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'opposite|adjacent|hypotenuse|across from|SOH|\bsine\b|cosine|tangent'
worked:   # used for the worked-examples recording document
  title: "TE4 Worked Examples: Solving Right Triangles"
  coreQuestion: "Which sides and angles do I know, and which tool connects them to what I want?"
  coreFollowup: "Label first: side a is across from angle A, side b across from B, and c, the hypotenuse, across from the right angle. With two sides, use the Pythagorean Theorem for the third side and inverse trig for an angle. With an angle and a side, choose sine, cosine, or tangent by which sides are involved. The two acute angles add to 90 degrees. Keep the calculator in degree mode, and round only at the end."
summary:   # the Quick Summary tab
  intro: 'Every TE4 problem comes back to one idea: <strong>label the triangle, then pick the tool that connects what you know to what you want.</strong> Angle <span>\( C \)</span> is the right angle. Side <span>\( a \)</span> is across from angle <span>\( A \)</span>, side <span>\( b \)</span> is across from <span>\( B \)</span>, and side <span>\( c \)</span>, the hypotenuse, is across from <span>\( C \)</span>.'
  caption: "Which tool to use for each kind of right-triangle question"
  columns: ["You know", "Tool", "Example with angle A"]
  rows:     # first cell of each row is the row header
    -
      - 'An angle and a side, and you want another side'
      - 'Sine, cosine, or tangent. Sine is opposite over hypotenuse, cosine is adjacent over hypotenuse, and tangent is opposite over adjacent.'
      - '<span>\( \sin A=\dfrac{a}{c} \)</span>, <span>\( \cos A=\dfrac{b}{c} \)</span>, <span>\( \tan A=\dfrac{a}{b} \)</span>'
    -
      - 'Two sides, and you want the third side'
      - 'The Pythagorean Theorem. The hypotenuse is always the longest side.'
      - '<span>\( a^{2}+b^{2}=c^{2} \)</span>. To find a leg, subtract: <span>\( b^{2}=c^{2}-a^{2} \)</span>.'
    -
      - 'Two sides, and you want an angle'
      - 'Inverse trig: build the ratio, then use the inverse function on the calculator.'
      - '<span>\( A=\tan^{-1}\left(\dfrac{a}{b}\right) \)</span>'
    -
      - 'One acute angle, and you want the other'
      - 'The two acute angles add to 90°.'
      - '<span>\( B=90^\circ-A \)</span>'
  note: 'Set your calculator to <strong>degree mode</strong>. In radian mode, <span>\( \sin 30^\circ \)</span> comes out about <span>\( -0.99 \)</span> instead of <span>\( 0.5 \)</span>. CheckIt asks you to <strong>solve the triangle</strong>: find every missing side and angle, including the other acute angle. Keep full calculator precision until the end, then round the way it asks: sides to the nearest tenth or whole number, angles to the nearest degree or tenth of a degree. Heads-up: when CheckIt gives you a whole-degree angle, its answer key currently lists sides <span>\( a \)</span> and <span>\( b \)</span> the other way around from the labels used here. If your values match with <span>\( a \)</span> and <span>\( b \)</span> swapped, that is the reason; ask your instructor. A quick check: the hypotenuse must be the longest side, and the larger angle sits across from the longer leg. Your CheckIt triangle will have different numbers than these examples. The reasoning is what transfers.'
tabs:
  - id: label
    label: "Try It: Label the Triangle"
    heading: "Try It: Label the Triangle"
    intro: |-
      Every right-triangle problem starts with labels. Make your best guess on each one, then check it. All four questions use the triangle in the picture.
    items:
      - id: lb1
        title: "Label 1"
        figure:
          file: figures/TE4/triangle.svg
          title: "A right triangle with vertices A, B, and C and sides labeled a, b, and c"
          caption: 'A right triangle. Vertex A is at the bottom left, C at the bottom right, and B at the top right. A small square marks the corner at C, so the angle at C is 90°. Side b is the bottom side, joining A and C. Side a is the vertical side, joining C and B. Side c is the slanted side, joining A and B.'
        prompt: 'Which side is the hypotenuse?'
        choices:
          - {value: a, label: "Side a"}
          - {value: b, label: "Side b"}
          - {value: c, label: "Side c"}
          - {value: d, label: "It changes depending on angle A."}
        correct: c
        explanation: |-
          The hypotenuse is the side across from the right angle. The right angle is at \( C \), and the side that does not touch \( C \) is \( c \), joining \( A \) and \( B \). It is always the longest side. Sides \( a \) and \( b \) are the legs, the two sides that meet at the right angle; and the hypotenuse never changes with angle \( A \), because it is fixed by the right angle. <strong>The hypotenuse is \( c \).</strong>
      - id: lb2
        title: "Label 2"
        figure:
          file: figures/TE4/triangle.svg
          title: "A right triangle with vertices A, B, and C and sides labeled a, b, and c"
          caption: 'A right triangle. Vertex A is at the bottom left, C at the bottom right, and B at the top right. A small square marks the corner at C, so the angle at C is 90°. Side b is the bottom side, joining A and C. Side a is the vertical side, joining C and B. Side c is the slanted side, joining A and B.'
        prompt: 'Which side is the opposite side for angle \( A \)?'
        choices:
          - {value: a, label: "Side b"}
          - {value: b, label: "Side c"}
          - {value: c, label: "Side a"}
          - {value: d, label: "Angle A has no opposite side."}
        correct: c
        explanation: |-
          The opposite side for \( A \) is the side that does not touch \( A \): side \( a \), joining \( B \) and \( C \). Side \( b \) touches \( A \), so it is the adjacent side, and \( c \) is the hypotenuse. That is why the lowercase letter matches: side \( a \) is across from angle \( A \). Every acute angle has an opposite side. <strong>The opposite side for angle \( A \) is \( a \).</strong>
      - id: lb3
        title: "Label 3"
        figure:
          file: figures/TE4/triangle.svg
          title: "A right triangle with vertices A, B, and C and sides labeled a, b, and c"
          caption: 'A right triangle. Vertex A is at the bottom left, C at the bottom right, and B at the top right. A small square marks the corner at C, so the angle at C is 90°. Side b is the bottom side, joining A and C. Side a is the vertical side, joining C and B. Side c is the slanted side, joining A and B.'
        prompt: 'Which ratio equals \( \sin A \)?'
        choices:
          - {value: a, label: '\( \dfrac{b}{c} \)', speak: "the fraction b, over c, end fraction"}
          - {value: b, label: '\( \dfrac{a}{b} \)', speak: "the fraction a, over b, end fraction"}
          - {value: c, label: '\( \dfrac{c}{a} \)', speak: "the fraction c, over a, end fraction"}
          - {value: d, label: '\( \dfrac{a}{c} \)', speak: "the fraction a, over c, end fraction"}
        correct: d
        explanation: |-
          Sine is opposite over hypotenuse. For angle \( A \), the opposite side is \( a \) and the hypotenuse is \( c \). The ratio \( \tfrac{b}{c} \) is \( \cos A \); \( \tfrac{a}{b} \) is \( \tan A \); and \( \tfrac{c}{a} \) is upside down, the reciprocal of \( \sin A \). <strong>\( \sin A=\tfrac{a}{c} \).</strong>
      - id: lb4
        title: "Label 4"
        math:
          display: 'C=90^\circ,\quad A=50^\circ,\quad c=8'
          speak: "angle C equals 90 degrees. angle A equals 50 degrees. side c equals 8"
        prompt: 'Which equation finds side \( a \)?'
        choices:
          - {value: a, label: '\( a=8\sin 50^\circ \)', speak: "a equals 8 times sine of 50 degrees"}
          - {value: b, label: '\( a=8\cos 50^\circ \)', speak: "a equals 8 times cosine of 50 degrees"}
          - {value: c, label: '\( a=\dfrac{8}{\sin 50^\circ} \)', speak: "a equals the fraction 8, over sine of 50 degrees, end fraction"}
          - {value: d, label: '\( a=8\tan 50^\circ \)', speak: "a equals 8 times tangent of 50 degrees"}
        correct: a
        explanation: |-
          Side \( a \) is opposite angle \( A \), and \( c=8 \) is the hypotenuse. Opposite and hypotenuse means sine: \( \sin 50^\circ=\tfrac{a}{8} \). Multiply both sides by 8. Cosine would find \( b \), the adjacent side; dividing by \( \sin 50^\circ \) is for when the hypotenuse is the unknown; and tangent pairs the opposite side with the adjacent side, not the hypotenuse. <strong>\( a=8\sin 50^\circ \).</strong>
  - id: angle
    label: "Try It: An Angle and a Side"
    heading: "Try It: An Angle and a Side"
    intro: |-
      Each triangle has its right angle at C and is labeled the way the Quick Summary shows. Make your best guess, then check it. Use degree mode, and round the way each question asks.
    items:
      - id: as1
        title: "Solve the Triangle"
        figure:
          file: figures/TE4/as1.svg
          title: "A right triangle marked with angle A = 35°, c = 12, and a, b and B unknown"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Angle A is marked 35°. Side c is marked 12. Sides a and b and angle B are marked with question marks.'
        math:
          display: 'C=90^\circ,\quad A=35^\circ,\quad c=12'
          speak: "angle C equals 90 degrees. angle A equals 35 degrees. side c equals 12"
        prompt: 'Like CheckIt, solve the triangle: find every missing part, with sides to the nearest tenth. Which is the complete solution?'
        choices:
          - {value: a, label: "B = 55°, a ≈ 9.8, b ≈ 6.9"}
          - {value: b, label: "B = 55°, a ≈ 6.9, b ≈ 9.8"}
          - {value: c, label: "B = 145°, a ≈ 6.9, b ≈ 9.8"}
          - {value: d, label: "B = 55°, a ≈ −5.1, b ≈ −10.8"}
        correct: b
        explanation: |-
          The acute angles add to 90°: \( B=90^\circ-35^\circ=55^\circ \). Side \( a \) is opposite \( A \), so use sine: \( a=12\sin 35^\circ\approx 6.88 \). Side \( b \) is adjacent to \( A \), so use cosine: \( b=12\cos 35^\circ\approx 9.83 \). Check: \( 6.9^{2}+9.8^{2}\approx 144=12^{2} \). The first list swaps \( a \) and \( b \) (CheckIt's own answer key can do this too; see the Quick Summary); \( 145^\circ \) subtracts from 180°, forgetting that the right angle already uses 90°; and the negative sides come from a calculator in radian mode. <strong>\( B=55^\circ \), \( a\approx 6.9 \), \( b\approx 9.8 \).</strong>
      - id: as2
        title: "Angle and Side 2"
        figure:
          file: figures/TE4/as2.svg
          title: "A right triangle marked with angle B = 62°, a = 7, and b = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Angle B is marked 62°. Side a is marked 7. Side b is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad B=62^\circ,\quad a=7'
          speak: "angle C equals 90 degrees. angle B equals 62 degrees. side a equals 7"
        prompt: 'Find side \( b \).'
        choices:
          - {value: a, label: "about 3.7"}
          - {value: b, label: "about 6.2"}
          - {value: c, label: "about 14.9"}
          - {value: d, label: "about 13.2"}
        correct: d
        explanation: |-
          This time the angle is \( B \). Side \( b \) is opposite \( B \), and side \( a \) touches \( B \), so it is adjacent. Opposite and adjacent means tangent: \( \tan 62^\circ=\tfrac{b}{7} \), so \( b=7\tan 62^\circ\approx 13.17 \). The answer 3.7 uses angle \( A=28^\circ \) instead, \( 7\tan 28^\circ \); 6.2 is \( 7\sin 62^\circ \), which treats side \( a \) as the hypotenuse; and 14.9 is the hypotenuse \( c \). <strong>\( b\approx 13.2 \).</strong>
      - id: as3
        title: "Angle and Side 3"
        figure:
          file: figures/TE4/as3.svg
          title: "A right triangle marked with angle A = 20°, b = 15, and c = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Angle A is marked 20°. Side b is marked 15. Side c is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad A=20^\circ,\quad b=15'
          speak: "angle C equals 90 degrees. angle A equals 20 degrees. side b equals 15"
        prompt: 'Find side \( c \).'
        choices:
          - {value: a, label: "about 16.0"}
          - {value: b, label: "about 14.1"}
          - {value: c, label: "about 43.9"}
          - {value: d, label: "about 5.1"}
        correct: a
        explanation: |-
          Side \( b \) is adjacent to \( A \), and \( c \) is the hypotenuse, so use cosine: \( \cos 20^\circ=\tfrac{15}{c} \). The unknown is on the bottom, so \( c=\tfrac{15}{\cos 20^\circ}\approx 15.96 \). The answer 14.1 multiplies instead of dividing, and it is shorter than \( b \), which cannot happen for a hypotenuse. The answer 43.9 divides by \( \sin 20^\circ \) instead of \( \cos 20^\circ \), and 5.1 is \( 15\sin 20^\circ \), which uses sine and multiplies. <strong>\( c\approx 16.0 \).</strong>
      - id: as4
        title: "Angle and Side 4"
        figure:
          file: figures/TE4/as4.svg
          title: "A right triangle marked with angle A = 28.1°, b = 15, and a = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Angle A is marked 28.1°. Side b is marked 15. Side a is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad A=28.1^\circ,\quad b=15'
          speak: "angle C equals 90 degrees. angle A equals 28.1 degrees. side b equals 15"
        prompt: 'Find side \( a \), to the nearest whole number.'
        choices:
          - {value: a, label: "7"}
          - {value: b, label: "8"}
          - {value: c, label: "28"}
          - {value: d, label: "13"}
        correct: b
        explanation: |-
          Side \( a \) is opposite \( A \) and \( b \) is adjacent, so use tangent: \( a=15\tan 28.1^\circ\approx 8.01 \), which rounds to 8. On CheckIt, an angle given to the tenth of a degree usually means the sides are whole numbers. 7 is \( 15\sin 28.1^\circ \), which treats \( b \) as the hypotenuse; 28 is \( \tfrac{15}{\tan 28.1^\circ} \), dividing instead of multiplying; and 13 is \( 15\cos 28.1^\circ \). <strong>\( a=8 \).</strong>
  - id: sides
    label: "Try It: Two Sides"
    heading: "Try It: Two Sides"
    intro: |-
      Each triangle has its right angle at C. Make your best guess, then check it. Ask yourself: is the side you want the hypotenuse, or a leg?
    items:
      - id: ts1
        title: "Two Sides 1"
        figure:
          file: figures/TE4/ts1.svg
          title: "A right triangle marked with a = 6.9, c = 12, and angle A = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Side a is marked 6.9 and side c is marked 12. Angle A is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad a=6.9,\quad c=12'
          speak: "angle C equals 90 degrees. side a equals 6.9. side c equals 12"
        prompt: 'Find angle \( A \), to the nearest degree.'
        choices:
          - {value: a, label: "55°"}
          - {value: b, label: "30°"}
          - {value: c, label: "35°"}
          - {value: d, label: "0.6°"}
        correct: c
        explanation: |-
          Side \( a \) is opposite \( A \), and \( c \) is the hypotenuse, so \( \sin A=\tfrac{6.9}{12} \). Use inverse sine: \( A=\sin^{-1}\left(\tfrac{6.9}{12}\right)\approx 35.1^\circ \), which rounds to 35°. On CheckIt, decimal sides like 6.9 usually come with angles to the nearest degree. 55° uses inverse cosine, which gives angle \( B \); 30° uses inverse tangent, but 12 is the hypotenuse, not the adjacent side; and 0.6 is the angle in radians, from radian mode. <strong>\( A\approx 35^\circ \).</strong>
      - id: ts2
        title: "Two Sides 2"
        figure:
          file: figures/TE4/ts2.svg
          title: "A right triangle marked with a = 20, c = 29, and b = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Side a is marked 20 and side c is marked 29. Side b is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad a=20,\quad c=29'
          speak: "angle C equals 90 degrees. side a equals 20. side c equals 29"
        prompt: 'Find side \( b \).'
        choices:
          - {value: a, label: "about 35.2"}
          - {value: b, label: "9"}
          - {value: c, label: "21"}
          - {value: d, label: "3"}
        correct: c
        explanation: |-
          Here \( c=29 \) is the hypotenuse, and \( b \) is a leg, so subtract: \( b^{2}=29^{2}-20^{2}=841-400=441 \), and \( b=21 \). The answer 35.2 adds the squares, which would make a leg longer than the hypotenuse. The answer 9 subtracts the sides without squaring, and 3 is \( \sqrt{29-20} \), which subtracts the sides before taking the root. <strong>\( b=21 \).</strong>
      - id: ts3
        title: "Two Sides 3"
        figure:
          file: figures/TE4/ts3.svg
          title: "A right triangle marked with a = 8, b = 15, and angle A = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Side a is marked 8 and side b is marked 15. Angle A is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad a=8,\quad b=15'
          speak: "angle C equals 90 degrees. side a equals 8. side b equals 15"
        prompt: 'Find angle \( A \), to the nearest tenth of a degree.'
        choices:
          - {value: a, label: "about 61.9°"}
          - {value: b, label: "about 0.5°"}
          - {value: c, label: "about 32.2°"}
          - {value: d, label: "about 28.1°"}
        correct: d
        explanation: |-
          For angle \( A \), side \( a=8 \) is opposite and \( b=15 \) is adjacent, so \( \tan A=\tfrac{8}{15} \). Use inverse tangent: \( A=\tan^{-1}\left(\tfrac{8}{15}\right)\approx 28.07^\circ \). The answer 61.9 is angle \( B \), from flipping the ratio. The answer 0.5 is the ratio itself, not an angle. The answer 32.2 is \( \sin^{-1}\left(\tfrac{8}{15}\right) \), which treats 15 as the hypotenuse. <strong>\( A\approx 28.1^\circ \).</strong>
      - id: ts4
        title: "Two Sides 4"
        figure:
          file: figures/TE4/ts4.svg
          title: "A right triangle marked with b = 24, c = 25, and angle A = ?"
          caption: 'Triangle ABC, not drawn to scale. Vertex A is at the bottom left, C at the bottom right, and B at the top right, with a square marking the 90° angle at C. Side b is the bottom side, side a is the vertical side, and side c is the slanted side. Side b is marked 24 and side c is marked 25. Angle A is marked with a question mark.'
        math:
          display: 'C=90^\circ,\quad b=24,\quad c=25'
          speak: "angle C equals 90 degrees. side b equals 24. side c equals 25"
        prompt: 'Find angle \( A \), to the nearest tenth of a degree.'
        choices:
          - {value: a, label: "about 16.3°"}
          - {value: b, label: "about 73.7°"}
          - {value: c, label: "about 43.8°"}
          - {value: d, label: "about 0.3°"}
        correct: a
        explanation: |-
          Side \( b \) is adjacent to \( A \), and \( c \) is the hypotenuse, so \( \cos A=\tfrac{24}{25} \) and \( A=\cos^{-1}\left(\tfrac{24}{25}\right)\approx 16.26^\circ \). The answer 73.7 uses inverse sine, which gives angle \( B \). The answer 43.8 uses inverse tangent with the hypotenuse. The answer 0.3 comes from radian mode. <strong>\( A\approx 16.3^\circ \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: 'a=10\sin 40^\circ\approx 6.4'
          speak: "a equals 10 times sine of 40 degrees, which is about 6.4"
        prompt: 'In a right triangle, \( C=90^\circ \), \( A=40^\circ \), and \( b=10 \). A student wrote this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Side b is a leg, so use tangent: about 8.4."}
          - {value: c, label: "It needs cosine instead, so a is about 7.7 here."}
          - {value: d, label: "Divide 10 by the sine of 40°, so a is about 15.6."}
        correct: b
        explanation: |-
          The 10 is side \( b \), the leg next to \( A \), not the hypotenuse. Opposite and adjacent means tangent: \( a=10\tan 40^\circ\approx 8.4 \). Cosine pairs the adjacent side with the hypotenuse, and so does sine with the opposite side, so neither works without \( c \): \( 10\cos 40^\circ\approx 7.7 \) and \( \tfrac{10}{\sin 40^\circ}\approx 15.6 \) both treat 10 as something it is not. <strong>The correct value is \( a\approx 8.4 \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: 'b=\sqrt{6^{2}+10^{2}}\approx 11.7'
          speak: "b equals the square root of the quantity 6 squared plus 10 squared, end quantity, which is about 11.7"
        prompt: 'In a right triangle, \( C=90^\circ \), \( a=6 \), and \( c=10 \). A student wrote this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "The 6 and 10 should be multiplied first: about 7.7."}
          - {value: c, label: "No square root was needed, so b is 136."}
          - {value: d, label: "Side c is the hypotenuse, so subtract: b is 8."}
        correct: d
        explanation: |-
          The hypotenuse is \( c=10 \), and it must be the longest side, so \( b \) cannot be 11.7. Subtract: \( b^{2}=10^{2}-6^{2}=64 \), and \( b=8 \). Multiplying gives \( \sqrt{60}\approx 7.7 \), which is not the Pythagorean Theorem; and 136 is \( b^{2} \) before taking the root, which is still the wrong sum. <strong>The correct value is \( b=8 \).</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} c&=13\\ A&=\tan^{-1}\left(\tfrac{5}{12}\right)\\ &\approx 22.6^\circ \end{aligned}'
          speak: "c equals 13. Next line: A equals inverse tangent of the fraction 5, over 12, end fraction. Next line: about 22.6 degrees"
        prompt: 'In a right triangle, \( C=90^\circ \), \( a=5 \), and \( b=12 \). A student wrote these lines. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "Angle A should use inverse sine of 5 over 12."}
          - {value: c, label: "The hypotenuse should be 17, from 5 plus 12."}
          - {value: d, label: "The ratio should be flipped to 12 over 5."}
        correct: a
        explanation: |-
