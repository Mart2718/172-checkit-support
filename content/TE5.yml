# TE5 content file. Edit the wording here; the shared template adds the layout and the accessibility markup.
# Fields marked (HTML) may use <strong>, <em> and math in backslash-paren ( ... ) or backslash-bracket [ ... ] delimiters.
# Every choice that contains math written in backslash-paren delimiters needs a "speak" line: the plain-words reading that screen readers announce.
# CheckIt TE5 gives three triangles: one for the law of cosines (three sides, or two sides and the angle between them),
# one for the law of sines (two angles and a side), and one with two sides and an angle not between them (one or two triangles).
# CheckIt asks students to say which law they used and why, and to show the check for a second triangle.
# Figures drawn by tools/figures/make_te5.py; every figure is labeled "not drawn to scale".
code: TE5
h1: "TE5 Support: The Law of Sines and the Law of Cosines"
pageTitle: "TE5 Support: The Law of Sines and the Law of Cosines — Math 172, Santa Ana College"
hubSummary: "Solving non-right triangles with the law of sines and the law of cosines, including the two-triangle case"
videoIntro: "A narrated walkthrough of solving non-right triangles: choosing the law of sines or the law of cosines, using each one, and checking for a second triangle."
# Phrases that must NOT appear in text shown before the student guesses (item titles, captions, table captions).
banPhrases: 'law of|\bsines?\b|cosines?|\b(SSS|SAS|AAS|ASA|SSA)\b|ambiguous|included|two triangles|one triangle|no triangle'
worked:   # used for the worked-examples recording document
  title: "TE5 Worked Examples: The Law of Sines and the Law of Cosines"
  coreQuestion: "Do I know a side and the angle across from it? That one question decides which law to use."
  coreFollowup: "If you know a side and its opposite angle, or can find one by subtracting from 180 degrees, use the law of sines. If you don't, because you have three sides or two sides with the angle between them, use the law of cosines first. With two sides and an angle that is not between them, the law of sines gives an angle B, but 180 degrees minus B might work too, so always check for a second triangle."
summary:   # the Quick Summary tab
  intro: 'Every TE5 question comes back to one idea: <strong>look for a side and the angle across from it.</strong> In triangle <span>\( ABC \)</span>, side <span>\( a \)</span> is across from angle <span>\( A \)</span>, side <span>\( b \)</span> from <span>\( B \)</span>, and side <span>\( c \)</span> from <span>\( C \)</span>. A matching pair unlocks the law of sines. Without one, start with the law of cosines.'
  caption: "Which law to use for each kind of triangle question, and what to watch for"
  columns: ["You know", "Use", "Watch out for"]
  rows:     # first cell of each row is the row header
    -
      - 'Three sides'
      - 'Law of cosines for an angle: <span>\( \cos C=\dfrac{a^{2}+b^{2}-c^{2}}{2ab} \)</span>. Find the largest angle first, across from the longest side.'
      - 'A negative cosine is fine: it means the angle is obtuse, more than 90°.'
    -
      - 'Two sides and the angle between them'
      - 'Law of cosines for the third side: <span>\( c^{2}=a^{2}+b^{2}-2ab\cos C \)</span>.'
      - 'Keep the 2 in <span>\( 2ab \)</span>, subtract, and take the square root at the end.'
    -
      - 'Two angles and any side'
      - 'Subtract from 180° for the third angle. Then use the law of sines: <span>\( \dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C} \)</span>.'
      - 'Pair each side with the angle across from it. Find the third angle before you need it.'
    -
      - 'Two sides and an angle that is not between them'
      - 'Law of sines for a second angle, <span>\( B \)</span>. Then test <span>\( 180^\circ-B \)</span>: if it plus the given angle is under 180°, there is a second triangle.'
      - 'Stopping after the first answer. Compare side <span>\( a \)</span> with the height <span>\( h=b\sin A \)</span> and with <span>\( b \)</span>.'
  note: 'Use <strong>degree mode</strong>, and round only at the end, to the nearest tenth. CheckIt asks you to say which law you used and why, and, for two sides and a non-included angle, to show that you checked for a second triangle. A quick check on any answer: the longest side is across from the largest angle, and the three angles add to 180°. Your CheckIt triangles will have different numbers than these examples. The reasoning is what transfers.'
tabs:
  - id: which
    label: "Try It: Which Law?"
    heading: "Try It: Which Law?"
    intro: |-
      Before you calculate, decide which tool to start with. Make your best guess on each one, then check it. Ask yourself: do I know a side and the angle across from it?
    items:
      - id: wl1
        title: "Which Law 1"
        figure:
          file: figures/TE5/wl1.svg
          title: "A triangle marked with three side lengths"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Side c, the bottom side from A to B, is marked 12. Side b, from A to C, is marked 9. Side a, from B to C, is marked 7. No angles are marked.'
        math:
          display: 'a=7,\quad b=9,\quad c=12'
          speak: "a equals 7. b equals 9. c equals 12"
        prompt: 'Which tool should you use first to solve this triangle?'
        choices:
          - {value: a, label: "The law of sines"}
          - {value: b, label: "The law of cosines"}
          - {value: c, label: "The Pythagorean Theorem"}
          - {value: d, label: "There is not enough information."}
        correct: b
        explanation: |-
          With three sides and no angles, there is no side-and-opposite-angle pair, so the law of sines has nothing to start from. The law of cosines turns three sides into an angle. The Pythagorean Theorem only works when there is a 90° angle, which is not given. <strong>Start with the law of cosines.</strong>
      - id: wl2
        title: "Which Law 2"
        figure:
          file: figures/TE5/wl2.svg
          title: "A triangle marked with two angles and one side"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle A is marked 40°. Angle B is marked 65°. Side a, from B to C, is marked 10. Sides b and c are not marked.'
        math:
          display: 'A=40^\circ,\quad B=65^\circ,\quad a=10'
          speak: "A equals 40 degrees. B equals 65 degrees. a equals 10"
        prompt: 'Which tool should you use first to solve this triangle?'
        choices:
          - {value: a, label: "The law of cosines"}
          - {value: b, label: "The Pythagorean Theorem"}
          - {value: c, label: "The law of sines"}
          - {value: d, label: "There is not enough information."}
        correct: c
        explanation: |-
          Side \( a=10 \) and angle \( A=40^\circ \) are across from each other, a matching pair. That is exactly what the law of sines needs: \( \tfrac{a}{\sin A}=\tfrac{b}{\sin B} \) gives \( b \) right away. The law of cosines needs two sides to start. <strong>Use the law of sines.</strong>
      - id: wl3
        title: "Which Law 3"
        figure:
          file: figures/TE5/wl3.svg
          title: "A triangle marked with two sides and one angle"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle B, at the bottom right corner, is marked 50°. Side c, the bottom side from A to B, is marked 11. Side a, from B to C, is marked 8. Side b and angles A and C are not marked.'
        math:
          display: 'a=8,\quad c=11,\quad B=50^\circ'
          speak: "a equals 8. c equals 11. B equals 50 degrees"
        prompt: 'Which tool should you use first to solve this triangle?'
        choices:
          - {value: a, label: "There is not enough information."}
          - {value: b, label: "The law of sines"}
          - {value: c, label: "The Pythagorean Theorem"}
          - {value: d, label: "The law of cosines"}
        correct: d
        explanation: |-
          The known angle \( B \) sits where the two known sides \( a \) and \( c \) meet, so the side across from it, \( b \), is unknown. No matching pair means no law of sines yet. The law of cosines finds the third side: \( b^{2}=a^{2}+c^{2}-2ac\cos B \). After that, there is a pair, and the law of sines can finish. <strong>Start with the law of cosines.</strong>
      - id: wl4
        title: "Which Law 4"
        figure:
          file: figures/TE5/wl4.svg
          title: "A triangle marked with two angles and the side joining them"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle A is marked 35°. Angle B is marked 80°. Side c, the bottom side from A to B, is marked 14. Sides a and b and angle C are not marked.'
        math:
          display: 'A=35^\circ,\quad B=80^\circ,\quad c=14'
          speak: "A equals 35 degrees. B equals 80 degrees. c equals 14"
        prompt: 'Which tool should you use to solve this triangle?'
        choices:
          - {value: a, label: "The law of sines, after finding angle C"}
          - {value: b, label: "There is not enough information."}
          - {value: c, label: "The law of cosines, using the two angles"}
          - {value: d, label: "The Pythagorean Theorem, using side c"}
        correct: a
        explanation: |-
          The angles of a triangle add to 180°, so \( C=180^\circ-35^\circ-80^\circ=65^\circ \). Now side \( c=14 \) and angle \( C=65^\circ \) are a matching pair, and the law of sines finds \( a \) and \( b \). It can look like there is not enough information, but two angles always give the third. <strong>Find \( C \), then use the law of sines.</strong>
  - id: cosines
    label: "Try It: Law of Cosines"
    heading: "Try It: Law of Cosines"
    intro: |-
      These triangles have three sides, or two sides and the angle between them. Make your best guess, then check it. Use degree mode and round to the nearest tenth.
    items:
      - id: lc1
        title: "Solve 1"
        figure:
          file: figures/TE5/lc1.svg
          title: "A triangle marked with two sides, the angle where they meet, and an unknown side"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle C, at the top, is marked 50°. Side b, from A to C, is marked 11. Side a, from B to C, is marked 8. Side c, the bottom side, is marked with a question mark.'
        math:
          display: 'a=8,\quad b=11,\quad C=50^\circ'
          speak: "a equals 8. b equals 11. C equals 50 degrees"
        prompt: 'Find side \( c \).'
        choices:
          - {value: a, label: "about 11.3"}
          - {value: b, label: "about 17.3"}
          - {value: c, label: "about 8.5"}
          - {value: d, label: "about 3.9"}
        correct: c
        explanation: |-
          \( c^{2}=8^{2}+11^{2}-2(8)(11)\cos 50^\circ=185-113.1=71.9 \), so \( c\approx 8.5 \). The answer 11.3 leaves out the 2 in \( 2ab \). The answer 17.3 adds instead of subtracting. The answer 3.9 comes from radian mode. <strong>\( c\approx 8.5 \).</strong>
      - id: lc2
        title: "Solve 2"
        figure:
          file: figures/TE5/lc2.svg
          title: "A triangle marked with three sides and an unknown angle at the top"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Side c, the bottom side, is marked 12. Side b, from A to C, is marked 9. Side a, from B to C, is marked 7. Angle C, at the top, is marked with a question mark.'
        math:
          display: 'a=7,\quad b=9,\quad c=12'
          speak: "a equals 7. b equals 9. c equals 12"
        prompt: 'Find angle \( C \), to the nearest tenth of a degree.'
        choices:
          - {value: a, label: "about 83.6°"}
          - {value: b, label: "about 96.4°"}
          - {value: c, label: "No triangle: the cosine is negative."}
          - {value: d, label: "about 48.2°"}
        correct: b
        explanation: |-
          \( \cos C=\tfrac{7^{2}+9^{2}-12^{2}}{2(7)(9)}=\tfrac{-14}{126}\approx-0.111 \), so \( C=\cos^{-1}(-0.111)\approx 96.4^\circ \). A negative cosine just means \( C \) is obtuse, which makes sense: it is across from the longest side. The answer 83.6 drops the negative sign, and 48.2 puts the sides in the wrong places. <strong>\( C\approx 96.4^\circ \).</strong>
      - id: lc3
        title: "Solve 3"
        figure:
          file: figures/TE5/lc3.svg
          title: "A triangle with a wide angle at A, two marked sides, and an unknown side"
          caption: 'Triangle ABC, not drawn to scale. A is at the bottom middle, B at the bottom right, and C at the upper left, so the angle at A opens wide. Angle A is marked 110°. Side c, from A to B along the bottom, is marked 9. Side b, from A up to C, is marked 5. Side a, the long side from B to C, is marked with a question mark.'
        math:
          display: 'b=5,\quad c=9,\quad A=110^\circ'
          speak: "b equals 5. c equals 9. A equals 110 degrees"
        prompt: 'Find side \( a \).'
        choices:
          - {value: a, label: "about 8.7"}
          - {value: b, label: "about 136.8"}
          - {value: c, label: "14"}
          - {value: d, label: "about 11.7"}
        correct: d
        explanation: |-
          \( a^{2}=5^{2}+9^{2}-2(5)(9)\cos 110^\circ \). Since \( \cos 110^\circ\approx-0.342 \) is negative, subtracting it adds: \( a^{2}=106+30.8=136.8 \), and \( a\approx 11.7 \). The answer 8.7 treats the cosine as positive. The answer 136.8 forgets the square root, and 14 just adds the sides. <strong>\( a\approx 11.7 \).</strong>
      - id: lc4
        title: "Solve 4"
        figure:
          file: figures/TE5/lc4.svg
          title: "A triangle marked with three sides and an unknown angle at A"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Side c, the bottom side, is marked 10. Side b, from A to C, is marked 8. Side a, from B to C, is marked 5. Angle A is marked with a question mark.'
        math:
          display: 'a=5,\quad b=8,\quad c=10'
          speak: "a equals 5. b equals 8. c equals 10"
        prompt: 'Find angle \( A \), to the nearest tenth of a degree.'
        choices:
          - {value: a, label: "about 29.7°"}
          - {value: b, label: "about 60.3°"}
          - {value: c, label: "about 52.4°"}
          - {value: d, label: "about 0.5°"}
        correct: a
        explanation: |-
          For angle \( A \), side \( a \) is the one subtracted: \( \cos A=\tfrac{8^{2}+10^{2}-5^{2}}{2(8)(10)}=\tfrac{139}{160}\approx 0.869 \), so \( A\approx 29.7^\circ \). The answer 52.4 is angle \( B \). The answer 60.3 uses inverse sine, and 0.5 comes from radian mode. <strong>\( A\approx 29.7^\circ \).</strong>
  - id: sines
    label: "Try It: Law of Sines"
    heading: "Try It: Law of Sines"
    intro: |-
      Each triangle has a side and the angle across from it, or can get one. Make your best guess, then check it. Round to the nearest tenth.
    items:
      - id: ls1
        title: "Solve 5"
        figure:
          file: figures/TE5/ls1.svg
          title: "A triangle marked with two angles, one side, and an unknown side"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle A is marked 40°. Angle B is marked 65°. Side a, from B to C, is marked 10. Side b, from A to C, is marked with a question mark.'
        math:
          display: 'A=40^\circ,\quad B=65^\circ,\quad a=10'
          speak: "A equals 40 degrees. B equals 65 degrees. a equals 10"
        prompt: 'Find side \( b \).'
        choices:
          - {value: a, label: "about 5.8"}
          - {value: b, label: "about 7.1"}
          - {value: c, label: "about 15.0"}
          - {value: d, label: "about 14.1"}
        correct: d
        explanation: |-
          Set up the pairs: \( \tfrac{b}{\sin 65^\circ}=\tfrac{10}{\sin 40^\circ} \), so \( b=\tfrac{10\sin 65^\circ}{\sin 40^\circ}\approx 14.1 \). The answer 7.1 flips the ratio. The answer 5.8 multiplies the sines. The answer 15.0 is side \( c \). Check: \( b \) is across from the larger angle, so it should be longer than \( a \). <strong>\( b\approx 14.1 \).</strong>
      - id: ls2
        title: "Solve 6"
        figure:
          file: figures/TE5/ls2.svg
          title: "A triangle marked with two angles, the side joining them, and an unknown side"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle A is marked 35°. Angle B is marked 80°. Side c, the bottom side, is marked 14. Side a, from B to C, is marked with a question mark.'
        math:
          display: 'A=35^\circ,\quad B=80^\circ,\quad c=14'
          speak: "A equals 35 degrees. B equals 80 degrees. c equals 14"
        prompt: 'Find side \( a \).'
        choices:
          - {value: a, label: "about 15.2"}
          - {value: b, label: "about 8.9"}
          - {value: c, label: "about 22.1"}
          - {value: d, label: "about 8.2"}
        correct: b
        explanation: |-
          First \( C=180^\circ-35^\circ-80^\circ=65^\circ \), so side \( c=14 \) now has its pair. Then \( a=\tfrac{14\sin 35^\circ}{\sin 65^\circ}\approx 8.9 \). The answer 8.2 divides by \( \sin 80^\circ \), but 80° is across from \( b \), not \( c \). The answer 15.2 is side \( b \), and 22.1 flips the ratio. <strong>\( a\approx 8.9 \).</strong>
      - id: ls3
        title: "Solve 7"
        figure:
          file: figures/TE5/ls3.svg
          title: "A triangle with a wide angle at C, one marked side, and an unknown side"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top, where the angle opens wide. Angle A is marked 25°. Angle C is marked 105°. Side b, from A to C, is marked 9. Side a, from B to C, is marked with a question mark.'
        math:
          display: 'A=25^\circ,\quad C=105^\circ,\quad b=9'
          speak: "A equals 25 degrees. C equals 105 degrees. b equals 9"
        prompt: 'Find side \( a \).'
        choices:
          - {value: a, label: "about 3.9"}
          - {value: b, label: "about 11.3"}
          - {value: c, label: "about 5.0"}
          - {value: d, label: "about 16.3"}
        correct: c
        explanation: |-
          Side \( b \) needs its angle: \( B=180^\circ-25^\circ-105^\circ=50^\circ \). Then \( a=\tfrac{9\sin 25^\circ}{\sin 50^\circ}\approx 4.97 \), which rounds to 5.0. The answer 3.9 pairs \( b \) with the 105° angle, which is across from \( c \). The answer 11.3 is side \( c \), and 16.3 flips the ratio. <strong>\( a\approx 5.0 \).</strong>
      - id: ls4
        title: "Solve 8"
        figure:
          file: figures/TE5/ls4.svg
          title: "A triangle marked with angle A, two sides, and an unknown angle at B"
          caption: 'Triangle ABC, not drawn to scale, with A at the bottom left, B at the bottom right, and C at the top. Angle A is marked 50°. Side a, from B to C, is marked 12. Side b, from A to C, is marked 9. Angle B is marked with a question mark.'
        math:
          display: 'A=50^\circ,\quad a=12,\quad b=9'
          speak: "A equals 50 degrees. a equals 12. b equals 9"
        prompt: 'Find angle \( B \), to the nearest tenth of a degree.'
        choices:
          - {value: a, label: "about 35.1°"}
          - {value: b, label: "about 144.9°"}
          - {value: c, label: "about 0.6°"}
          - {value: d, label: "about 48.6°"}
        correct: a
        explanation: |-
          \( \tfrac{\sin B}{9}=\tfrac{\sin 50^\circ}{12} \), so \( \sin B\approx 0.575 \) and \( B\approx 35.1^\circ \). Could \( B \) be \( 180^\circ-35.1^\circ=144.9^\circ \)? No: \( 144.9^\circ+50^\circ \) is more than 180°. Side \( a \) is longer than \( b \), so only one triangle is possible. The answer 0.6 is the sine, not the angle, and 48.6 skips the sines. <strong>\( B\approx 35.1^\circ \).</strong>
  - id: two
    label: "Try It: One or Two Triangles?"
    heading: "Try It: One or Two Triangles?"
    intro: |-
      Here you know two sides and an angle that is not between them. Side a has to swing from C down to the bottom line. Make your best guess, then check it. Ask yourself: how many places can it land?
    items:
      - id: am1
        title: "How Many 1"
        figure:
          file: figures/TE5/am1.svg
          title: "Angle A with side b drawn to C and a dashed height from C to the bottom line"
          caption: 'Angle A, at the bottom left, is marked 30°, with a long bottom line running to the right. Side b runs from A up to point C and is marked 10. A dashed line labeled h drops straight down from C and meets the bottom line at a right angle. A note says side a = 6 must reach the bottom line from C. Side a itself is not drawn.'
        math:
          display: 'A=30^\circ,\quad b=10,\quad a=6'
          speak: "A equals 30 degrees. b equals 10. a equals 6"
        prompt: 'How many triangles fit these measurements?'
        choices:
          - {value: a, label: "None"}
          - {value: b, label: "Exactly one"}
          - {value: c, label: "Two"}
          - {value: d, label: "Infinitely many"}
        correct: c
        explanation: |-
          The height is \( h=b\sin A=10\sin 30^\circ=5 \). Side \( a=6 \) is longer than the height, so it reaches the bottom line. It is also shorter than \( b=10 \), so it can land in two places, one on each side of the height. <strong>Two triangles fit.</strong>
      - id: am2
        title: "How Many 2"
        figure:
          file: figures/TE5/am2.svg
          title: "Angle A with side b drawn to C and a dashed height from C to the bottom line"
          caption: 'Angle A, at the bottom left, is marked 35°, with a long bottom line running to the right. Side b runs from A up to point C and is marked 8. A dashed line labeled h drops straight down from C and meets the bottom line at a right angle. A note says side a = 12 must reach the bottom line from C. Side a itself is not drawn.'
        math:
          display: 'A=35^\circ,\quad b=8,\quad a=12'
          speak: "A equals 35 degrees. b equals 8. a equals 12"
        prompt: 'How many triangles fit these measurements?'
        choices:
          - {value: a, label: "Exactly one"}
          - {value: b, label: "Two"}
          - {value: c, label: "None"}
          - {value: d, label: "Infinitely many"}
        correct: a
        explanation: |-
          The height is \( h=8\sin 35^\circ\approx 4.6 \), and \( a=12 \) is longer, so it reaches the line. But \( a \) is also longer than \( b=8 \). Swinging toward \( A \), it would land behind \( A \), on the wrong side, so only one landing point makes a triangle. When \( a\ge b \), there is exactly one. <strong>Exactly one triangle fits.</strong>
      - id: am3
        title: "Swing 1"
        figure:
          file: figures/TE5/am3.svg
          title: "Side a swinging from C to two points on the bottom line"
          caption: 'Not drawn to scale. Angle A, at the bottom left, is marked 30°, and side b = 10 runs from A up to C. From C, side a = 6 is drawn to two points on the bottom line: B1, farther from A (solid line), and B2, closer to A (dashed line). A dashed arc centered at C passes through both points.'
        math:
          display: 'A=30^\circ,\quad b=10,\quad a=6'
          speak: "A equals 30 degrees. b equals 10. a equals 6"
        prompt: 'Both triangles fit. What are the two possible values of angle \( B \)?'
        choices:
          - {value: a, label: "about 56.4° only"}
          - {value: b, label: "about 33.6° and about 146.4°"}
          - {value: c, label: "about 56.4° and about 123.6°"}
          - {value: d, label: "about 56.4° and about 93.6°"}
        correct: c
        explanation: |-
          The law of sines gives \( \sin B=\tfrac{10\sin 30^\circ}{6}\approx 0.833 \), so \( B\approx 56.4^\circ \) at \( B_1 \). The second triangle uses the supplement, \( 180^\circ-56.4^\circ=123.6^\circ \) at \( B_2 \). It works because \( 30^\circ+123.6^\circ \) is under 180°. The value 93.6° is angle \( C \) in the first triangle, not a second \( B \). <strong>\( B\approx 56.4^\circ \) or \( B\approx 123.6^\circ \).</strong>
      - id: am4
        title: "Swing 2"
        figure:
          file: figures/TE5/am3.svg
          title: "Side a swinging from C to two points on the bottom line"
          caption: 'Not drawn to scale. Angle A, at the bottom left, is marked 30°, and side b = 10 runs from A up to C. From C, side a = 6 is drawn to two points on the bottom line: B1, farther from A (solid line), and B2, closer to A (dashed line). A dashed arc centered at C passes through both points.'
        math:
          display: 'A=30^\circ,\quad b=10,\quad a=6'
          speak: "A equals 30 degrees. b equals 10. a equals 6"
        prompt: 'Using \( B\approx 56.4^\circ \) or \( B\approx 123.6^\circ \), what are the two possible lengths of side \( c \)?'
        choices:
          - {value: a, label: "about 12.0 only"}
          - {value: b, label: "about 5.3 only"}
          - {value: c, label: "about 8.0 and about 12.0"}
          - {value: d, label: "about 12.0 and about 5.3"}
        correct: d
        explanation: |-
          Find \( C \) in each triangle first: \( C=180^\circ-30^\circ-56.4^\circ=93.6^\circ \), or \( C=180^\circ-30^\circ-123.6^\circ=26.4^\circ \). Then \( c=\tfrac{6\sin C}{\sin 30^\circ} \): about 12.0 in the first triangle and about 5.3 in the second. The answer 8.0 treats the triangle as a right triangle. <strong>\( c\approx 12.0 \) or \( c\approx 5.3 \).</strong>
  - id: slip
    label: "Try It: Spot the Slip"
    heading: "Try It: Spot the Slip"
    intro: |-
      Each set of work below was written by a student. Decide whether it is right, and if not, what went wrong, before you check. Checking someone else's work is good practice for checking your own.
    items:
      - id: sl1
        title: "Slip 1"
        math:
          display: '\begin{aligned} c^{2}&=8^{2}+11^{2}\\ &\quad-8\cdot 11\cos 50^\circ\\ c&\approx 11.3 \end{aligned}'
          speak: "c squared equals 8 squared plus 11 squared minus 8 times 11 times cosine of 50 degrees, so c is about 11.3"
        prompt: 'In triangle \( ABC \), \( a=8 \), \( b=11 \), and \( C=50^\circ \). A student wrote this work. What is the mistake, if any?'
        choices:
          - {value: a, label: "The minus should be a plus, giving about 17.3."}
          - {value: b, label: "The formula needs 2ab, so c is about 8.5."}
          - {value: c, label: "There is no mistake."}
          - {value: d, label: "The calculator should be in radians: about 3.9."}
        correct: b
        explanation: |-
          The law of cosines is \( c^{2}=a^{2}+b^{2}-2ab\cos C \). The student left out the 2. With it, \( c^{2}=185-113.1=71.9 \), so \( c\approx 8.5 \). <strong>The correct value is \( c\approx 8.5 \).</strong>
      - id: sl2
        title: "Slip 2"
        math:
          display: '\dfrac{6}{\sin A}=\dfrac{10}{\sin C}'
          speak: "6 over sine of A equals 10 over sine of C"
        prompt: 'In triangle \( ABC \), \( a=6 \), \( c=10 \), and \( B=40^\circ \). A student started with this line. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake; cross-multiply to finish."}
          - {value: b, label: "Use the Pythagorean Theorem: b is about 11.7."}
          - {value: c, label: "No side-angle pair is known; use cosines."}
          - {value: d, label: "The 6 and 10 should trade places in the ratio."}
        correct: c
        explanation: |-
          Both \( A \) and \( C \) are unknown, so this equation has two unknowns and cannot be solved. The known angle \( B \) is between the two known sides, so use the law of cosines first: \( b^{2}=36+100-120\cos 40^\circ \), and \( b\approx 6.6 \). Then the law of sines can finish. <strong>Start with the law of cosines.</strong>
      - id: sl3
        title: "Slip 3"
        math:
          display: '\begin{aligned} \sin B&\approx 0.833\\ B&\approx 56.4^\circ \end{aligned}'
          speak: "sine of B is about 0.833. Next line: B is about 56.4 degrees"
        prompt: 'In triangle \( ABC \), \( A=30^\circ \), \( a=6 \), and \( b=10 \). A student found this, then said there is only one triangle. What is the mistake, if any?'
        choices:
          - {value: a, label: "B can also be 123.6°, so there are two triangles."}
          - {value: b, label: "B should be 33.6°, the other acute angle."}
          - {value: c, label: "There is no triangle at all, since a is less than b and h."}
          - {value: d, label: "There is no mistake."}
        correct: a
        explanation: |-
          The sine of \( 123.6^\circ \) is also about 0.833, and \( 30^\circ+123.6^\circ \) is under 180°, so a second triangle fits. The check: \( h=10\sin 30^\circ=5 \), and side \( a=6 \) is between \( h \) and \( b=10 \). <strong>There are two triangles: \( B\approx 56.4^\circ \) or \( B\approx 123.6^\circ \).</strong>
      - id: sl4
        title: "Slip 4"
        math:
          display: '\begin{aligned} C&=180^\circ-40^\circ-65^\circ=75^\circ\\ c&=\tfrac{10\sin 75^\circ}{\sin 40^\circ}\approx 15.0 \end{aligned}'
          speak: "C equals 180 degrees minus 40 degrees minus 65 degrees, which is 75 degrees. Next line: c equals 10 times sine of 75 degrees, divided by sine of 40 degrees, which is about 15.0"
        prompt: 'In triangle \( ABC \), \( A=40^\circ \), \( B=65^\circ \), and \( a=10 \). A student wrote these lines. What is the mistake, if any?'
        choices:
          - {value: a, label: "The sines should be flipped, giving about 6.7."}
          - {value: b, label: "Angle C should be 105°, from 40 plus 65."}
          - {value: c, label: "The law of cosines is needed instead."}
          - {value: d, label: "There is no mistake."}
        correct: d
        explanation: |-
          The third angle is \( 75^\circ \), and side \( a=10 \) pairs with \( A=40^\circ \), so \( c=\tfrac{10\sin 75^\circ}{\sin 40^\circ}\approx 15.0 \). The longest side is across from the largest angle, as it should be. <strong>There is no mistake.</strong>
      - id: sl5
        title: "Slip 5"
        math:
          display: '\begin{aligned} \cos C&=\dfrac{7^{2}+9^{2}-12^{2}}{2(7)(9)}\\ &\approx -0.111 \end{aligned}'
          speak: "cosine of C equals 7 squared plus 9 squared minus 12 squared, over 2 times 7 times 9, which is about negative 0.111"
        prompt: 'In triangle \( ABC \), \( a=7 \), \( b=9 \), and \( c=12 \). A student got this and said a cosine cannot be negative, so there is no triangle. What is the mistake, if any?'
        choices:
          - {value: a, label: "There is no mistake."}
          - {value: b, label: "A negative cosine means C is obtuse: about 96.4°."}
          - {value: c, label: "Drop the negative sign, so C is about 83.6°."}
          - {value: d, label: "The 12 squared should be added, not subtracted, on top."}
        correct: b
        explanation: |-
          Cosine is negative for angles between 90° and 180°. So \( C=\cos^{-1}(-0.111)\approx 96.4^\circ \), an obtuse angle across from the longest side. <strong>The triangle exists: \( C\approx 96.4^\circ \).</strong>
