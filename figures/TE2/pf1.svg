<svg viewBox="0 0 560 440" font-family="Arial, Helvetica, sans-serif" font-size="24">
<rect x="0" y="0" width="560" height="440" fill="#fcfcfc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker></defs>
<rect x="20" y="10" width="520" height="54" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="3"/>
<text x="280" y="45" text-anchor="middle" fill="#1a1a2e" font-weight="bold" font-size="25">1. Start with one side</text>
<line x1="280" y1="64" x2="280" y2="79" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="20" y="80" width="520" height="54" rx="10" fill="#ffffff" stroke="#1a6b6b" stroke-width="3"/>
<text x="280" y="115" text-anchor="middle" fill="#1a1a2e" font-weight="bold" font-size="25">2. Rewrite in sin and cos</text>
<line x1="280" y1="134" x2="280" y2="149" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="20" y="150" width="520" height="54" rx="10" fill="#ffffff" stroke="#1a6b6b" stroke-width="3"/>
<text x="280" y="185" text-anchor="middle" fill="#1a1a2e" font-weight="bold" font-size="25">3. Distribute, combine, simplify</text>
<line x1="280" y1="204" x2="280" y2="219" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="20" y="220" width="520" height="54" rx="10" fill="#ffffff" stroke="#1a6b6b" stroke-width="3"/>
<text x="280" y="255" text-anchor="middle" fill="#1a1a2e" font-weight="bold" font-size="25">4. Use sin² + cos² = 1 if needed</text>
<line x1="280" y1="274" x2="280" y2="289" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="20" y="290" width="520" height="54" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="3"/>
<text x="280" y="325" text-anchor="middle" fill="#1a1a2e" font-weight="bold" font-size="25">5. Rename to reach the other side</text>
<rect x="20" y="364" width="520" height="72" rx="10" fill="#f7f1ec" stroke="#a84d16" stroke-width="3"/>
<text x="280" y="394" text-anchor="middle" fill="#1a1a2e" font-size="22">Go from one side to the other. Never do</text>
<text x="280" y="422" text-anchor="middle" fill="#1a1a2e" font-size="22">the same operation to both sides.</text>
</svg>
